<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>机械原理简答题背诵手册 · 155 题</title>
<style>
:root{
  --bg:#f1f5f5; --card:#ffffff;
  --ink:#0f1a19; --ink2:#3d4b4a; --muted:#84928f;
  --line:#e1e9e8; --line2:#edf3f2;
  --ac:#0f766e; --ac-d:#0a5a54; --ac-s:#e6f3f1; --ac-b:#b3d8d2;
  --sh:0 1px 2px rgba(12,40,36,.04);
  --sh2:0 10px 26px rgba(12,40,36,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit}
::selection{background:#cfe8e3;color:#0a4b45}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cdd9d7;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.layout{display:flex;align-items:flex-start;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;width:218px;flex:0 0 218px;padding:24px 14px 18px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);z-index:20}
.main{flex:1;min-width:0;padding:30px 40px 150px}
.main-inner{max-width:920px;margin:0 auto}

/* 侧栏品牌 */
.rail-brand{display:flex;align-items:center;gap:10px;padding:0 6px 24px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#159085,#0a5a54);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(15,118,110,.28);flex:0 0 auto}
.logo svg{width:16px;height:16px}
.rb-text b{display:block;font-size:13.5px;font-weight:650;letter-spacing:.2px;line-height:1.3}
.rb-text span{display:block;font-size:9.5px;color:#a3b0ae;letter-spacing:.14em;margin-top:2px}

/* 一级导航：选中＝实心色块 */
.rail-nav{display:flex;flex-direction:column;gap:4px}
.rail-nav .tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;color:#55635f;font-size:13.5px;font-weight:500;cursor:pointer;transition:.16s}
.rail-nav .tab svg{width:17px;height:17px;flex:0 0 auto;opacity:.8}
.rail-nav .tab:hover{background:#f1f6f5;color:var(--ink)}
.rail-nav .tab.on{background:var(--ac);color:#fff;font-weight:600;box-shadow:0 4px 12px -2px rgba(15,118,110,.4)}
.rail-nav .tab.on svg{opacity:1}

/* 侧栏底部进度 */
.rail-card{margin-top:auto;background:#f5faf9;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.rc-row{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;color:#8a9795}
.rc-row b{font-size:13px;color:var(--ink);font-weight:650}
.rc-bar{height:5px;border-radius:4px;background:#e2edeb;overflow:hidden;margin:8px 0 7px}
.rc-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2aa199,var(--ac));transition:width .3s}
.rc-sub{font-size:11px;color:#9aa8a6}
.rc-sub b{color:#55635f;font-weight:600}

/* ============ 页头 ============ */
.hd{display:flex;gap:26px;align-items:stretch;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 28px;box-shadow:var(--sh)}
.hd-main{flex:1;min-width:260px}
.hd-eyebrow{font-size:10.5px;letter-spacing:.16em;color:#93a09e;display:flex;align-items:center;gap:8px}
.hd-eyebrow i{width:16px;height:2px;background:var(--ac);border-radius:2px;display:inline-block}
.hd-t{margin:12px 0 0;font-size:30px;line-height:1.35;font-weight:650;letter-spacing:.2px}
.hd-t em{font-style:normal;color:var(--ac)}
.hd-sub{margin-top:9px;font-size:12.5px;color:#7d8b89;letter-spacing:.02em}
.hd-tags{display:flex;gap:6px;margin-top:15px;flex-wrap:wrap}
.hd-tags span{font-size:11px;color:#3d6b65;background:var(--ac-s);border-radius:6px;padding:3px 8px;letter-spacing:.02em}
.hd-cd{position:relative;overflow:hidden;flex:0 0 236px;border-radius:16px;padding:16px 18px;color:#fff;background:linear-gradient(155deg,#137a71 0%,#0a4f4a 100%);box-shadow:0 10px 24px -10px rgba(10,79,74,.6)}
.hd-cd::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:13px 13px;opacity:.55;pointer-events:none}
.cd-k{position:relative;font-size:11.5px;color:rgba(255,255,255,.66);letter-spacing:.05em}
.cd-nums{position:relative;display:flex;align-items:baseline;gap:5px;margin-top:9px;white-space:nowrap;flex-wrap:wrap}
.cd-nums b{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1}
.cd-u{font-size:11.5px;color:rgba(255,255,255,.72)}
.cd-z{font-size:10.5px;color:rgba(255,255,255,.42);margin:0 -1px}
.cd-d{position:relative;margin-top:9px;font-size:10.5px;color:rgba(255,255,255,.46);letter-spacing:.05em}

/* KPI 条 */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0 22px;overflow:hidden;box-shadow:var(--sh)}
.kpi{padding:14px 18px;border-left:1px solid var(--line2)}
.kpi:first-child{border-left:0}
.kpi em{display:block;font-style:normal;font-size:11px;color:#93a09e;margin-bottom:5px;letter-spacing:.03em}
.kpi b{font-size:21px;font-weight:650;letter-spacing:-.3px;white-space:nowrap}
.kpi small{font-size:11.5px;color:#93a09e;margin-left:1px;font-weight:400}
body[data-view="stats"] .kpi-row{display:none}

/* ============ 今日条 ============ */
.daybar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:20px;box-shadow:var(--sh)}
.db-date{font-size:14.5px;font-weight:650;color:var(--ink);letter-spacing:.15em}
.db-date span{font-size:11px;font-weight:500;color:var(--ac-d);background:var(--ac-s);border-radius:5px;padding:2px 7px;margin-left:8px;letter-spacing:0}
.db-sub{font-size:12px;color:#8a9795;margin-top:5px}
.db-sub b{color:var(--ink2);font-weight:650}
.db-prog{flex:1;min-width:150px;max-width:300px}
.db-prog .track{height:6px;border-radius:4px;background:#e7f0ee;overflow:hidden}
.db-prog .track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2aa199,var(--ac));transition:width .35s}
.db-prog .num{display:flex;justify-content:space-between;font-size:10.5px;color:#9aa8a6;margin-top:5px}
.db-acts{display:flex;gap:8px;margin-left:auto}

/* ============ 按钮 ============ */
.btn{border:1px solid #dbe6e4;background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink2);transition:.15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:#bcd3cf;color:var(--ink);background:#fbfdfd}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;box-shadow:0 3px 10px -2px rgba(15,118,110,.45)}
.btn.primary:hover{background:var(--ac-d);border-color:var(--ac-d);color:#fff}
.btn.good{background:var(--ac-s);border-color:var(--ac-b);color:var(--ac-d);font-weight:650}
.btn.good:hover{background:#d8ece8}
.btn.mid{background:#fff;border-color:var(--ac-b);color:var(--ac);font-weight:600}
.btn.mid:hover{background:var(--ac-s)}
.btn.bad{background:#fff;border:1px dashed #d6e0de;color:#8a9795;font-weight:500}
.btn.bad:hover{background:#fafcfc;color:#5d6b68;border-color:#c3d2cf}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ac-b);outline-offset:2px}

.sect-title{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px;font-size:12px;color:#93a09e}
.sect-title b{color:var(--ink);font-weight:650;font-size:13px}
.sect-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);transform:translateY(-3px)}

/* ============ 卡片 ============ */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;margin-bottom:11px;transition:border-color .18s,box-shadow .18s}
.card:hover{border-color:#cfdedb;box-shadow:0 8px 20px rgba(12,50,44,.055)}
.card.pinned{border-color:var(--ac-b);background:linear-gradient(180deg,#fbfefd,#fff)}
.card-head{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#93a09e;flex-wrap:wrap;padding-right:26px}
.no{width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:var(--ac-s);color:var(--ac-d);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.chip{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid transparent;color:#5c6a68;background:#f1f5f4;white-space:nowrap;line-height:1.6;font-weight:500}
.chip.kp{color:#3d6b65;background:#eef5f4;white-space:normal;max-width:100%;line-height:1.5;border-radius:5px}
.chip.hot{color:var(--ac-d);background:var(--ac-s)}
.chip.normal{color:#5c6a68;background:#f1f5f4}
.chip.cold{color:#9aa8a6;background:transparent;border:1px dashed #d4e0de}
.chip.soft{color:#6d7b78;background:#f1f5f4}
.chip.flag,.chip.new{color:#6d7b78;background:#f3f7f6}
.chip.ok{color:var(--ac-d);background:var(--ac-s);font-weight:650}
.spacer{flex:1}
.star{position:absolute;top:14px;right:15px;border:0;background:none;cursor:pointer;font-size:15px;color:#d8e2e0;padding:2px;line-height:1;border-radius:6px;transition:.15s}
.star:hover{color:var(--ac);background:var(--ac-s)}
.star.on{color:var(--ac)}
.q{font-size:16.5px;line-height:1.74;margin:11px 0 0;font-weight:600;color:var(--ink);cursor:pointer;letter-spacing:.01em;transition:color .15s}
.q:hover{color:var(--ac-d)}
.fig{margin:13px 0 2px;text-align:center}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}

/* 答案 */
.answer{margin-top:13px;background:#f4f9f8;border-left:3px solid var(--ac-b);border-radius:0 11px 11px 0;padding:13px 15px 14px}
.ans-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px dashed #d9e8e5}
.ans-head span{font-size:10px;letter-spacing:.14em;color:#8fa39f}
.ans-head em{font-style:normal;font-size:10.5px;color:#aab8b5;margin-left:auto;letter-spacing:.04em}
.answer p{margin:0 0 7px;font-size:15px;line-height:1.9;color:#2f3d3b;text-indent:2em;text-align:justify;word-break:break-word}
.answer p:last-child{margin-bottom:0}
.answer b{font-weight:650;color:var(--ink)}
.answer p.fml{text-align:center;margin:11px 0;line-height:2.25;font-size:1.02em;text-indent:0}
.answer p.item{display:flex;gap:8px;text-indent:0;text-align:left;padding-left:1.2em;margin:0 0 6px}
.answer p.item i{font-style:normal;flex:0 0 auto;color:#0d6b63;font-weight:650;letter-spacing:.02em}
.answer p.item span{flex:1;min-width:0;text-align:justify}
/* 结构化要点：编号 + 红字标签 + 正文 */
.answer ol.pts{list-style:none;margin:0;padding:0}
.answer ol.pts li{padding-left:1.4em;text-indent:-1.4em;margin:0 0 9px;font-size:15px;line-height:1.9;color:#2f3d3b;text-align:justify;word-break:break-word}
.answer ol.pts li i.mk{display:inline-block;width:1.4em;text-indent:0;color:#9db1ad;font-size:12.5px;font-weight:700;font-style:normal;font-variant-numeric:tabular-nums}
.answer ol.pts li b{color:#c0392b;font-weight:650}
.answer ol.pts li:last-child{margin-bottom:0}
.answer ol.pts.one li{padding-left:0;text-indent:0}
/* 二级要点 */
.answer ol.pts ol.pts{margin:7px 0 2px;padding:1px 0 1px .9em;border-left:1px solid #dcebe8}
.answer ol.pts ol.pts li{padding-left:1.62em;text-indent:-1.62em;margin:0 0 6px;font-size:14.5px;line-height:1.8;color:#37474a}
.answer ol.pts ol.pts li i.mk{width:1.62em;color:#4f8b83;font-size:14px;font-weight:400}
.answer ol.pts ol.pts li:last-child{margin-bottom:0}
.answer ol.pts ol.pts li b{color:#c0392b}
.mine-tag{font-size:10px;color:var(--ac-d);background:#d9ece8;border-radius:4px;padding:2px 6px;font-weight:600}
.frac{display:inline-flex;flex-direction:column;vertical-align:-0.5em;text-align:center;margin:0 .2em;font-size:.9em;line-height:1.2}
.frac .num{border-bottom:1px solid currentColor;padding:0 .2em}
.frac .den{padding:0 .2em}
.vec{position:relative;padding-top:.1em}
.vec::after{content:"";position:absolute;left:0;right:0;top:-.06em;height:1px;background:currentColor}
sup,sub{font-size:.7em;line-height:0}

/* 解析 */
.exp{margin-top:10px;border:1px dashed #d3e5e1;border-radius:10px;background:#fbfdfd;padding:0 0 0 0;overflow:hidden}
.exp-t{width:100%;display:flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;padding:9px 13px;font-size:11.5px;color:#4f6b67;font-family:inherit;text-align:left}
.exp-t:hover{background:#f4faf9}
.exp-t i{font-style:normal;margin-left:auto;color:#9db0ac;font-size:10.5px}
.exp-t::before{content:"";width:3px;height:11px;border-radius:2px;background:#8fc4bc;display:inline-block}
.exp-b{padding:0 14px 12px 14px}
.exp-b p{margin:0 0 8px;font-size:13.6px;line-height:1.9;color:#48585a;text-indent:2em;text-align:justify}
.exp-b p.lab{text-indent:0;text-align:left}
.exp-b p.item{display:flex;gap:7px;text-indent:0;text-align:left;padding-left:1em;margin:0 0 6px}
.exp-b p.item i{font-style:normal;flex:0 0 auto;color:#0d6b63;font-weight:650}
.exp-b p.item span{flex:1;min-width:0;text-align:justify}
.exp-b p.lab b{display:inline-block;font-size:10px;color:#0a5a54;background:#e2f1ee;border-radius:4px;padding:1.5px 6px;margin-right:7px;letter-spacing:.06em;font-weight:650;vertical-align:1.5px}
.exp-b p:last-child{margin-bottom:0}

.actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;align-items:center}
.actions .dt{font-size:11px;color:#b0bcb9;margin-left:auto;letter-spacing:.03em}
textarea.editor{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14.5px;line-height:1.9;font-family:inherit;color:var(--ink2);background:#fff;resize:vertical;outline:none}
textarea.editor:focus{border-color:var(--ac-b);box-shadow:0 0 0 3px rgba(15,118,110,.07)}

/* ============ 题库工具条 ============ */
.lib-head{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.lib-head .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.lib-head .row2{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search{flex:1;min-width:190px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-size:13.5px;outline:none;color:var(--ink);transition:.15s}
.search::placeholder{color:#a9b6b3}
.search:focus{border-color:var(--ac-b);box-shadow:0 0 0 3px rgba(15,118,110,.08)}
.chapsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:#fff;color:var(--ink2);font-family:inherit;max-width:260px;cursor:pointer;outline:none}
.chapsel:focus{border-color:var(--ac-b);box-shadow:0 0 0 3px rgba(15,118,110,.08)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.ch{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#6d7b78;transition:.13s;font-weight:500}
.ch:hover{border-color:#c6d8d5;color:var(--ink)}
.ch.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 2px 8px -2px rgba(15,118,110,.5)}
.count{font-size:12px;color:#93a09e;white-space:nowrap}
.count b{color:var(--ink);font-weight:650}

/* ============ 统计 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--sh)}
.stat em{display:block;font-style:normal;font-size:11px;color:#93a09e;margin-bottom:6px}
.stat b{font-size:23px;font-weight:650;letter-spacing:-.5px}
.stat small{color:#93a09e;font-size:11.5px;margin-left:2px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 19px;box-shadow:var(--sh);margin-top:12px}
.panel h3{margin:0 0 14px;font-size:13px;letter-spacing:.04em;font-weight:650;display:flex;align-items:center;gap:8px;color:var(--ink)}
.panel h3::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--ac)}
.panel p.note{font-size:11.5px;color:#93a09e;margin:11px 0 0;line-height:1.75}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,17px);grid-auto-columns:17px;gap:4px;justify-content:start}
.heat i{border-radius:3px;background:#e4eeec;display:block}
.heat i.on{background:linear-gradient(150deg,#2aa199,var(--ac))}
.heat i.today{box-shadow:0 0 0 1.5px var(--ink)}
.bars{display:flex;align-items:flex-end;gap:12px;height:112px;margin-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:#93a09e}
.bars .b i{width:min(100%,24px);background:linear-gradient(180deg,#2aa199,var(--ac));border-radius:4px 4px 2px 2px;min-height:2px;display:block}
.bars .b b{font-size:12px;color:var(--ink);font-weight:650}
.chap-row{display:grid;grid-template-columns:1fr 140px 48px;gap:12px;align-items:center;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line2);color:var(--ink2)}
.chap-row:last-child{border:0}
.track{height:6px;background:#e7f0ee;border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,#2aa199,var(--ac));border-radius:4px}
.track.g i{background:#d5dfdd}

/* ============ 设置 ============ */
.field{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:13px;flex-wrap:wrap;color:var(--ink2)}
.field:last-child{border:0}
.field label{min-width:96px;color:var(--ink);font-weight:650;font-size:12.5px}
.field .hint{color:#93a09e;font-size:11.5px;line-height:1.75;flex-basis:100%;margin-left:96px}
.field .desc{color:#93a09e;font-size:11.5px}
input[type=number],input[type=text]{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;outline:none;font-family:inherit;background:#fff;color:var(--ink);transition:.15s}
input[type=number]{width:74px}
input[type=text]{width:280px;max-width:100%}
input[type=date]{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--ac-b);box-shadow:0 0 0 3px rgba(15,118,110,.08)}
input[type=checkbox]{accent-color:var(--ac);width:auto}
input[type=file]{font-size:11.5px;color:#93a09e;max-width:100%}
input[type=file]::file-selector-button{border:1px solid #dbe6e4;background:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;color:var(--ink2);font-family:inherit;cursor:pointer;margin-right:8px}
input[type=file]::file-selector-button:hover{border-color:#bcd3cf}

/* ============ 专注模式 ============ */
.focus{position:fixed;inset:0;background:rgba(9,26,24,.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.fcard{background:#fff;border-radius:18px;width:100%;max-width:740px;max-height:90vh;overflow:auto;padding:22px 24px 24px;box-shadow:0 30px 70px rgba(9,26,24,.3)}
.fcard .top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#93a09e;flex-wrap:wrap}
.fcard .q{font-size:19px;line-height:1.75;margin:15px 0 0;cursor:default;font-weight:650}
.fcard .answer{font-size:15.2px}
.fcard .answer p{font-size:15.2px;line-height:2}
.fbar{display:flex;gap:8px;margin-top:17px;flex-wrap:wrap;align-items:center}
.kbd{font-size:10px;color:#a9b6b3;border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:#fff;margin-left:4px}
.btn.primary .kbd,.btn.good .kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.9)}

.sheet{position:fixed;right:18px;top:82px;width:206px;max-height:calc(100vh - 106px);display:none;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh2);z-index:25;overflow:hidden}
.sheet-head{padding:12px 13px 9px;border-bottom:1px solid var(--line2)}
.sh-row{display:flex;align-items:baseline;justify-content:space-between;position:relative}
.sh-title{font-size:12px;font-weight:650;letter-spacing:.04em}
.sh-row b{font-size:11.5px;color:#84928f;font-weight:650}
.sh-x{display:none;position:absolute;right:-2px;top:-4px;border:0;background:#f1f5f4;color:#7d8b89;width:22px;height:22px;border-radius:50%;font-size:11px;line-height:1;cursor:pointer}
.sh-x:hover{background:#e6eeec;color:var(--ink)}
.sh-bar{height:4px;border-radius:3px;background:#e7f0ee;overflow:hidden;margin:9px 0 8px}
.sh-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2aa199,var(--ac));transition:width .3s}
.sh-legend{display:flex;gap:8px;font-size:9.5px;color:#93a09e}
.sh-legend span{display:flex;align-items:center;gap:4px}
.lg{width:8px;height:8px;border-radius:2px;border:1px solid #dde6e4;background:#fff;display:inline-block}
.lg.done{background:#2aa199;border-color:#2aa199}
.lg.ok{background:#0a4f4a;border-color:#0a4f4a}
.sheet-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 11px 12px;overflow:auto}
.sheet-grid::-webkit-scrollbar{width:6px}
.sheet-grid::-webkit-scrollbar-thumb{background:#d7e2e0;border:0;border-radius:6px}
.b{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10.5px;line-height:1;border-radius:5px;border:1px solid #e2ecea;background:#fff;color:#9aa8a6;cursor:pointer;font-variant-numeric:tabular-nums;transition:.12s;padding:0}
.b:hover{border-color:var(--ac);color:var(--ac);transform:scale(1.1)}
.b.done{background:#2aa199;border-color:#2aa199;color:#fff;font-weight:600}
.b.ok{background:#0a4f4a;border-color:#0a4f4a;color:#fff;font-weight:600}
.sheet-btn{display:none;position:fixed;right:16px;bottom:18px;z-index:26;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:12.5px;color:var(--ink);box-shadow:0 8px 22px rgba(9,26,24,.16);cursor:pointer;font-weight:650}
@media(min-width:1240px){

}
@media(max-width:1239px){

  .sheet.open .sh-x{display:block}
  .sheet.open .sh-row{padding-right:22px}
  .sheet.open .sheet-grid{grid-template-columns:repeat(10,1fr)}
  body.sheet-open .sheet-btn{display:none}
}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,22px);background:#0d2320;color:#fff;padding:10px 18px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.8,.2,1);z-index:80;box-shadow:0 12px 30px rgba(9,26,24,.28)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:#93a09e;padding:50px 12px;font-size:13px;line-height:2}
.empty b{color:var(--ink);font-weight:650}
.empty .ico{width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 13px;color:#c2d0cd;box-shadow:var(--sh)}
.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:13px;color:#6d7b78;line-height:1.7}
.notice b{color:var(--ink);font-weight:650}

@media(max-width:900px){

  .rail{position:sticky;top:0;height:auto;width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;flex-direction:row;align-items:center;gap:8px;overflow:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(10px)}

  .hd{padding:20px 16px;gap:16px;border-radius:15px}
  .hd-t{font-size:22px;margin-top:10px}
  .hd-sub{font-size:11.5px}
  .hd-tags{gap:5px;margin-top:12px}
  .hd-tags span{font-size:10px}
  .hd-cd{flex:1 1 100%;padding:14px 16px}
  .cd-nums b{font-size:26px}
  .kpi-row{gap:0;margin:10px 0 16px}
  .kpi{padding:11px 13px}
  .kpi b{font-size:17px}
  .kpi em{font-size:10px}
  .daybar{padding:12px 14px;gap:12px}
  .db-prog{max-width:none;flex-basis:100%;order:3}
  .db-acts{margin-left:0;width:100%;order:4}
  .db-acts .btn{flex:1;justify-content:center}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .q{font-size:15.6px}
  .actions .dt{display:none}
  .field .hint{margin-left:0}
  .chap-row{grid-template-columns:1fr 78px 42px}
  .fcard{padding:18px 16px}
  .fcard .q{font-size:17px}
}
</style>
