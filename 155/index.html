<script>
const DATA = {"meta":{"title":"机械原理简答题背诵手册","subtitle":"精简版 · 155 题 · 12 章","total":155,"chapters":[{"id":"c1","part":"第 1 章","name":"绪论","count":1},{"id":"c2","part":"第 2 章","name":"机构结构分析","count":16},{"id":"c3","part":"第 3 章","name":"机构运动分析","count":9},{"id":"c4","part":"第 4 章","name":"机构力分析","count":8},{"id":"c5","part":"第 5 章","name":"效率与自锁","count":8},{"id":"c6","part":"第 6 章","name":"机械平衡","count":8},{"id":"c7","part":"第 7 章","name":"运转与速度波动","count":17},{"id":"c8","part":"第 8 章","name":"连杆机构","count":20},{"id":"c9","part":"第 9 章","name":"凸轮机构","count":21},{"id":"c10","part":"第 10 章","name":"齿轮机构","count":28},{"id":"c11","part":"第 11 章","name":"轮系","count":9},{"id":"c12","part":"第 12 章","name":"其他常用机构","count":10}],"source":"抄录自微信小程序「机械刷题」· 整理日期 2026-11-22"},"items":[{"id":"q001","no":1,"order":1,"chap":"c1","sec":"机器、机构与机械的概念","level":"普通","q":"机器具有哪些特征？机器与机构有何区别？举例说明。","a":"机器具有三个共同特征：人为的实物组合；各实物间具有确定的相对运动；能代替或减轻人类劳动，完成有效的机械功或转换机械能。\n机构只具有前两个特征。\n例如，内燃机是一部机器，其中的曲柄滑块机构将活塞的往复移动转变为曲轴的连续转动。","exp":"","fig":null,"page":null,"pts":[["三个共同特征","人为的实物组合；各实物间具有确定的相对运动；能代替或减轻人类劳动，完成有效的机械功或转换机械能。"],["与机构的区别","机构只具有前两个特征。"],["举例","例如，内燃机是一部机器，其中的曲柄滑块机构将活塞的往复移动转变为曲轴的连续转动。"]]},{"id":"q002","no":2,"order":2,"chap":"c2","sec":"构件与运动副概念","level":"普通","q":"运动副的定义和分类各是什么？","a":"这种由两个构件直接接触且组成的可动的连接称为运动副。\n两构件构成运动副后所受的约束度最少为1，最多为5。运动副常根据其约束度进行分类：把约束度为1的运动副称为I级副，约束度为2的运动副称为Ⅱ级副，以此类推。\n凡两构件通过单一点或线接触而构成的运动副统称为高副。通过面接触而构成的运动副统称为低副。\n凡借助于构件的结构形状所产生的几何约束来封闭的运动副称为几何封闭或形封闭运动副；借助于推力、重力、弹簧力、气液压力等来封闭的运动副称为力封闭运动副。\n把两构件之间的相对运动为转动的运动副称为转动副或回转副，也称铰链；相对运动为移动的运动副称为移动副；相对运动为螺旋运动的运动副称为螺旋副；相对运动为球面运动的运动副称为球面副。\n根据构成运动副的两构件之间的相对运动是平面运动还是空间运动，还可以把运动副分为平面运动副和空间运动副两大类。","exp":"","fig":null,"page":null,"pts":[["运动副的定义","这种由两个构件直接接触且组成的可动的连接称为运动副。"],["分类","",[["约束度","两构件构成运动副后所受的约束度最少为1，最多为5。"],["按约束度分级","把约束度为1的运动副称为I级副，约束度为2的运动副称为Ⅱ级副，以此类推。"],["高副","凡两构件通过单一点或线接触而构成的运动副统称为高副。"],["低副","通过面接触而构成的运动副统称为低副。"],["几何封闭（形封闭）","凡借助于构件的结构形状所产生的几何约束来封闭的运动副称为几何封闭或形封闭运动副。"],["力封闭","借助于推力、重力、弹簧力、气液压力等来封闭的运动副称为力封闭运动副。"],["按相对运动形式分","把两构件之间的相对运动为转动的运动副称为转动副或回转副，也称铰链；相对运动为移动的运动副称为移动副；相对运动为螺旋运动的运动副称为螺旋副；相对运动为球面运动的运动副称为球面副。"],["按平面与空间分","根据构成运动副的两构件之间的相对运动是平面运动还是空间运动，还可以把运动副分为平面运动副和空间运动副两大类。"]]]]},{"id":"q003","no":3,"order":3,"chap":"c2","sec":"构件与运动副概念","level":"普通","q":"分析构件与零件的联系与区别。","a":"在零件中，有的是作为一个独立的运动单元体而运动的，有的则常常由于结构和工艺上的需要而与其他零件刚性地连接在一起作为一个整体而运动，例如连杆就是由连杆体、连杆头、螺栓、螺母等零件刚性地连接在一起作为一个整体而运动的。\n这些刚性地连接在一起的零件共同组成一个独立的运动单元体。\n机器中每一个独立的运动单元体称为一个构件。","exp":"核心机理：划分零件看制造过程，划分构件看运动关系。多个零件若刚性连接、彼此无相对运动，可合并为一个构件；同一个整体零件也可直接构成一个构件。","fig":null,"page":null,"pts":[["零件","在零件中，有的是作为一个独立的运动单元体而运动的，有的则常常由于结构和工艺上的需要而与其他零件刚性地连接在一起作为一个整体而运动，例如连杆就是由连杆体、连杆头、螺栓、螺母等零件刚性地连接在一起作为一个整体而运动的。"],["构件","这些刚性地连接在一起的零件共同组成一个独立的运动单元体。机器中每一个独立的运动单元体称为一个构件。"]]},{"id":"q004","no":4,"order":4,"chap":"c2","sec":"构件与运动副概念","level":"普通","q":"试比较高副与低副的优缺点。","a":"低副承载高，而高副承载低，在低速轻载场合，选用高副有利于减少机构的构件数，可提高机械的效率。","exp":"","fig":null,"page":null,"pts":[["承载与适用场合","低副承载高，而高副承载低，在低速轻载场合，选用高副有利于减少机构的构件数，可提高机械的效率。"]]},{"id":"q005","no":5,"order":5,"chap":"c2","sec":"运动链与机构概念","level":"普通","q":"运动链和机构有何关系？","a":"构件通过运动副的连接而构成的可相对运动的系统称为运动链。\n在运动链中，如果将其中某一构件加以固定而使其成为机架，则该运动链便成为机构，亦即具有机架的运动链便称为机构。","exp":"解题思路：本题考查运动链与机构的核心定义及二者的转化关系，核心判定依据为运动链是否具有确定的相对运动。\n知识体系：二者属于机械原理中运动系统的递进概念：1.构件是运动的基本单元，若干构件通过运动副连接形成的可动系统即为运动链；2.当运动链的自由度大于0，且原动件数量等于自由度数时，运动链具有确定的相对运动，此时该运动链即为机构。概念层级为：构件→（运动副连接）→运动链→（满足确定运动条件）→机构。\n易错分析：常见误区为忽略“确定运动”这一核心判定条件，误将自由度不匹配、无确定运动的运动链也归类为机构。","fig":null,"page":null,"pts":[["运动链","构件通过运动副的连接而构成的可相对运动的系统称为运动链。"],["机构","在运动链中，如果将其中某一构件加以固定而使其成为机架，则该运动链便成为机构，亦即具有机架的运动链便称为机构。"]]},{"id":"q006","no":6,"order":6,"chap":"c2","sec":"机构运动简图绘制","level":"普通","q":"机构运动简图有什么作用？如何绘制机构运动简图？","a":"机构运动简图将使了解机械的组成及对机械进行运动和动力分析变得十分简便。\n(1）认清机械机构组成的构件数目和各运动副的类型及其位置。\n(2）选择适当的机构运动简图表示的视图平面。\n(3）选择适当的比例尺，按机械的运动尺寸画出机构运动简图。最后，用数字示出各构件和用字母示出各运动副。若已给定主动件，应用箭头示出主动件。","exp":"解题思路：本题属于机械原理基础概念题，需围绕机构运动简图「简化非运动因素、保留运动特征」的核心属性，分别从功能价值、操作流程两个维度作答，要点要覆盖核心定义、应用场景、操作规范三个层面。\n知识体系：机构运动简图是机械原理课程的入门核心工具，上游关联机构的组成、运动副分类知识点，下游是机构自由度计算、运动分析、动力学分析、机构创新设计的必备基础，绘制的准确性直接决定后续所有分析结果的有效性。\n易错分析：常见错误包括：1.忽略长度比例尺，随意绘制运动副位置，导致后续运动分析结果失真；2.转动副偏离实际回转中心、移动副导路方向与实际方向不符；3.漏标机架标识、原动件的运动方向，无法明确机构的运动传递逻辑。","fig":null,"page":null,"pts":[["作用","机构运动简图将使了解机械的组成及对机械进行运动和动力分析变得十分简便。"],["如何绘制机构运动简图","",[["认清组成","认清机械机构组成的构件数目和各运动副的类型及其位置。"],["选择视图平面","选择适当的机构运动简图表示的视图平面。"],["选比例尺作图","选择适当的比例尺，按机械的运动尺寸画出机构运动简图。最后，用数字示出各构件和用字母示出各运动副。若已给定主动件，应用箭头示出主动件。"]]]]},{"id":"q007","no":7,"order":7,"chap":"c2","sec":"","level":"普通","q":"机构中的虚约束一般出现在哪些场合？既然虚约束对于机构的运动实际上不起约束作用，那么在实际机械中为什么又常常存在虚约束？","a":"虚约束常出现在：用转动副连接两构件上运动轨迹相重合的点；用双转动副杆连接两运动构件上距离始终不变的两点；不影响运动传递的重复部分。\n此外，两构件在多处构成轴线重合的转动副、移动方向平行的移动副，或接触点公法线重合的平面高副时，均只能算一个运动副。\n实际机构设置虚约束可保证运动的连续性、改善受力情况。\n例如平行四边形机构增设与连架杆平行且等长的杆以保证连杆运动连续性。\n轮系中设置多个相同齿轮以改善受力情况。","exp":"解题思路：本题应区分虚约束的运动学作用和工程作用。判断某个约束是否为虚约束，关键不在于是否存在多处连接或对称结构，而在于该约束是否在特定几何条件下重复了已有的独立约束。","fig":null,"page":null,"pts":[["常出现的场合","用转动副连接两构件上运动轨迹相重合的点；用双转动副杆连接两运动构件上距离始终不变的两点；不影响运动传递的重复部分。",[["重复运动副只算一个","此外，两构件在多处构成轴线重合的转动副、移动方向平行的移动副，或接触点公法线重合的平面高副时，均只能算一个运动副。"]]],["存在的原因","实际机构设置虚约束可保证运动的连续性、改善受力情况。例如平行四边形机构增设与连架杆平行且等长的杆以保证连杆运动连续性。轮系中设置多个相同齿轮以改善受力情况。"]]},{"id":"q008","no":8,"order":8,"chap":"c2","sec":"含复合铰链的自由度计算/含局部自由度的自由度计算","level":"普通","q":"什么是复合铰链、局部自由度和虚约束？","a":"两个以上的构件在同一处连接构成了复合铰链。\n在有些机构中，某些构件所产生的局部运动并不影响其他构件的运动，则称这种局部运动的自由度为局部自由度。\n在机构中，有些运动副带入的约束对机构的运动只起重复约束作用，故把这类约束称为虚约束。","exp":"","fig":null,"page":null,"pts":[["复合铰链","两个以上的构件在同一处连接构成了复合铰链。"],["局部自由度","在有些机构中，某些构件所产生的局部运动并不影响其他构件的运动，则称这种局部运动的自由度为局部自由度。"],["虚约束","在机构中，有些运动副带入的约束对机构的运动只起重复约束作用，故把这类约束称为虚约束。"]]},{"id":"q009","no":9,"order":9,"chap":"c2","sec":"基本自由度计算","level":"普通","q":"机构自由度的定义是什么？一个平面自由构件的自由度为多少？","a":"机构具有确定运动时所必须给定的独立运动参数的数目（亦即为了使机构的位置得以确定，必须给定的独立的广义坐标的数目），称为机构的自由度，其数目常以F表示。\n由于在平面机构中，各构件只作平面运动，所以每个自由构件具有三个自由度。","exp":"解题思路：本题为机械原理绪论部分的基础概念题，需分别回应两个核心问题，首先明确机构自由度的定义内涵，再说明单个平面自由构件的自由度构成，可结合平面机构自由度计算公式理解二者的逻辑关联。\n知识体系：本题涉及的知识点层级关系如下：1.单个平面自由构件的自由度为3，是平面机构自由度计算的基础；2.运动副会对构件产生约束，低副引入2个约束、高副引入1个约束；3.机构自由度的本质是独立运动参数的数目，数值上等于活动构件总自由度减去总约束数，当自由度等于原动件数时机构具有确定运动。\n易错分析：常见错误点包括：1.混淆机构自由度的定义与计算逻辑，误将“总自由度减总约束”的计算方法当作定义；2.混淆平面与空间自由构件的自由度，空间自由构件的自由度为6个；3.计算机构自由度时误将机架计入活动构件数n的统计范围。","fig":null,"page":null,"pts":[["机构的自由度","机构具有确定运动时所必须给定的独立运动参数的数目（亦即为了使机构的位置得以确定，必须给定的独立的广义坐标的数目），称为机构的自由度，其数目常以F表示。"],["平面自由构件","由于在平面机构中，各构件只作平面运动，所以每个自由构件具有三个自由度。"]]},{"id":"q010","no":10,"order":10,"chap":"c2","sec":"运动链与机构概念","level":"普通","q":"机构具有确定运动的条件是什么？当机构的主动件数少于或多于机构的自由度时，机构的运动将发生什么情况？什么是欠驱机构和冗驱机构，它们在机械工程中有何重要意义？","a":"机构的主动件数目应等于机构的自由度的数目。\n主动件数目小于机构的自由度，机构的运动将不完全确定；主动件数多于机构自由度，假如各主动件的运动互不协调，将有可能导致机构在最薄弱的环节损坏。\n主动件数少于机构自由度的机构或机械系统称为欠驱动机构或欠驱动机械系统。\n其运动将遵循最小阻力定律，利用这一特性可简化机构，并增加机构的灵巧性和自适应性等。\n主动件数多于机构自由度的机构或机械系统称为冗余驱动机构或冗余驱动机械系统。\n若各主动件的运动彼此协调，则各主动件共同驱动从动件运动，增大传动的可靠性，减小传动的尺寸和重量，并有利于克服机构处于某些奇异位形时其运动所受到的障碍。","exp":"","fig":null,"page":null,"pts":[["确定运动的条件","机构的主动件数目应等于机构的自由度的数目。"],["主动件数不符时","主动件数目小于机构的自由度，机构的运动将不完全确定；主动件数多于机构自由度，假如各主动件的运动互不协调，将有可能导致机构在最薄弱的环节损坏。"],["欠驱动机构","",[["定义","主动件数少于机构自由度的机构或机械系统称为欠驱动机构或欠驱动机械系统。"],["意义","其运动将遵循最小阻力定律，利用这一特性可简化机构，并增加机构的灵巧性和自适应性等。"]]],["冗余驱动机构","",[["定义","主动件数多于机构自由度的机构或机械系统称为冗余驱动机构或冗余驱动机械系统。"],["意义","若各主动件的运动彼此协调，则各主动件共同驱动从动件运动，增大传动的可靠性，减小传动的尺寸和重量，并有利于克服机构处于某些奇异位形时其运动所受到的障碍。"]]]]},{"id":"q011","no":11,"order":11,"chap":"c2","sec":"基本自由度计算","level":"普通","q":"在计算机构的自由度时，要注意哪些事项？","a":"由m个构件组成的复合铰链，共有（m−1）个转动副。\n在计算机构的自由度时，应注意机构中是否存在复合铰链。\n如果两构件在多处接触而构成转动副，且转动轴线重合；或者在多处接触而构成移动副，且移动方向彼此平行；或者两构件构成为平面高副，且各接触点处的公法线彼此重合，则均只能算作一个运动副（即分别算一个转动副、一个移动副与一个平面高副）。\n在计算机构的自由度时，应从机构自由度的计算公式中将局部自由度减去。\n在计算机构的自由度时，应从机构的约束数中减去虚约束数。","exp":"解题思路：本题考查平面机构自由度计算的核心注意事项，核心是准确识别三类特殊结构，掌握对应的处理规则，保障自由度计算公式F=3n−2P_L−P_H中活动构件数n、低副数P_L、高副数P_H三个参数的统计准确性。\n知识体系：本知识点出自西北工业大学《机械原理》（第八版）第二章第三节，三类特殊情况的核心对比如下：特殊类型影响参数处理规则局部自由活动构件数n计算前合并局部运动构件与相邻构件，移除局部自度由度复合铰链低副数P_Lm个构件铰接对应m一1个转动副，按实际数量统计。","fig":null,"page":null,"pts":[["复合铰链的转动副数","由m个构件组成的复合铰链，共有（m−1）个转动副。"],["先查复合铰链","在计算机构的自由度时，应注意机构中是否存在复合铰链。"],["重复运动副只算一个","如果两构件在多处接触而构成转动副，且转动轴线重合；或者在多处接触而构成移动副，且移动方向彼此平行；或者两构件构成为平面高副，且各接触点处的公法线彼此重合，则均只能算作一个运动副（即分别算一个转动副、一个移动副与一个平面高副）。"],["减去局部自由度","在计算机构的自由度时，应从机构自由度的计算公式中将局部自由度减去。"],["减去虚约束","在计算机构的自由度时，应从机构的约束数中减去虚约束数。"]]},{"id":"q012","no":12,"order":12,"chap":"c2","sec":"高副低代","level":"普通","q":"什么是平面机构的\"高副低代\"？其目的和意义是什么？","a":"对于含高副的平面机构，如果将其中的高副根据一定的条件虚拟地以低副加以代替，就能变换成全低副平面机构。\n目的：可以把平面低副机构的结构分析、运动分析方法，应用到含有高副的平面机构上。\n意义：揭示平面高副、低副之间内在联系，方便开展杆组分析以及运动分析。\n这种高副以低副代替的方法称为高副低代。","exp":"","fig":null,"page":null,"pts":[["什么是高副低代","对于含高副的平面机构，如果将其中的高副根据一定的条件虚拟地以低副加以代替，就能变换成全低副平面机构。这种高副以低副代替的方法称为高副低代。"],["目的和意义","",[["目的","可以把平面低副机构的结构分析、运动分析方法，应用到含有高副的平面机构上。"],["意义","揭示平面高副、低副之间内在联系，方便开展杆组分析以及运动分析。"]]]]},{"id":"q013","no":13,"order":13,"chap":"c2","sec":"高副低代","level":"普通","q":"平面机构进行高副低代时，应满足哪些条件？","a":"为了保持高副低代前后机构的运动完全等效，进行高副低代必须满足的两个条件：\n(1）代替前后机构的自由度相同。\n(2）代替前后机构的瞬时速度和瞬时加速度完全相同。","exp":"","fig":null,"page":null,"pts":[["前提","为了保持高副低代前后机构的运动完全等效，进行高副低代必须满足的两个条件。"],["两个条件","",[["自由度相同","代替前后机构的自由度相同。"],["瞬时速度与加速度相同","代替前后机构的瞬时速度和瞬时加速度完全相同。"]]]]},{"id":"q014","no":14,"order":14,"chap":"c2","sec":"杆组拆分与机构级别判定","level":"普通","q":"什么是基本杆组？机构的组成原理是什么？","a":"把最后不能再拆的最简单的自由度为零的构件组称为基本杆组或阿苏尔杆组，简称杆组。\n任何机构都可以看作是由若干个基本杆组依次连接于主动件和机架上而构成的。\n这就是机构的组成原理。","exp":"","fig":null,"page":null,"pts":[["基本杆组","把最后不能再拆的最简单的自由度为零的构件组称为基本杆组或阿苏尔杆组，简称杆组。"],["组成原理","任何机构都可以看作是由若干个基本杆组依次连接于主动件和机架上而构成的。这就是机构的组成原理。"]]},{"id":"q015","no":15,"order":15,"chap":"c2","sec":"杆组拆分与机构级别判定","level":"普通","q":"平面机构结构分析的步骤是什么？","a":"在对机构进行结构分析时，首先应正确计算机构的自由度（注意除去机构中的虚约束和局部自由度），并确定主动件。\n然后，从远离主动件的构件开始拆杆组。\n先试拆Ⅱ级组，若不成，再拆Ⅲ级组。\n每拆出一个杆组后，留下的部分仍应是一个与原机构有相同自由度的机构，直至全部杆组拆出只剩下主动件和机架为止。\n最后，确定机构的级别。\n上面所介绍的是设机构中的运动副全部为低副的情况。\n如果机构中尚含有高副，则为了分析研究方便，可用高副低代的方法先将机构中的高副变为低副，然后再按上述方法进行结构分析和分类。","exp":"","fig":null,"page":null,"pts":[["计算自由度并确定主动件","在对机构进行结构分析时，首先应正确计算机构的自由度（注意除去机构中的虚约束和局部自由度），并确定主动件。"],["从远离主动件处拆杆组","然后，从远离主动件的构件开始拆杆组。"],["先试Ⅱ级组","先试拆Ⅱ级组，若不成，再拆Ⅲ级组。"],["逐组拆至只剩机架","每拆出一个杆组后，留下的部分仍应是一个与原机构有相同自由度的机构，直至全部杆组拆出只剩下主动件和机架为止。"],["确定机构级别","最后，确定机构的级别。"],["含高副的机构","上面所介绍的是设机构中的运动副全部为低副的情况。如果机构中尚含有高副，则为了分析研究方便，可用高副低代的方法先将机构中的高副变为低副，然后再按上述方法进行结构分析和分类。"]]},{"id":"q016","no":16,"order":16,"chap":"c2","sec":"四杆机构演化形式/杆组拆分与机构级别判定","level":"普通","q":"机架变换和主动件选择的不同会影响机构的运动吗？","a":"一个运动链当取不同的构件为机架或者为主动件时，都将可能改变机构的结构形式或两连架杆的运动形式，从而可形成不同的机构类型。\n根据相对运动原理，在对机构实施构件变换原理的演化时，并不会改变演化机构与原机构的各构件之间的相对运动和尺寸关系。","exp":"","fig":null,"page":null,"pts":[["改变机构类型","一个运动链当取不同的构件为机架或者为主动件时，都将可能改变机构的结构形式或两连架杆的运动形式，从而可形成不同的机构类型。"],["相对运动不变","根据相对运动原理，在对机构实施构件变换原理的演化时，并不会改变演化机构与原机构的各构件之间的相对运动和尺寸关系。"]]},{"id":"q017","no":17,"order":17,"chap":"c2","sec":"杆组拆分与机构级别判定","level":"普通","q":"什么是基本杆组？它有何特点？请以一个Ⅲ级杆组为例说明，并说明如何确定杆组和机构的级别。","a":"基本杆组是最后不能再拆的、最简单的自由度为零的构件组，又称阿苏尔杆组。\n任何机构都可看作若干基本杆组依次连接于主动件和机架而成。\n低副杆组满足 3n−2p_l=0，并不能再拆成更简单的零自由度杆组。\n例如教材图2-31第一种Ⅲ级杆组，由三副构件BCE及杆AB、CD、EF组成，外接副为A、D、F；有4个构件、6个转动副，F=3×4−2×6=0，是不可再分的基本杆组。\n杆组按组成形态分级：2个构件、3个低副的基本杆组为Ⅱ级组；教材所列4个构件、6个低副且含一个三副构件的基本杆组为Ⅲ级组。\n机构的级别按所含最高级别杆组确定；只有机架和主动件的为I级机构。","exp":"","fig":null,"page":null,"pts":[["基本杆组","最后不能再拆的、最简单的自由度为零的构件组，又称阿苏尔杆组。"],["组成","任何机构都可看作若干基本杆组依次连接于主动件和机架而成。"],["特点","低副杆组满足 3n−2p_l=0，并不能再拆成更简单的零自由度杆组。"],["Ⅲ级杆组示例","例如教材图2-31第一种Ⅲ级杆组，由三副构件BCE及杆AB、CD、EF组成，外接副为A、D、F；有4个构件、6个转动副，F=3×4−2×6=0，是不可再分的基本杆组。"],["如何确定杆组和机构的级别","",[["杆组分级","2个构件、3个低副的基本杆组为Ⅱ级组；教材所列4个构件、6个低副且含一个三副构件的基本杆组为Ⅲ级组。"],["机构级别","机构的级别按所含最高级别杆组确定；只有机架和主动件的为I级机构。"]]]]},{"id":"q018","no":18,"order":18,"chap":"c3","sec":"速度瞬心概念与数目公式","level":"普通","q":"什么是瞬心？相对瞬心与绝对瞬心的相同点是什么？不同点是什么？","a":"互作平面相对运动的两构件上瞬时速度相等的重合点，即为此两构件的速度瞬心，简称瞬心。\n若瞬心处的绝对速度为零，则为绝对瞬心；否则，则为相对瞬心。","exp":"","fig":null,"page":null,"pts":[["瞬心","互作平面相对运动的两构件上瞬时速度相等的重合点，即为此两构件的速度瞬心，简称瞬心。"],["绝对瞬心与相对瞬心","若瞬心处的绝对速度为零，则为绝对瞬心；否则，则为相对瞬心。"]]},{"id":"q019","no":19,"order":19,"chap":"c3","sec":"瞬心位置确定与三心定理","level":"普通","q":"什么是三心定理？","a":"三个彼此作平面平行运动的构件的三个瞬心必位于同一直线上。","exp":"对三个彼此作平面相对运动的构件1、2、3，两两之间分别有瞬心P_12、P_13、P_23，三心定理说明这三个瞬心共线。\n瞬心是两构件速度相等的重合点，指的是绝对速度矢量相等，或等价地说相对速度为零，不能误解为三个瞬心的绝对速度全为零。\n求未知瞬心时，可将它分别放进两个三构件组合，由已知瞬心确定两条直线，其交点就是待求瞬心。","fig":null,"page":null,"pts":[["三心定理","三个彼此作平面平行运动的构件的三个瞬心必位于同一直线上。"]]},{"id":"q020","no":20,"order":20,"chap":"c3","sec":"瞬心位置确定与三心定理","level":"普通","q":"什么是瞬心？如何确定一个机构的全部瞬心位置？","a":"互作平面相对运动的两构件上瞬时速度相等的重合点，即为此两构件的速度瞬心，简称瞬心。\n对于通过运动副直接相连的两构件间的瞬心，可由瞬心定义来确定其位置。\n以转动副相连接的两构件的瞬心就在转动副的中心处；以移动副相连接的两构件间的瞬心位于垂直于导路方向的无穷远处；以平面高副相连接的两构件间的瞬心，当高副两元素作纯滚动时就在接触点处，当高副两元素间有相对滑动时，则在过接触点高副元素的公法线上。\n对于不通过运动副直接相连的两构件间的瞬心，可借助于“三心定理”来确定其位置。\n三个彼此作平面平行运动的构件的三个瞬心必位于同一直线上。","exp":"","fig":null,"page":null,"pts":[["瞬心","互作平面相对运动的两构件上瞬时速度相等的重合点，即为此两构件的速度瞬心，简称瞬心。"],["如何确定全部瞬心位置","",[["直接相连的两构件","对于通过运动副直接相连的两构件间的瞬心，可由瞬心定义来确定其位置。以转动副相连接的两构件的瞬心就在转动副的中心处；以移动副相连接的两构件间的瞬心位于垂直于导路方向的无穷远处；以平面高副相连接的两构件间的瞬心，当高副两元素作纯滚动时就在接触点处，当高副两元素间有相对滑动时，则在过接触点高副元素的公法线上。"],["不直接相连的两构件","对于不通过运动副直接相连的两构件间的瞬心，可借助于“三心定理”来确定其位置。三个彼此作平面平行运动的构件的三个瞬心必位于同一直线上。"]]]]},{"id":"q021","no":21,"order":21,"chap":"c3","sec":"瞬心法的应用","level":"普通","q":"瞬心法和相对运动图解法各有什么优、缺点？它们各适用何种场合？","a":"瞬心法：对于某些结构简单的机构，采用速度瞬心图解法对其进行速度分析往往显得十分简便和直观。但当某些瞬心位于图纸之外时，将给求解带来困难。同时，速度瞬心法不能用于机构的加速度分析。相对运动图解法：机构的速度及加速度分析的一般图解方法为矢量方程图解法，又称相对运动图解法。当需要简捷直观地了解机构的某个或某几个位置的运动特性时，采用图解法比较方便，而且精度也能满足实际问题的要求。对于某些结构比较复杂的机构，如果单纯运用矢量方程图解法对其进行速度分析，有时会遇到困难；如果综合地运用这两种方法进行求解，则往往显得比较简便。","exp":"","fig":null,"page":null,"pts":[["瞬心法","",[["优点","对于某些结构简单的机构，采用速度瞬心图解法对其进行速度分析往往显得十分简便和直观。"],["缺点","但当某些瞬心位于图纸之外时，将给求解带来困难。同时，速度瞬心法不能用于机构的加速度分析。"]]],["相对运动图解法","",[["定义","机构的速度及加速度分析的一般图解方法为矢量方程图解法，又称相对运动图解法。"],["适用场合","当需要简捷直观地了解机构的某个或某几个位置的运动特性时，采用图解法比较方便，而且精度也能满足实际问题的要求。"],["两种方法综合运用","对于某些结构比较复杂的机构，如果单纯运用矢量方程图解法对其进行速度分析，有时会遇到困难；如果综合地运用这两种方法进行求解，则往往显得比较简便。"]]]]},{"id":"q022","no":22,"order":22,"chap":"c3","sec":"图解法一重合点法加速度分析（含科氏加速度）","level":"普通","q":"试叙述在机构的加速度分析中，存在哥氏加速度的条件。","a":"平面机构中，科氏加速度的大小为a_k=2ωv_r，所以牵连构件有非零角速度，同时重合点之间有非零相对移动速度时，存在科氏加速度。\n其方向为将相对速度沿牵连构件角速度的方向转过90°之后的方向。","exp":"","fig":null,"page":null,"pts":[["存在条件","平面机构中，科氏加速度的大小为a_k=2ωv_r，所以牵连构件有非零角速度，同时重合点之间有非零相对移动速度时，存在科氏加速度。"],["方向","其方向为将相对速度沿牵连构件角速度的方向转过90°之后的方向。"]]},{"id":"q023","no":23,"order":23,"chap":"c3","sec":"图解法一重合点法加速度分析(含科氏加速度)","level":"普通","q":"哥氏加速度的大小如何计算？方向如何确定？","a":"B3点相对于B_2点的科氏加速度，其大小为 a_{B_3B_2}^{(k)}=2ω_2v_{B_3B_2}。其方向为将相对速度 v_{B_3B_2} 沿牵连构件2的角速度 ω_2 的方向转过90°之后的方向。","exp":"","fig":null,"page":null,"pts":[["大小","B3点相对于B_2点的科氏加速度，其大小为 a_{B_3B_2}^{(k)}=2ω_2v_{B_3B_2}。"],["方向","其方向为将相对速度 v_{B_3B_2} 沿牵连构件2的角速度 ω_2 的方向转过90°之后的方向。"]]},{"id":"q024","no":24,"order":24,"chap":"c3","sec":"速度多边形性质与速度影像原理","level":"普通","q":"何谓速度影像原理？是否可以应用影像原理求解机构中不同构件的速度？","a":"将同一构件上各点间的相对速度矢量构成的图形称为该构件图形的速度影像。\n当已知一构件上两点的速度时，则该构件上其他任一点的速度便可利用速度影像原理求出。\n速度影像和加速度影像原理只适用于构件（即构件的速度图及加速度图与其几何形状是相似的），而不适用于整个机构。","exp":"","fig":null,"page":null,"pts":[["速度影像","将同一构件上各点间的相对速度矢量构成的图形称为该构件图形的速度影像。"],["能否用于不同构件","",[["作用","当已知一构件上两点的速度时，则该构件上其他任一点的速度便可利用速度影像原理求出。"],["适用范围","速度影像和加速度影像原理只适用于构件（即构件的速度图及加速度图与其几何形状是相似的），而不适用于整个机构。"]]]]},{"id":"q025","no":25,"order":25,"chap":"c3","sec":"速度多边形性质与速度影像原理/加速度多边形性质与加速度影像原理","level":"普通","q":"何谓速度多边形和加速度多边形？它们有哪些特性？","a":"由速度矢量所组成的多边形称为速度多边形，p点称为速度极点。\n(1）极点p代表该机构上所有速度为零的影像点，各点的绝对速度矢量均由极点p引出。\n(2）绝对速度矢端的连线代表构件上对应点间的相对速度，其指向刚好与速度的下标相反。\n(3）同一构件上绝对速度矢端连线而形成的图形称为该构件的速度影像，其特点为速度影像与原构件相似，字母排列顺序相同。\n各加速度矢量组成的多边形称为加速度多边形，p′点称为加速度极点，即所有加速度为零的影像点。\n(1）各点的绝对加速度均由极点p′引出。\n(2）绝对加速度矢端连线代表机构中对应点的相对加速度，其指向刚好与加速度矢量方程中的对应下标相反。\n(3）同一构件上诸点的绝对加速度矢端的连线而形成的图形称为该构件的加速度影像，其特点为加速度影像与原构件相似，字母排列顺序相同。\n(4）加速度的两个分量应衔接作图而不能分开，否则加速度影像的相似性质被破坏。","exp":"","fig":null,"page":null,"pts":[["速度多边形","由速度矢量所组成的多边形称为速度多边形，p点称为速度极点。",[["极点p","该机构上所有速度为零的影像点，各点的绝对速度矢量均由极点p引出。"],["相对速度","绝对速度矢端的连线代表构件上对应点间的相对速度，其指向刚好与速度的下标相反。"],["速度影像","同一构件上绝对速度矢端连线而形成的图形称为该构件的速度影像，其特点为速度影像与原构件相似，字母排列顺序相同。"]]],["加速度多边形","各加速度矢量组成的多边形称为加速度多边形，p′点称为加速度极点，即所有加速度为零的影像点。",[["绝对加速度","各点的绝对加速度均由极点p′引出。"],["相对加速度","绝对加速度矢端连线代表机构中对应点的相对加速度，其指向刚好与加速度矢量方程中的对应下标相反。"],["加速度影像","同一构件上诸点的绝对加速度矢端的连线而形成的图形称为该构件的加速度影像，其特点为加速度影像与原构件相似，字母排列顺序相同。"],["两个分量衔接","加速度的两个分量应衔接作图而不能分开，否则加速度影像的相似性质被破坏。"]]]]},{"id":"q026","no":26,"order":26,"chap":"c3","sec":"综合运动分析（多构件串联）","level":"普通","q":"解析法平面机构的具体步骤是什么？","a":"在用矢量法建立机构的位置方程时，需将构件用矢量来表示，并作出机构的封闭矢量多边形。用解析法作机构的运动分析，应首先建立机构的位置方程，然后将位置方程对时间求导数，即可求得机构的速度和加速度方程，进而完成机构的运动分析。","exp":"解题思路：本题考查平面机构运动分析解析法的核心流程，需按照「建模-位置分析-速度分析-加速度分析-结果应用」的逻辑梳理步骤，体现解析法从几何关系推导运动参数的核心逻辑。\n知识体系：解析法与图解法是机构运动分析的两类核心方法，二者对比如下：方法核心原理适用场景计算精度图解按比例绘制机构运动简图，只需了解某几个特定位置运满足工程常规需求法量取运动参数动特性的场景解析建立运动方程，通过求导推需要全运动周期精确分析、精度高，可结合计法导速度、加速度参数机构优化设计的场景算机批量计算。\n易错分析：易遗漏建立坐标系、列封闭矢量方程的前置步骤，或混淆解析法与图解法的适用场景；需注意无论采用复数矢量法还是矩阵法，封闭矢量方程都是解析法建模的核心基础。","fig":null,"page":null,"pts":[["具体步骤","在用矢量法建立机构的位置方程时，需将构件用矢量来表示，并作出机构的封闭矢量多边形。用解析法作机构的运动分析，应首先建立机构的位置方程，然后将位置方程对时间求导数，即可求得机构的速度和加速度方程，进而完成机构的运动分析。"]]},{"id":"q027","no":27,"order":27,"chap":"c4","sec":"摩擦角与摩擦圆概念","level":"普通","q":"摩擦角φ及摩擦圆大小各与哪些因素有关？","a":"摩擦角由摩擦因数决定，φ=arctanf；不同接触面形状的移动副，其当量摩擦角φ_v=arctanf_v。\n摩擦圆半径ρ=f_v r，与当量摩擦因数及轴颈半径有关。\n对于一个具体的轴颈，由于f_v及r均为定值，故ρ为一固定长度。","exp":"","fig":null,"page":null,"pts":[["摩擦角","由摩擦因数决定，φ=arctanf；不同接触面形状的移动副，其当量摩擦角φ_v=arctanf_v。"],["摩擦圆半径","ρ=f_v r，与当量摩擦因数及轴颈半径有关。对于一个具体的轴颈，由于f_v及r均为定值，故ρ为一固定长度。"]]},{"id":"q028","no":28,"order":28,"chap":"c4","sec":"摩擦角与摩擦圆概念","level":"普通","q":"何谓摩擦角？","a":"滑动摩擦时，运动副中的法向反力和摩擦力的合力称为总反力，总反力与法向反力之间的夹角φ称为摩擦角，tanφ=f，其中f为滑动摩擦因数。","exp":"","fig":null,"page":null,"pts":[["摩擦角","滑动摩擦时，运动副中的法向反力和摩擦力的合力称为总反力，总反力与法向反力之间的夹角φ称为摩擦角，tanφ=f，其中f为滑动摩擦因数。"]]},{"id":"q029","no":29,"order":29,"chap":"c4","sec":"不考虑摩擦的力分析","level":"普通","q":"何谓平衡力与平衡力矩？平衡力是否总是驱动力？","a":"平衡力或平衡力偶是指机械在已知外力作用下，为了使该机构能按给定的运动规律运动，必须加于机械上的未知外力或力偶。\n平衡力不一定是驱动力。\n根据机械的工作负荷确定所需原动机的最小功率，或根据原动机的最小功率确定机械所能克服的最大工作阻力，都需要确定机械的平衡力。","exp":"","fig":null,"page":null,"pts":[["平衡力与平衡力偶","平衡力或平衡力偶是指机械在已知外力作用下，为了使该机构能按给定的运动规律运动，必须加于机械上的未知外力或力偶。"],["是否驱动力","平衡力不一定是驱动力。"],["作用","根据机械的工作负荷确定所需原动机的最小功率，或根据原动机的最小功率确定机械所能克服的最大工作阻力，都需要确定机械的平衡力。"]]},{"id":"q030","no":30,"order":30,"chap":"c4","sec":"不考虑摩擦的力分析","level":"普通","q":"何谓机构的动态静力分析？对机构进行动态静力分析的步骤如何？","a":"将惯性力视为一般外加于相应构件上的力，再按静力分析的方法进行分析，称为动态静力分析。\n分析的一般步骤：先确定机构各个构件的惯性力，然后再将各惯性力虚拟加在机构各相应的构件上，按静力平衡的受力分析方法建立平衡方程并求解。\n需先对机构作运动分析以确定在所要求位置时各构件的角加速度和质心加速度。\n分析的顺序一般是由外力全部已知的构件组开始，逐步推算到未知平衡力作用的构件。","exp":"","fig":null,"page":null,"pts":[["动态静力分析","将惯性力视为一般外加于相应构件上的力，再按静力分析的方法进行分析，称为动态静力分析。"],["分析步骤","",[["确定惯性力并求解","先确定机构各个构件的惯性力，然后再将各惯性力虚拟加在机构各相应的构件上，按静力平衡的受力分析方法建立平衡方程并求解。"],["前提","需先对机构作运动分析以确定在所要求位置时各构件的角加速度和质心加速度。"],["求解顺序","分析的顺序一般是由外力全部已知的构件组开始，逐步推算到未知平衡力作用的构件。"]]]]},{"id":"q031","no":31,"order":31,"chap":"c4","sec":"","level":"普通","q":"何谓质量代换法？进行质量代换的目的何在？动代换和静代换各应满足什么条件？各有何优缺点？静代换两代换点与构件质心不在一直线上可以吗？","a":"把构件的质量按一定条件用集中于构件上某几个选定点的假想集中质量来代替，称为质量代换法。\n这样只需求各集中质量的惯性力，而无需求惯性力偶矩，从而简化构件惯性力的确定。\n动代换满足：质量不变、质心位置不变、对质心轴的转动惯量不变。\n优点是惯性力和惯性力偶都不改变；但两点代换中选定一个代换点后，另一点不能随意选择，计算不便。\n静代换只满足前两个条件，代换点选择较方便；但构件的惯性力偶会产生误差，一般工程设计可以接受。\n两个代换点与质心不能不在同一直线上：两个正质量的合质心必在两点的连线上，否则不满足质心位置不变的条件。","exp":"","fig":null,"page":null,"pts":[["质量代换法","把构件的质量按一定条件用集中于构件上某几个选定点的假想集中质量来代替，称为质量代换法。"],["目的","这样只需求各集中质量的惯性力，而无需求惯性力偶矩，从而简化构件惯性力的确定。"],["动代换","",[["条件","质量不变、质心位置不变、对质心轴的转动惯量不变。"],["优缺点","优点是惯性力和惯性力偶都不改变；但两点代换中选定一个代换点后，另一点不能随意选择，计算不便。"]]],["静代换","只满足前两个条件，代换点选择较方便；但构件的惯性力偶会产生误差，一般工程设计可以接受。"],["代换点的限制","两个正质量的合质心必在两点的连线上，否则不满足质心位置不变的条件。"]]},{"id":"q032","no":32,"order":32,"chap":"c4","sec":"","level":"普通","q":"何谓驱动力？何谓阻力？阻力又可分为哪几种？","a":"驱动机械运动的力称为驱动力。驱动力与其作用点的速度方向相同或成锐角，其所作的功为正功。\n阻止机械运动的力称为阻抗力。阻抗力与其作用点的速度方向相反或成钝角，其所作的功为负功。阻抗力又可分为如下两种：\n(1）有效阻抗力，即工作阻力。它是机械在工作过程中为了改变工作物的外形、位置或状态等受到的阻力，克服这些阻力就完成了有效的工作。\n(2）有害阻抗力，即机械在运转过程中所受到的非工作阻力。克服这类阻力所作的功是种纯粹的浪费，故称为损失功。","exp":"","fig":null,"page":null,"pts":[["驱动力","驱动机械运动的力称为驱动力。驱动力与其作用点的速度方向相同或成锐角，其所作的功为正功。"],["阻力","",[["阻抗力","阻止机械运动的力称为阻抗力。阻抗力与其作用点的速度方向相反或成钝角，其所作的功为负功。阻抗力又可分为如下两种。"],["有效阻抗力（工作阻力）","有效阻抗力，即工作阻力。它是机械在工作过程中为了改变工作物的外形、位置或状态等受到的阻力，克服这些阻力就完成了有效的工作。"],["有害阻抗力（非工作阻力）","有害阻抗力，即机械在运转过程中所受到的非工作阻力。克服这类阻力所作的功是种纯粹的浪费，故称为损失功。"]]]]},{"id":"q033","no":33,"order":33,"chap":"c4","sec":"移动副摩擦力确定/转动副摩擦力确定","level":"普通","q":"何谓总反力？在移动副和转动副中总反力的方向及作用线的位置是如何确定的？","a":"运动副中的法向反力和摩擦力的合力称为总反力。移动副中，总反力相对法向反力偏斜一个摩擦角，偏斜方向与受力构件的相对速度方向相反，即总反力与相对速度成90°+φ的钝角；作用线具体位置再按构件的力平衡确定。转动副中，先不计摩擦，按力平衡确定总反力方向；计及摩擦时，总反力应与摩擦圆相切，且对轴心的力矩方向必与相对角速度方向相反。摩擦圆以轴心为圆心，半径为ρ=f_v r。","exp":"","fig":null,"page":null,"pts":[["总反力","运动副中的法向反力和摩擦力的合力称为总反力。"],["如何确定","",[["移动副","总反力相对法向反力偏斜一个摩擦角，偏斜方向与受力构件的相对速度方向相反，即总反力与相对速度成90°+φ的钝角；作用线具体位置再按构件的力平衡确定。"],["转动副","先不计摩擦，按力平衡确定总反力方向；计及摩擦时，总反力应与摩擦圆相切，且对轴心的力矩方向必与相对角速度方向相反。摩擦圆以轴心为圆心，半径为ρ=f_v r。"]]]]},{"id":"q034","no":34,"order":34,"chap":"c4","sec":"移动副摩擦力确定","level":"普通","q":"为什么要引入当量摩擦因数？它与什么因素有关？","a":"在计算移动副中的摩擦力时，不管移动副两元素的几何形状如何，只要引入相应的当量摩擦因数即可。当移动副两元素为单一平面接触时，f_v=f；为槽面接触时，f_v=f/sinθ；为半圆柱面接触时，f_v=kf，k=1～π/2。对于配合紧密且未经磨合的转动副，f，取较大值；而对于有较大间隙的转动副，f，取较小值。","exp":"","fig":null,"page":null,"pts":[["当量摩擦因数","在计算移动副中的摩擦力时，不管移动副两元素的几何形状如何，只要引入相应的当量摩擦因数即可。"],["与什么因素有关","",[["各种接触面","当移动副两元素为单一平面接触时，f_v=f；为槽面接触时，f_v=f/sinθ；为半圆柱面接触时，f_v=kf，k=1～π/2。"],["配合紧密与间隙较大","对于配合紧密且未经磨合的转动副，f，取较大值；而对于有较大间隙的转动副，f，取较小值。"]]]]},{"id":"q035","no":35,"order":35,"chap":"c5","sec":"机械效率的概念与计算","level":"普通","q":"什么是机械效率？","a":"机械的输出功与输入功之比称为机械效率，它反映输入功在机械中的有效利用程度，其中W_r为输出功，W_d为输入功，W_f为损失功。","exp":"机械效率用有用输出与总输入的比值衡量能量利用程度：其中W为有效输出功，Wa为输入功，W_f为损失功，后一等式适用于所考察过程净储能变化为零的情形，例如稳定运转的完整周期。也可在相应稳态条件下用功率之比表示。\n效率不是输出力与输入力的简单比值。力经过机构可以放大，但还要同时考虑位移或速度，不能由输出力较大推出效率大于1。","fig":null,"page":null,"pts":[["机械效率","机械的输出功与输入功之比称为机械效率，它反映输入功在机械中的有效利用程度，其中W_r为输出功，W_d为输入功，W_f为损失功。"]]},{"id":"q036","no":36,"order":36,"chap":"c5","sec":"机械效率的概念与计算","level":"普通","q":"从设计的角度来考虑，提高机械效率可采取哪些措施？","a":"(1）尽量简化机械传动系统：在满足传递运动及动力的工作要求前提下，机构的结构越简单越好，减少构件数、运动副数和机械质量。\n(2）选择合适的运动副形式：宜尽可能选择转动副或采用全转动副机构；在低速轻载场合，选用高副有利于减少构件数。\n(3）设计合理的运动副尺寸：轴颈在满足强度和刚度条件下尺寸不宜过大；移动副设计应尽量增大其导轨支承比。\n(4）尽量减小运动副中的摩擦：设计尽量有利于润滑，最好形成流体动压润滑状态；采用滚动摩擦代替滑动摩擦。\n(5）减小介质阻力：注意外形的流线型设计，对高速旋转零件注意结构设计，减小风阻。","exp":"","fig":null,"page":null,"pts":[["简化传动系统","在满足传递运动及动力的工作要求前提下，机构的结构越简单越好，减少构件数、运动副数和机械质量。"],["选择合适的运动副形式","宜尽可能选择转动副或采用全转动副机构；在低速轻载场合，选用高副有利于减少构件数。"],["合理设计运动副尺寸","轴颈在满足强度和刚度条件下尺寸不宜过大；移动副设计应尽量增大其导轨支承比。"],["减小运动副中的摩擦","设计尽量有利于润滑，最好形成流体动压润滑状态；采用滚动摩擦代替滑动摩擦。"],["减小介质阻力","注意外形的流线型设计，对高速旋转零件注意结构设计，减小风阻。"]]},{"id":"q037","no":37,"order":37,"chap":"c5","sec":"斜面机构效率计算","level":"普通","q":"机械正反行程的效率是否相同？请以斜面机构为例分析。","a":"一般不相同。\n斜面机构正行程的机械效率为 η = tan α / tan(α + φ_v)；反行程以重物的重力为驱动力，机械效率为 η′ = tan(α − φ_v) / tan α。\n两式不同，说明正反行程的效率一般不同。","exp":"","fig":null,"page":null,"pts":[["结论","一般不相同。"],["效率计算","斜面机构正行程的机械效率为 η = tan α / tan(α + φ_v)；反行程以重物的重力为驱动力，机械效率为 η′ = tan(α − φ_v) / tan α。两式不同，说明正反行程的效率一般不同。"]]},{"id":"q038","no":38,"order":38,"chap":"c5","sec":"机组效率计算","level":"普通","q":"对于串联机组、并联机组，如何确定机组效率？各有什么特点？","a":"串联机组的总效率等于各机器的效率的连乘积，即 η=η_1η_2…η_k。\n只要串联机组中任一机器的效率很低，就会使整个机组的效率极低。\n串联机组中串联的机器数目越多，其效率就越低。\n并联机组的总效率 η=(η_1P_1+η_2P_2+…+η_kP_k)/(P_1+P_2+…+P_k)，不仅与各个机器的效率有关，而且与机器所传递的功率有关。\n并联机组的效率主要取决于传递功率最大的机器的效率。\n欲提高并联机组的效率，应着重提高传递功率大的传动路线的效率。","exp":"","fig":null,"page":null,"pts":[["串联机组","",[["效率计算","串联机组的总效率等于各机器的效率的连乘积，即 η=η_1η_2…η_k。"],["特点","只要串联机组中任一机器的效率很低，就会使整个机组的效率极低。串联机组中串联的机器数目越多，其效率就越低。"]]],["并联机组","",[["效率计算","并联机组的总效率 η=(η_1P_1+η_2P_2+…+η_kP_k)/(P_1+P_2+…+P_k)，不仅与各个机器的效率有关，而且与机器所传递的功率有关。"],["特点","并联机组的效率主要取决于传递功率最大的机器的效率。欲提高并联机组的效率，应着重提高传递功率大的传动路线的效率。"]]]]},{"id":"q039","no":39,"order":39,"chap":"c5","sec":"机构自锁条件综合判断","level":"普通","q":"从机械效率的观点来看，机械的自锁条件是什么？自锁机械是否就是不能运动的机械？","a":"当驱动力任意增大恒有η≤0时，机械将发生自锁。自锁机械并非在任何条件下都不能运动。例如手摇螺旋千斤顶，转动手把能将物体举起，但在物体的重力作用下应不能驱动螺母反转，致使物体自行降落。必须避免机械在所需的运动方向发生自锁。","exp":"解题思路：本题核心考查自锁的效率判据与方向性两个核心概念，需先结合效率的物理意义推导自锁条件，再从方向性区分自锁与完全不能运动的差异，贴合工程应用场景理解自锁的实际价值。知识体系：1.自锁判据关联：效率判据η≤0与摩擦角判据（驱动力作用线位于摩擦角内）、螺旋/蜗杆传动导程角判据（导程角≤当量摩擦角）本质完全一致，均为输入功无法克服摩擦损耗的不同表述形式。易错分析：常见错误包括两类：①误认为自锁机械完全不能运动，忽略自锁的方向性；②混淆正/反行程效率，将正行程效率低等同于自锁，工程中定义的自锁机械仅要求反行程满足η≤0，正行程需保证正常传动效率。","fig":null,"page":null,"pts":[["自锁条件","当驱动力任意增大恒有η≤0时，机械将发生自锁。"],["自锁不等于不能运动","自锁机械并非在任何条件下都不能运动。例如手摇螺旋千斤顶，转动手把能将物体举起，但在物体的重力作用下应不能驱动螺母反转，致使物体自行降落。"],["设计要求","必须避免机械在所需的运动方向发生自锁。"]]},{"id":"q040","no":40,"order":40,"chap":"c5","sec":"摩擦角与摩擦圆概念/机构自锁条件综合判断","level":"普通","q":"何谓摩擦圆？以转动副连接的两构件，当外力（驱动力）分别作用于摩擦圆之内、之外，或者与该摩擦圆相切时，两构件将各呈现何种相对运动状态？","a":"以轴颈中心O为圆心，以ρ=f_v r为半径作圆，称其为摩擦圆。\n只要轴颈相对于轴承滑动，轴承对轴颈的总反力将始终切于摩擦圆。\n设作用在轴颈上的外载荷为一单力F，其力臂为a：作用线在摩擦圆之内，驱动力矩小于最大摩擦力矩，不能驱使轴颈转动，出现自锁；作用线在圆外，驱动力矩大于摩擦力矩，可驱使相对转动；作用线相切时，两力矩相等，是临界情形，可保持静止或已有的匀速转动。","exp":"1）核心机理：摩擦圆是把转动副摩擦等效后的几何判据。其半径近似为轴颈半径与摩擦因数的乘积，用于表示总反力作用线相对理想法向的位置偏移。\n2）状态判定：外力（或其等效作用线）相对摩擦圆位置可判别运动趋势：作用线位置相对运动状态结论在摩擦圆外可克服摩擦构件发生预期相对转动与摩擦圆相切临界平衡处于将动未动边界在摩擦圆内摩擦阻止反向运动易出现自锁。","fig":null,"page":null,"pts":[["摩擦圆","以轴颈中心O为圆心，以ρ=f_v r为半径作圆，称其为摩擦圆。"],["总反力","只要轴颈相对于轴承滑动，轴承对轴颈的总反力将始终切于摩擦圆。"],["三种情形","",[["作用线在圆内","设作用在轴颈上的外载荷为一单力F，其力臂为a：作用线在摩擦圆之内，驱动力矩小于最大摩擦力矩，不能驱使轴颈转动，出现自锁。"],["作用线在圆外","驱动力矩大于摩擦力矩，可驱使相对转动。"],["作用线相切","两力矩相等，是临界情形，可保持静止或已有的匀速转动。"]]]]},{"id":"q041","no":41,"order":41,"chap":"c5","sec":"机构自锁条件综合判断","level":"普通","q":"什么是机械的自锁？举出一个利用机械自锁的例子。","a":"由于摩擦的存在，会出现无论驱动力如何增大，也无法使机械运动的现象，这种现象称为机械的自锁。\n例如手摇螺旋千斤顶，将物体举起后，应保证不论物体的重量多大，都不能驱动螺母反转，致使物体自行降落下来；要求千斤顶在物体重力作用下具有自锁性。","exp":"解题思路：自锁的判断关键不在于驱动力是否暂时不足，而在于驱动力方向一定时，即使驱动力不断增大，机械仍因其产生的有效分力不足以克服相应的最大摩擦力而无法运动。\n知识体系：机械自锁具有方向性。机械在某一受力方向上可能自锁，而在反方向施加驱动力时仍可能运动。工程中既要避免机械在预期运动方向上发生自锁，也可利用自锁提高螺旋千斤顶、螺纹连接及防坠装置等设备的安全性。\n易错分析：不能把“驱动力较小而暂时无法运动”称为自锁，也不能认为只要存在摩擦就一定会自锁。自锁强调的是在给定受力方向下，驱动力无论怎样增大都不能使机械运动。","fig":null,"page":null,"pts":[["机械自锁","由于摩擦的存在，会出现无论驱动力如何增大，也无法使机械运动的现象，这种现象称为机械的自锁。"],["举例","例如手摇螺旋千斤顶，将物体举起后，应保证不论物体的重量多大，都不能驱动螺母反转，致使物体自行降落下来；要求千斤顶在物体重力作用下具有自锁性。"]]},{"id":"q042","no":42,"order":42,"chap":"c5","sec":"机构自锁条件综合判断/死点位置分析","level":"普通","q":"指出（a）机构自由度F≤0，(b）死点，(c）自锁，三者之间的区别。","a":"(a）自由度F=0，说明各构件之间没有相对运动，构成刚性桁架；F<0说明约束过多，构成超静定桁架。这是构件组合的结构问题。(b）死点是机构运动到传动角γ=0°的位置，主动件传来的力恰好通过从动件回转中心，出现不能使从动件转动的“顶死”现象。可用安装飞轮或多组机构错位组合等方法通过。(c）自锁是静止机械因有害阻力的作用，不论驱动力多大都不能发生运动。按效率判断为η≤0，其中η=0要求原来静止，是临界自锁。三者分别涉及结构约束、特殊位置的传力条件和有害阻力造成的运动限制。","exp":"","fig":null,"page":null,"pts":[["自由度F≤0","自由度F=0，说明各构件之间没有相对运动，构成刚性桁架；F<0说明约束过多，构成超静定桁架。这是构件组合的结构问题。"],["死点","机构运动到传动角γ=0°的位置，主动件传来的力恰好通过从动件回转中心，出现不能使从动件转动的“顶死”现象。可用安装飞轮或多组机构错位组合等方法通过。"],["自锁","静止机械因有害阻力的作用，不论驱动力多大都不能发生运动。按效率判断为η≤0，其中η=0要求原来静止，是临界自锁。"],["三者区别","三者分别涉及结构约束、特殊位置的传力条件和有害阻力造成的运动限制。"]]},{"id":"q043","no":43,"order":43,"chap":"c6","sec":"静平衡与动平衡概念","level":"普通","q":"经过平衡设计的刚性转子，在制造出来后是否还需进行平衡试验？为什么？（每问各2分）","a":"需要。\n在设计时已经考虑过平衡的转子，由于制造和装配的不精确、材质的不均匀等原因，又会产生新的不平衡。\n这时，由于不平衡量的大小和方位未知，故只能用实验的方法来平衡。","exp":"","fig":null,"page":null,"pts":[["结论","需要。"],["原因","在设计时已经考虑过平衡的转子，由于制造和装配的不精确、材质的不均匀等原因，又会产生新的不平衡。"],["平衡方法","这时，由于不平衡量的大小和方位未知，故只能用实验的方法来平衡。"]]},{"id":"q044","no":44,"order":44,"chap":"c6","sec":"静平衡与动平衡概念","level":"普通","q":"刚性转子的静平衡和动平衡有什么区别？为什么动平衡的转子必定是静平衡的？","a":"如果只要求其惯性力平衡，则称为转子的静平衡；如果同时要求其惯性力和惯性力矩平衡，则称为转子的动平衡。\n动平衡的条件是：各偏心质量（包含平衡质量）产生的惯性力的矢量和为零，这些惯性力所构成的力矩矢量和也为零。\n因此，动平衡同时满足静平衡条件，动平衡的转子必定是静平衡的。","exp":"","fig":null,"page":null,"pts":[["定义","",[["静平衡","如果只要求其惯性力平衡，则称为转子的静平衡。"],["动平衡","如果同时要求其惯性力和惯性力矩平衡，则称为转子的动平衡。"]]],["动平衡的条件","各偏心质量（包含平衡质量）产生的惯性力的矢量和为零，这些惯性力所构成的力矩矢量和也为零。"],["两者关系","因此，动平衡同时满足静平衡条件，动平衡的转子必定是静平衡的。"]]},{"id":"q045","no":45,"order":45,"chap":"c6","sec":"","level":"普通","q":"请说明不平衡惯性力的危害。","a":"不平衡惯性力在运动副中引起附加的动压力，增大运动副中的摩擦和构件中的内应力，降低机械效率和使用寿命；还将引起机械及其基础产生强迫振动。\n如其频率接近机械的固有频率，不仅影响机械本身，还会使附近的工作机械及厂房建筑受到影响甚至破坏。\n有一些机械却是利用这种振动来工作的，如振动筛、振动干燥机、振动破碎机、振动运输机、振动压路机、振动整形机、振动按摩器等。","exp":"","fig":null,"page":null,"pts":[["危害","不平衡惯性力在运动副中引起附加的动压力，增大运动副中的摩擦和构件中的内应力，降低机械效率和使用寿命；还将引起机械及其基础产生强迫振动。如其频率接近机械的固有频率，不仅影响机械本身，还会使附近的工作机械及厂房建筑受到影响甚至破坏。"],["振动利用","有一些机械却是利用这种振动来工作的，如振动筛、振动干燥机、振动破碎机、振动运输机、振动压路机、振动整形机、振动按摩器等。"]]},{"id":"q046","no":46,"order":46,"chap":"c6","sec":"静平衡与动平衡概念","level":"普通","q":"为什么设计一个刚性回转件时要确定它的许用不平衡量？如何确定？","a":"经过平衡实验的转子不可避免地还有残存不平衡。\n减小残存不平衡量势必要提高平衡成本，因此应根据工作要求规定适当的许用不平衡量和许用不平衡度。\n根据转子类型查平衡品质等级，由平衡品质量级（eω）求得。\n式中（eω）用mm/s，ω为转子角速度（rad/s)，m为转子质量（kg)。","exp":"","fig":null,"page":null,"pts":[["残存不平衡","经过平衡实验的转子不可避免地还有残存不平衡。"],["许用不平衡量","减小残存不平衡量势必要提高平衡成本，因此应根据工作要求规定适当的许用不平衡量和许用不平衡度。"],["如何确定","",[["确定方法","根据转子类型查平衡品质等级，由平衡品质量级（eω）求得。"],["单位与符号","式中（eω）用mm/s，ω为转子角速度（rad/s)，m为转子质量（kg)。"]]]]},{"id":"q047","no":47,"order":47,"chap":"c6","sec":"静平衡与动平衡概念","level":"普通","q":"造成机械不平衡的原因可能有哪些？","a":"在设计时已经考虑过平衡的转子，由于制造和装配的不精确、材质的不均匀等原因，又会产生新的不平衡。","exp":"","fig":null,"page":null,"pts":[["不平衡原因","在设计时已经考虑过平衡的转子，由于制造和装配的不精确、材质的不均匀等原因，又会产生新的不平衡。"]]},{"id":"q048","no":48,"order":48,"chap":"c6","sec":"静平衡与动平衡概念","level":"普通","q":"何谓质径积？回转件平衡时为什么要用质径积来表示不平衡量的大小？","a":"质量与其矢径的乘积miri称为质径积，为矢量。各偏心质量所产生的离心惯性力为 F_{Ii}=m_i ω²r_i，各质量具有共同的ω²，消去这一因子后，可用质径积矢量表示各离心惯性力的相对大小和方向。","exp":"","fig":null,"page":null,"pts":[["质径积","质量与其矢径的乘积miri称为质径积，为矢量。"],["用质径积表示的原因","各偏心质量所产生的离心惯性力为 F_{Ii}=m_i ω²r_i，各质量具有共同的ω²，消去这一因子后，可用质径积矢量表示各离心惯性力的相对大小和方向。"]]},{"id":"q049","no":49,"order":49,"chap":"c6","sec":"平面机构平衡（完全平衡和部分平衡）","level":"普通","q":"机构总惯性力的完全、部分平衡方法有哪些？各有何特点？","a":"完全平衡：利用平衡机构，可得到很好的平衡效果，但会使结构复杂、体积大为增加；利用平衡质量，使总质心静止不动，但会使机构质量大大增加，还可能增大活塞侧向力、连杆轴承负荷等，需检验对驱动力矩、支承反力和铰接点作用力的影响。\n部分平衡只平衡掉总惯性力的一部分。\n方法有：利用平衡机构，使运动规律不完全一致而方向相反的惯性力部分抵消；利用平衡质量，平衡离心惯性力及部分往复惯性力；利用弹簧平衡，通过合理选择弹簧刚度和安装位置，使惯性力部分平衡。\n与加平衡质量相比，弹簧法具有结构简化、减少整机重量、安装调试方便等优点。","exp":"","fig":null,"page":null,"pts":[["完全平衡","",[["平衡机构","利用平衡机构，可得到很好的平衡效果，但会使结构复杂、体积大为增加。"],["平衡质量","利用平衡质量，使总质心静止不动，但会使机构质量大大增加，还可能增大活塞侧向力、连杆轴承负荷等，需检验对驱动力矩、支承反力和铰接点作用力的影响。"]]],["部分平衡","",[["含义","部分平衡只平衡掉总惯性力的一部分。"],["方法","利用平衡机构，使运动规律不完全一致而方向相反的惯性力部分抵消；利用平衡质量，平衡离心惯性力及部分往复惯性力；利用弹簧平衡，通过合理选择弹簧刚度和安装位置，使惯性力部分平衡。"],["弹簧法的优点","与加平衡质量相比，弹簧法具有结构简化、减少整机重量、安装调试方便等优点。"]]]]},{"id":"q050","no":50,"order":50,"chap":"c6","sec":"平面机构平衡（完全平衡和部分平衡）","level":"普通","q":"为什么作往复运动的构件和作平面复合运动的构件不能在构件本身内获得平衡，而必须在基座上平衡？机构在基座上平衡的实质是什么？","a":"作往复移动或平面复合运动的构件，其所产生的惯性力无法在该构件本身上平衡，而必须就整个机构加以研究。\n各运动构件所产生的惯性力可以合成为一个通过机构质心的总惯性力和一个总惯性力偶矩全部由基座承受。\n机构在基座上平衡的实质，是设法使各运动构件惯性力的合力和合力偶得到完全或部分平衡，以消除或降低最终传到机械基础上的不平衡惯性力。","exp":"","fig":null,"page":null,"pts":[["原因","作往复移动或平面复合运动的构件，其所产生的惯性力无法在该构件本身上平衡，而必须就整个机构加以研究。",[["传递路径","各运动构件所产生的惯性力可以合成为一个通过机构质心的总惯性力和一个总惯性力偶矩全部由基座承受。"]]],["实质","机构在基座上平衡的实质，是设法使各运动构件惯性力的合力和合力偶得到完全或部分平衡，以消除或降低最终传到机械基础上的不平衡惯性力。"]]},{"id":"q051","no":51,"order":51,"chap":"c7","sec":"机械运转三阶段概念","level":"普通","q":"机械运转分为哪三个阶段，三个阶段的功能关系如何？","a":"(1）起动阶段：主动件的角速度由零逐渐上升，直至达到正常运转速度；驱动功大于阻抗功，机械积蓄动能，W_d=W′+E。\n(2）稳定运转阶段：主动件的平均角速度保持为常数；就一个周期而言，机械的总驱动功与总阻抗功相等，W_d=W'。\n(3）停车阶段：驱动功W_φ=0，当阻抗功将机械具有的动能消耗完时，机械便停止运转。","exp":"","fig":null,"page":null,"pts":[["起动阶段","主动件的角速度由零逐渐上升，直至达到正常运转速度；驱动功大于阻抗功，机械积蓄动能，W_d=W′+E。"],["稳定运转阶段","主动件的平均角速度保持为常数；就一个周期而言，机械的总驱动功与总阻抗功相等，W_d=W'。"],["停车阶段","驱动功W_φ=0，当阻抗功将机械具有的动能消耗完时，机械便停止运转。"]]},{"id":"q052","no":52,"order":52,"chap":"c7","sec":"机械运转三阶段概念","level":"普通","q":"机构实现周期变速稳定运转的条件是什么？","a":"在稳定运转阶段，主动件的平均角速度ω_m保持为一常数，而主动件的角速度ω通常还会出现周期性波动。\n就一个周期而言，机械的总驱动功与总阻抗功是相等的，即W_φ=W_r。\n上述这种稳定运转称为周期变速稳定运转。","exp":"能量关系为\n若等效转动惯量J随位置周期变化，只要J和角速度在周期首尾恢复，对应动能EJ_eω²/2仍可周期恢复。周期内驱动功不必在每一瞬间等于阻抗功。","fig":null,"page":null,"pts":[["平均角速度恒定","在稳定运转阶段，主动件的平均角速度ω_m保持为一常数，而主动件的角速度ω通常还会出现周期性波动。"],["周期内驱动功等于阻抗功","就一个周期而言，机械的总驱动功与总阻抗功是相等的，即W_φ=W_r。上述这种稳定运转称为周期变速稳定运转。"]]},{"id":"q053","no":53,"order":53,"chap":"c7","sec":"速度波动调节概念/飞轮转动惯量设计","level":"普通","q":"什么是机器的\"平均速度\"和\"速度不均匀系数δ\"？δ是否选得越小越好？","a":"平均角速度在工程实际中常用算术平均值表示，即ω_m=(ω_max+ω_min)/2。\n运动不均匀系数定义为角速度波动的幅度与平均角速度之比，即 δ=(ω_max−ω_min)/ω_m。\nδ不是越小越好。\n不同类型的机械对它的要求不同，设计时不得超过允许值。\n当最大盈亏功与平均角速度一定时，若许用不均匀系数下降，则飞轮转动惯量增加；过分追求机械运转速度的均匀性，将会使飞轮过于笨重。","exp":"","fig":null,"page":null,"pts":[["平均角速度","在工程实际中常用算术平均值表示，即ω_m=(ω_max+ω_min)/2。"],["速度不均匀系数","运动不均匀系数定义为角速度波动的幅度与平均角速度之比，即 δ=(ω_max−ω_min)/ω_m。"],["是否越小越好","δ不是越小越好。不同类型的机械对它的要求不同，设计时不得超过允许值。当最大盈亏功与平均角速度一定时，若许用不均匀系数下降，则飞轮转动惯量增加；过分追求机械运转速度的均匀性，将会使飞轮过于笨重。"]]},{"id":"q054","no":54,"order":54,"chap":"c7","sec":"速度波动调节概念","level":"普通","q":"为什么说在锻压设备中安装飞轮可以起到节能的作用？","a":"锻压机械在一个工作周期中，工作时间很短，而峰值载荷很大。\n安装飞轮，不但可以调速，还利用了飞轮在机械非工作时间所储存的能量来帮助克服其尖峰载荷，从而可以选用较小功率的原动机来拖动，进而达到减少投资及降低能耗的目的。","exp":"","fig":null,"page":null,"pts":[["工作特点","锻压机械在一个工作周期中，工作时间很短，而峰值载荷很大。"],["节能原理","安装飞轮，不但可以调速，还利用了飞轮在机械非工作时间所储存的能量来帮助克服其尖峰载荷，从而可以选用较小功率的原动机来拖动，进而达到减少投资及降低能耗的目的。"]]},{"id":"q055","no":55,"order":55,"chap":"c7","sec":"速度波动调节概念","level":"普通","q":"飞轮为什么可以调速？能否利用飞轮来调节非周期性速度波动，为什么？","a":"飞轮之所以能调速是利用了它的储能作用。\n由于飞轮具有很大的转动惯量，转速只要略有变化，就可储存或释放较大的能量；机械出现盈功时储存能量，出现亏功时释放能量，以弥补能量不足，使机械速度波动的幅度下降。\n非周期性速度波动需使等效驱动力矩与等效阻抗力矩彼此相互适应；飞轮仅储存或释放动能，不能消除长期不平衡，需利用原动机自调性或安装调速器。","exp":"解题思路：本题的关键是比较一个运动循环内和较长时间内的能量收支。飞轮依靠转动惯量储存、释放动能，只能调节循环内反复出现的盈功和亏功；当驱动功率与负载功率长期不平衡时，必须通过调速器改变能量输入。\n知识体系：周期性速度波动的特征是一个运动循环内存在盈功和亏功，但整个循环的驱动功与阻力功相等，机械动能在循环结束时恢复原值。飞轮增大了系统的等效转动惯量，使相同的动能变化对应较小的角速度变化，因而能够减小速度波动。\n非周期性速度波动的特征是驱动功与阻力功在较长时间内不相等，机械平均动能和平均转速持续改变。飞轮只能暂时缓冲这种变化，不能消除长期能量失衡，所以应采用调速器等自动调节装置。\n易错分析：“飞轮调速”并不是使机械始终保持绝对等速，而是减小周期性速度波动。判断能否使用飞轮调节的关键，不在于波动是否缓慢或随机，而在于能量盈亏是否在一个运动循环内相互抵消。若驱动功率长期大于或小于负载功率，飞轮储存或释放的能量最终会达到限+n+/π。","fig":null,"page":null,"pts":[["调速原理","飞轮之所以能调速是利用了它的储能作用。",[["储能过程","由于飞轮具有很大的转动惯量，转速只要略有变化，就可储存或释放较大的能量；机械出现盈功时储存能量，出现亏功时释放能量，以弥补能量不足，使机械速度波动的幅度下降。"]]],["能否调节非周期性速度波动","非周期性速度波动需使等效驱动力矩与等效阻抗力矩彼此相互适应；飞轮仅储存或释放动能，不能消除长期不平衡，需利用原动机自调性或安装调速器。"]]},{"id":"q056","no":56,"order":56,"chap":"c7","sec":"速度波动调节概念","level":"普通","q":"机械产生速度波动的主要原因是什么？速度波动会引起什么后果？","a":"驱动力矩和阻力矩一般都不是时时相等的。当驱动力矩大于阻力矩时，机械出现盈功，动能增加，速度上升；当驱动力矩小于阻力矩时，机械出现亏功，动能减小，速度下降。因此，机械运转时会产生速度波动。过大的速度波动对机械的工作质量、效率和寿命都有不良影响，应将其限制在许可范围内。","exp":"解题思路：本题属于机械系统动力学基础概念题，核心从稳定运转阶段的力矩-动能对应关系推导速度波动的产生原因，再从动力学效应、工作性能两个维度梳理危害即可。\n知识体系：速度波动分为两类，对应不同的产生特点和调节方法，关联关系如下：波动类型产生特点调节方法周期性速度波动力矩随运动周期周期性变化，一个运动周期内系统安装飞轮调节总功平衡非周期性速度波力矩无规律突变，系统总功不守恒，无固定波动周安装调速器调动期节。\n易错分析：常见误区是将转动惯量作为速度波动的主要诱因，实际上瞬时驱动力矩与阻力矩不平衡才是速度波动产生的核心原因，转动惯量仅影响波动的幅度大小，不决定波动是否产生。","fig":null,"page":null,"pts":[["产生原因","驱动力矩和阻力矩一般都不是时时相等的。当驱动力矩大于阻力矩时，机械出现盈功，动能增加，速度上升；当驱动力矩小于阻力矩时，机械出现亏功，动能减小，速度下降。因此，机械运转时会产生速度波动。"],["后果","过大的速度波动对机械的工作质量、效率和寿命都有不良影响，应将其限制在许可范围内。"]]},{"id":"q057","no":57,"order":57,"chap":"c7","sec":"速度波动调节概念","level":"普通","q":"周期性和非周期性速度波动的区别在哪里？一般采用什么方法进行调节？","a":"周期性速度波动发生在稳定运转阶段，主动件的平均角速度保持为常数，一个周期内机械的总驱动功与总阻抗功相等。采用飞轮调节：盈功时吸收储存能量，亏功时释放能量，使速度波动幅度下降。非周期性速度波动：等效力矩的变化是非周期性的，机械速度出现非周期性波动，破坏稳定运转。需设法使等效驱动力矩与等效阻抗力矩相互适应；电动机可利用本身的自调性，蒸汽机、汽轮机或内燃机等必须安装调速器。\n解题思路：本题属于机械系统动力学基础概念题，核心从波动规律、能量特性、产生原因三个维度区分两类速度波动，再结合调节装置的工作原理对应匹配适用场景。\n知识体系：两类速度波动核心差异对比：对比维周期性速度波动非周期性速度波动度波动特有固定周期，与机械运动周期一致无固定周期，波动随机无规律性能量规一个运动周期内驱动总功与阻力总功相驱动功与阻力功持续不平衡，总动律等，动能增量为0能持续增减产生原驱动/阻力矩发生非周期性突变。","exp":"解题思路：本题属于机械系统动力学基础概念题，核心从波动规律、能量特性、产生原因三个维度区分两类速度波动，再结合调节装置的工作原理对应匹配适用场景。","fig":null,"page":null,"pts":[["周期性速度波动","发生在稳定运转阶段，主动件的平均角速度保持为常数，一个周期内机械的总驱动功与总阻抗功相等。采用飞轮调节：盈功时吸收储存能量，亏功时释放能量，使速度波动幅度下降。"],["非周期性速度波动","等效力矩的变化是非周期性的，机械速度出现非周期性波动，破坏稳定运转。需设法使等效驱动力矩与等效阻抗力矩相互适应；电动机可利用本身的自调性，蒸汽机、汽轮机或内燃机等必须安装调速器。"]]},{"id":"q058","no":58,"order":58,"chap":"c7","sec":"速度波动调节概念","level":"普通","q":"在稳定运转时期，机器速度波动为什么要用速度不均匀系数表示，而不用速度的差值表示？","a":"机械速度波动的程度不仅与速度变化的幅度有关，也与平均角速度的大小有关。\n综合考虑这两方面的因素，用运动不均匀系数表示机械速度波动的程度，其定义为角速度波动的幅度与平均角速度之比：","exp":"解题思路：本题核心是区分绝对速度差和相对速度波动的评价逻辑，从速度波动对机器工作性能的影响本质出发，论证采用相对评价指标的合理性。\n知识体系：速度不均匀系数δ是机械速度波动调节的核心评价指标，定义为 δ=(ω_max−ω_min)/ω_m，其中ω_max、ω_min分别为最大、最小角速度，ω_m为平均角速度。该指标为无量纲相对值，消除了基准转速的影响，可统一评价不同转速工况下的速度波动程度。\n易错分析：常见错误是混淆绝对误差与相对误差的适用场景，忽略相同绝对速度差在不同基准转速下，对机器的动态特性、传动精度、振动噪声的影响存在量级差异，错误采用绝对速度差评价波动程度。","fig":null,"page":null,"pts":[["用不均匀系数表示的原因","机械速度波动的程度不仅与速度变化的幅度有关，也与平均角速度的大小有关。综合考虑这两方面的因素，用运动不均匀系数表示机械速度波动的程度，其定义为角速度波动的幅度与平均角速度之比。"]]},{"id":"q059","no":59,"order":59,"chap":"c7","sec":"速度波动调节概念","level":"普通","q":"机械安装飞轮后能否得到绝对均匀的运转？为什么？","a":"不能。由于JF不可能为无穷大，若ΔW_max≠0，则[δ]不可能为零，即安装飞轮后机械的速度仍有波动，只是幅度有所减小而已。","exp":"","fig":null,"page":null,"pts":[["能否绝对均匀","不能。由于JF不可能为无穷大，若ΔW_max≠0，则[δ]不可能为零，即安装飞轮后机械的速度仍有波动，只是幅度有所减小而已。"]]},{"id":"q060","no":60,"order":60,"chap":"c7","sec":"速度波动调节概念","level":"普通","q":"在一个工作循环中，作用在电动机轴上的驱动力矩和作用在输出摇杆上的生产阻力矩都是常数，此时理论上是否需要安装飞轮？请说明理由。","a":"一般仍需要考虑用飞轮调节周期性速度波动，不能因两个力矩都是常数就认为不需要飞轮。等效力矩须按功率相等换算。把摇杆上的阻力矩Mr换算到电动机轴，其等效阻力矩大小为 M_{er}=M_r ω_r/ω_m。摇杆的角速度与电动机轴角速度之比随机构位置变化，故即使M为常数，等效阻力矩也不是常数；恒定驱动力矩与它通常不能在各瞬时相平衡，因而会产生盈亏功及周期性速度波动。是否必须另装飞轮，还应按运动不均匀系数判断：若系统自身惯量已使δ≤[δ]，可不另装；否则应安装飞轮调节。","exp":"","fig":null,"page":null,"pts":[["结论","一般仍需要考虑用飞轮调节周期性速度波动，不能因两个力矩都是常数就认为不需要飞轮。等效力矩须按功率相等换算。把摇杆上的阻力矩Mr换算到电动机轴，其等效阻力矩大小为 M_{er}=M_r ω_r/ω_m。摇杆的角速度与电动机轴角速度之比随机构位置变化，故即使M为常数，等效阻力矩也不是常数；恒定驱动力矩与它通常不能在各瞬时相平衡，因而会产生盈亏功及周期性速度波动。"],["判别依据","是否必须另装飞轮，还应按运动不均匀系数判断：若系统自身惯量已使δ≤[δ]，可不另装；否则应安装飞轮调节。"]]},{"id":"q061","no":61,"order":61,"chap":"c7","sec":"等效力学模型建立","level":"普通","q":"建立机器的等效动力学模型应遵循的原则是什么？","a":"建立等效动力学模型，应使等效构件的动能等于整个机械系统的动能，使等效力（或等效力矩）的瞬时功率等于原系统所有外力、外力矩在同一瞬时的功率之和。\n等效构件可选转动构件，也可选移动构件。","exp":"","fig":null,"page":null,"pts":[["等效原则","建立等效动力学模型，应使等效构件的动能等于整个机械系统的动能，使等效力（或等效力矩）的瞬时功率等于原系统所有外力、外力矩在同一瞬时的功率之和。"],["等效构件","选转动构件，也可选移动构件。"]]},{"id":"q062","no":62,"order":62,"chap":"c7","sec":"等效力学模型建立","level":"普通","q":"什么是等效力和等效力矩？什么是等效质量和等效转动惯量？动力学分析中引入他们的目的是什么？","a":"等效力、等效力矩是归算到等效构件上的假想力、力矩，按瞬时功率相等确定：F_e v=P或M_e ω=P。\n等效质量、等效转动惯量按动能相等确定：m_e v²/2=E或J_eω²/2=E；P为原系统总外力功率，E为原系统总动能。\n对一个单自由度机械系统运动的研究可以简化为对该系统中某一个构件运动的研究。\n利用等效动力学模型建立的机械运动方程式，不仅形式简单，而且方程式的求解也将大为简化。","exp":"核心机理：等效力（矩）保证瞬时总功率不变，等效质量（转动惯量）保证总动能不变。各构件速度不同时，归算值含速度比及其平方，因此通常不同于原系统的合力、总质量或总转动惯量。","fig":null,"page":null,"pts":[["等效力与等效力矩","等效力、等效力矩是归算到等效构件上的假想力、力矩，按瞬时功率相等确定：F_e v=P或M_e ω=P。"],["等效质量与等效转动惯量","等效质量、等效转动惯量按动能相等确定：m_e v²/2=E或J_eω²/2=E；P为原系统总外力功率，E为原系统总动能。"],["目的","对一个单自由度机械系统运动的研究可以简化为对该系统中某一个构件运动的研究。利用等效动力学模型建立的机械运动方程式，不仅形式简单，而且方程式的求解也将大为简化。"]]},{"id":"q063","no":63,"order":63,"chap":"c7","sec":"等效力学模型建立","level":"普通","q":"是否只能选原动件作为等效构件？","a":"不是。等效构件也可选用移动构件，如曲柄滑块机构可选滑块为等效构件，其广义坐标为滑块的位移。","exp":"","fig":null,"page":null,"pts":[["是否只能选原动件","不是。等效构件也可选用移动构件，如曲柄滑块机构可选滑块为等效构件，其广义坐标为滑块的位移。"]]},{"id":"q064","no":64,"order":64,"chap":"c7","sec":"等效力学模型建立","level":"普通","q":"等效力是所有作用在机构上的外力的合力吗？等效质量是机构中所有构件质量之和吗？","a":"都不是。\n取作移动的构件为等效构件，其速度为 v 时，可分别按动能相等、功率相等求出等效质量和等效力。\n对于运动约束确定的刚性单自由度机构，等效质量由各构件的质量、转动惯量和运动学速比确定，与真实速度大小无关。等效力还取决于实际外力、外力矩及其方向；外力或外力矩随速度变化时，等效力也会随之变化。\n由上式可见，等效质量不是各构件质量之和，等效力也不是各外力的合力。","exp":"","fig":null,"page":null,"pts":[["结论","都不是。取作移动的构件为等效构件，其速度为 v 时，可分别按动能相等、功率相等求出等效质量和等效力。"],["决定因素","对于运动约束确定的刚性单自由度机构，等效质量由各构件的质量、转动惯量和运动学速比确定，与真实速度大小无关。等效力还取决于实际外力、外力矩及其方向；外力或外力矩随速度变化时，等效力也会随之变化。"],["小结","由上式可见，等效质量不是各构件质量之和，等效力也不是各外力的合力。"]]},{"id":"q065","no":65,"order":65,"chap":"c7","sec":"最大盈亏功计算","level":"普通","q":"什么是最大盈亏功？如何确定其值？","a":"最大盈亏功是驱动功与阻抗功之差的最大值，即ΔW_max=E_max−E_min。简单情况可直接由等效力矩图看出；复杂情况借助能量指示图：按比例用铅垂向量线段依次表示驱动力矩与阻抗力矩之间所包围的面积，盈功向上画、亏功向下画，折线最高点和最低点的距离就代表最大盈亏功的大小。","exp":"","fig":null,"page":null,"pts":[["定义","最大盈亏功是驱动功与阻抗功之差的最大值，即ΔW_max=E_max−E_min。"],["确定方法","简单情况可直接由等效力矩图看出；复杂情况借助能量指示图：按比例用铅垂向量线段依次表示驱动力矩与阻抗力矩之间所包围的面积，盈功向上画、亏功向下画，折线最高点和最低点的距离就代表最大盈亏功的大小。"]]},{"id":"q066","no":66,"order":66,"chap":"c7","sec":"最大盈亏功计算","level":"普通","q":"如何确定机械系统一个运动周期最大角速度ω_max与最小角速度ω_min所在位置？","a":"对复杂情况，可借助能量指示图：按比例用铅垂向量线段依次表示等效驱动力矩与等效阻抗力矩之间所包围的面积，盈功向上画，亏功向下画。\n折线最高点处动能最大，最低点处动能最小。\n等效转动惯量可视为常数时，这两个位置分别对应ω_max、ω_min。\n若J_e随位置变化，则应由 ω²(φ)=2E(φ)/J_e(φ) 确定速度极值，不能只看动能极值。","exp":"","fig":null,"page":null,"pts":[["能量指示图","对复杂情况，可借助能量指示图：按比例用铅垂向量线段依次表示等效驱动力矩与等效阻抗力矩之间所包围的面积，盈功向上画，亏功向下画。"],["极值位置","折线最高点处动能最大，最低点处动能最小。等效转动惯量可视为常数时，这两个位置分别对应ω_max、ω_min。"],["Je变化时","若J_e随位置变化，则应由 ω²(φ)=2E(φ)/J_e(φ) 确定速度极值，不能只看动能极值。"]]},{"id":"q067","no":67,"order":67,"chap":"c7","sec":"飞轮转动惯量设计","level":"普通","q":"飞轮应安装在哪里？通常选择高速轴的原因是什么？","a":"当最大盈亏功与许用不均匀系数一定时，飞轮转动惯量与平均角速度的平方值成反比，故为减小飞轮转动惯量，最好将飞轮安装在机械的高速轴上。\n在实际设计中还必须考虑安装飞轮轴的刚性和结构上的可能性等因素。","exp":"","fig":null,"page":null,"pts":[["安装位置","当最大盈亏功与许用不均匀系数一定时，飞轮转动惯量与平均角速度的平方值成反比，故为减小飞轮转动惯量，最好将飞轮安装在机械的高速轴上。"],["其他因素","在实际设计中还必须考虑安装飞轮轴的刚性和结构上的可能性等因素。"]]},{"id":"q068","no":68,"order":68,"chap":"c8","sec":"","level":"普通","q":"(2020年及之前面试考场真题）将旋转运动转化为直线运动的机构有哪些？","a":"常见的有连杆机构、凸轮机构、螺旋机构、齿轮齿条机构及组合机构等，应选用能输出直线运动的形式。\n例如曲柄滑块机构、正弦机构可输出往复移动；直动推杆凸轮机构使推杆在导轨内往复移动；螺旋机构一般把螺杆旋转变为螺母轴向直线运动。","exp":"核心机理：应按所需直线运动是单向进给还是往复移动选机构。齿轮齿条、螺旋机构适于回转与直移转换；曲柄滑块、直动推杆凸轮等适于将连续回转变为往复直移。","fig":null,"page":null,"pts":[["常见机构","常见的有连杆机构、凸轮机构、螺旋机构、齿轮齿条机构及组合机构等，应选用能输出直线运动的形式。"],["举例","例如曲柄滑块机构、正弦机构可输出往复移动；直动推杆凸轮机构使推杆在导轨内往复移动；螺旋机构一般把螺杆旋转变为螺母轴向直线运动。"]]},{"id":"q069","no":69,"order":69,"chap":"c8","sec":"平面连杆机构的介绍及特点","level":"普通","q":"平面连杆机构的特点（优缺点）","a":"优点：运动副均为低副，面接触，单位面积压力较小，便于润滑、磨损较小，能传递较大载荷；低副元件表面为圆柱面和平面，制造简单、成本较低、精度较高；连杆曲线上不同点的轨迹可满足不同运动轨迹要求。\n缺点：精确实现给定运动规律的设计较困难，大多只能近似满足；低副间隙引起运动误差；构件惯性力难于平衡，不宜用于高速场合。","exp":"","fig":null,"page":null,"pts":[["优点","运动副均为低副，面接触，单位面积压力较小，便于润滑、磨损较小，能传递较大载荷；低副元件表面为圆柱面和平面，制造简单、成本较低、精度较高；连杆曲线上不同点的轨迹可满足不同运动轨迹要求。"],["缺点","精确实现给定运动规律的设计较困难，大多只能近似满足；低副间隙引起运动误差；构件惯性力难于平衡，不宜用于高速场合。"]]},{"id":"q070","no":70,"order":70,"chap":"c8","sec":"铰链四杆机构基本类型","level":"普通","q":"平面四杆机构的基本型式是什么？它的演化方式有哪几种？","a":"平面铰链四杆机构是平面四杆机构的基本形式，其他类型和结构形式的四杆机构都可认为是铰链四杆机构的演化形式。\n主要变换有构件变换和运动副变换：机架变换、主动件变换、转动副与移动副的变换、运动副元素尺寸扩大及运动副元素的逆换。","exp":"“基本形式”与“基本类型”是两个层次：前者回答铰链四杆机构，后者才列举曲柄摇杆、双曲柄、双摇杆。不能只列三种类型而漏掉本题要求的基本形式。\n取同一运动链中的不同构件为机架称为机构倒置；将转动副演化成移动副可得到含滑块或导杆的机构；扩大转动副尺寸可方便结构设计、提高强度，并不必然改变原运动规律。","fig":null,"page":null,"pts":[["基本型式","平面铰链四杆机构是平面四杆机构的基本形式，其他类型和结构形式的四杆机构都可认为是铰链四杆机构的演化形式。"],["演化方式","机架变换、主动件变换、转动副与移动副的变换、运动副元素尺寸扩大及运动副元素的逆换。"]]},{"id":"q071","no":71,"order":71,"chap":"c8","sec":"铰链四杆机构基本类型","level":"普通","q":"平行双曲柄机构（平行四边形机构）的特点？应用中常出现的问题？解决措施？","a":"两曲柄以相同角速度同向转动，连杆作平动，其任一点轨迹为以曲柄长度为半径的圆。\n曲柄与机架共线时，可能在平行与反平行四边形之间转换，此时运动不确定，需配辅助装置。\n可增加与曲柄平行等长的构件及两个转动副，形成虚约束，以保证连杆运动连续。","exp":"","fig":null,"page":null,"pts":[["运动特点","两曲柄以相同角速度同向转动，连杆作平动，其任一点轨迹为以曲柄长度为半径的圆。"],["运动不确定","曲柄与机架共线时，可能在平行与反平行四边形之间转换，此时运动不确定，需配辅助装置。"],["解决措施","可增加与曲柄平行等长的构件及两个转动副，形成虚约束，以保证连杆运动连续。"]]},{"id":"q072","no":72,"order":72,"chap":"c8","sec":"四杆机构演化形式","level":"普通","q":"偏心轮机构是如何演化而来的？它主要用于什么场合？","a":"在曲柄滑块机构中，若扩大转动副B的尺寸，即将其轴颈的半径扩大，并超过曲柄的长度而演化为偏心盘，其回转中心A至几何中心B的偏心距e等于曲柄长度，这种机构称为偏心轮机构。\n扩大运动副元素尺寸的方法，并没有改变机构的组成特性，其运动特性与曲柄滑块机构也完全相同，却可以带来结构设计上的方便和强度的提高。\n故该机构常用于压力机、冲床等设备上。","exp":"解题思路：本题考查平面铰链四杆机构的演化原理及工程应用，首先明确偏心轮的演化来源，再结合其结构特征推导适用场景。\n知识体系：平面四杆机构的常见演化方式有4类：扩大转动副、改变构件相对长度、转动副转化为移动副、互换机架，偏心轮是扩大转动副的典型演化结构，其核心参数偏心距完全等效于原曲柄的长度。\n易错分析：常见错误包括两类：一是混淆偏心距与偏心轮半径的定义，误将偏心轮外圆半径当作曲柄长度，实际上只有偏心轮回转中心到外圆圆心的距离（偏心距）对应原曲柄长度；二是记错适用场景，偏心轮的偏心部分质量较大，高速下离心惯性力大、动平衡难度高，因此仅适用于低速重载场合，不可用于高速场景。","fig":null,"page":null,"pts":[["演化由来","在曲柄滑块机构中，若扩大转动副B的尺寸，即将其轴颈的半径扩大，并超过曲柄的长度而演化为偏心盘，其回转中心A至几何中心B的偏心距e等于曲柄长度，这种机构称为偏心轮机构。"],["结构特点","扩大运动副元素尺寸的方法，并没有改变机构的组成特性，其运动特性与曲柄滑块机构也完全相同，却可以带来结构设计上的方便和强度的提高。"],["应用场合","故该机构常用于压力机、冲床等设备上。"]]},{"id":"q073","no":73,"order":73,"chap":"c8","sec":"四杆机构演化形式","level":"普通","q":"曲柄滑块机构与导杆机构在构成上有何异同？","a":"曲柄滑块机构和曲柄导杆机构均属于含一个移动副的四杆运动链。\n同一运动链选取不同构件为机架，可以倒置演化为不同机构；改取曲柄滑块机构的曲柄为机架，即得到相应的回转导杆机构。\n故两者运动链相同，固定构件不同。","exp":"解题思路：本题属于平面连杆机构基础对比题，核心方法是先明确两类机构的演化同源性（均由铰链四杆机构演化而来，导杆机构是曲柄滑块机构的机架变换产物），从构成要素（构件、运动副、自由度）、运动特性两个维度逐一梳理相同点和不同点，避免遗漏关键对比项。\n知识体系：两类机构同属平面低副四杆机构演化分支，演化逻辑为：铰链四杆机构→通过移动副替换1个转动副得到曲柄滑块机构→对曲柄滑块机构进行机架变换得到导杆机构。\n易错分析：答题时易笼统表述两类机构的急回特性，需注意：仅对心曲柄滑块机构无急回，偏置曲柄滑块有急回；仅摆动导杆机构有急回，转动导杆机构无急回，不能一概而论。","fig":null,"page":null,"pts":[["共同点","曲柄滑块机构和曲柄导杆机构均属于含一个移动副的四杆运动链。"],["不同点","同一运动链选取不同构件为机架，可以倒置演化为不同机构；改取曲柄滑块机构的曲柄为机架，即得到相应的回转导杆机构。故两者运动链相同，固定构件不同。"]]},{"id":"q074","no":74,"order":74,"chap":"c8","sec":"急回特性与极位夹角","level":"普通","q":"试述摆动导杆机构的运动特点。","a":"曲柄作整周转动，导杆作往复摆动。\n当曲柄两次转到与导杆垂直时，导杆处于两侧极位；由于极位夹角θ≠0，故具有急回特性。\n忽略摩擦时，滑块传给导杆的作用力垂直于导杆，与导杆受力点的瞬时速度方向一致，所以以曲柄为主动件时，压力角为0°、传动角为90°，传力性能好。\n此时不会因传动角为零而出现死点。","exp":"","fig":null,"page":null,"pts":[["运动形式","曲柄作整周转动，导杆作往复摆动。"],["急回特性","当曲柄两次转到与导杆垂直时，导杆处于两侧极位；由于极位夹角θ≠0，故具有急回特性。"],["传力性能","忽略摩擦时，滑块传给导杆的作用力垂直于导杆，与导杆受力点的瞬时速度方向一致，所以以曲柄为主动件时，压力角为0°、传动角为90°，传力性能好。此时不会因传动角为零而出现死点。"]]},{"id":"q075","no":75,"order":75,"chap":"c8","sec":"四杆机构演化形式","level":"普通","q":"试述转动导杆机构的运动特点。","a":"转动导杆机构是曲柄滑块机构改取曲柄为机架的演化形式，通常取构件3为主动件，构件3和导杆1均能相对于机架整周转动，可用于回转式油泵。\n以非退化情形l3>l2考察图5-26(a)：曲柄匀速转一周，导杆同向转一周，但导杆角速度随位置周期变化；滑块沿导杆来回滑动。\n导杆本身作整周转动，故不存在摆动导杆那样的往复急回。\n曲柄主动、忽略摩擦等影响时，作用于导杆的力和导杆受力点速度均垂直于导杆，因此压力角为零，传动角为90°，传力性能好。","exp":"","fig":null,"page":null,"pts":[["构成与用途","转动导杆机构是曲柄滑块机构改取曲柄为机架的演化形式，通常取构件3为主动件，构件3和导杆1均能相对于机架整周转动，可用于回转式油泵。"],["角速度变化","曲柄匀速转一周，导杆同向转一周，但导杆角速度随位置周期变化；滑块沿导杆来回滑动。"],["无急回","导杆本身作整周转动，故不存在摆动导杆那样的往复急回。"],["传力性能","曲柄主动、忽略摩擦等影响时，作用于导杆的力和导杆受力点速度均垂直于导杆，因此压力角为零，传动角为90°，传力性能好。"]]},{"id":"q076","no":76,"order":76,"chap":"c8","sec":"铰链四杆机构类型判断","level":"普通","q":"铰链四杆机构中曲柄存在的条件是什么？曲柄是否一定是最短杆？","a":"铰链四杆机构中曲柄存在的条件：各杆长度应满足杆长条件；其最短杆为连架杆或机架。\n杆长条件为l_min+l_max≤l_i+l_j。\n当最短杆为机架时，则得双曲柄机构，所以曲柄不一定是最短杆。","exp":"解题思路：本题核心是掌握铰链四杆机构曲柄存在的两个充要条件，结合不同机架选择对应的机构类型，分析曲柄与最短杆的对应关系。\n知识体系：铰链四杆机构的类型由杆长条件和机架选择共同决定：若不满足杆长条件：无论选哪根杆为机架，均为双摇杆机构，不存在曲柄；若满足杆长条件：1.选最短杆的相邻杆为机架：得到曲柄摇杆机构，曲柄为最短杆；2.选最短杆为机架：得到双曲柄机构，两个连架杆均为曲柄，长度均大于最短杆；3.选最短杆的对边杆为机架：得到双摇杆机构，不存在曲柄。","fig":null,"page":null,"pts":[["存在条件","",[["铰链四杆机构中曲柄存在的条件","各杆长度应满足杆长条件；其最短杆为连架杆或机架。"],["杆长条件","l_min+l_max≤l_i+l_j。"]]],["曲柄不一定是最短杆","当最短杆为机架时，则得双曲柄机构，所以曲柄不一定是最短杆。"]]},{"id":"q077","no":77,"order":77,"chap":"c8","sec":"铰链四杆机构类型判断","level":"普通","q":"铰链四杆机构有哪几种基本类型？如何根据杆长判断其类型？","a":"基本类型为曲柄摇杆机构、双曲柄机构和双摇杆机构。\n杆长条件为l_min+l_max≤l_i+l_j。\n满足杆长条件时，最短杆为连架杆得曲柄摇杆机构，最短杆为机架得双曲柄机构，最短杆为连杆得双摇杆机构；不满足杆长条件时，无论取哪个构件为机架都为双摇杆机构。\n另须满足封闭运动链的装配条件：最长杆长度小于其余三杆长度之和。","exp":"","fig":null,"page":null,"pts":[["基本类型","曲柄摇杆机构、双曲柄机构和双摇杆机构。"],["如何判断","",[["杆长条件","l_min+l_max≤l_i+l_j。"],["类型判别","满足杆长条件时，最短杆为连架杆得曲柄摇杆机构，最短杆为机架得双曲柄机构，最短杆为连杆得双摇杆机构；不满足杆长条件时，无论取哪个构件为机架都为双摇杆机构。"],["装配条件","最长杆长度小于其余三杆长度之和。"]]]]},{"id":"q078","no":78,"order":78,"chap":"c8","sec":"铰链四杆机构类型判断","level":"普通","q":"铰链四杆机构、偏置滑块机构和导杆机构各存在曲柄的条件是什么？","a":"(1）铰链四杆机构：最短杆与最长杆的长度之和必须小于或等于另外两杆的长度之和；同时应取最短杆或其相邻杆为机架。前者得到双曲柄机构，后者得到曲柄摇杆机构。\n(2）偏置滑块机构：设曲柄长为l1、连杆长为l2、偏距大小为e，条件为l2−l1>e。因为曲柄与连杆重叠共线时，两端铰链的距离为l2一l₁，必须大于偏距。\n(3）导杆机构：对普通无偏置、非退化导杆机构，只要滑块能沿导杆作所需滑动，无论主动连架杆与机架的长度关系如何，主动连架杆均可整周转动，机构存在曲柄。","exp":"","fig":null,"page":null,"pts":[["铰链四杆机构","最短杆与最长杆的长度之和必须小于或等于另外两杆的长度之和；同时应取最短杆或其相邻杆为机架。前者得到双曲柄机构，后者得到曲柄摇杆机构。"],["偏置滑块机构","设曲柄长为l1、连杆长为l2、偏距大小为e，条件为l2−l1>e。因为曲柄与连杆重叠共线时，两端铰链的距离为l2一l₁，必须大于偏距。"],["导杆机构","对普通无偏置、非退化导杆机构，只要滑块能沿导杆作所需滑动，无论主动连架杆与机架的长度关系如何，主动连架杆均可整周转动，机构存在曲柄。"]]},{"id":"q079","no":79,"order":79,"chap":"c8","sec":"急回特性与极位夹角/死点位置分析","level":"普通","q":"曲柄滑块机构是否具有急回特性？在什么情况下出现死点位置？","a":"对心曲柄滑块机构由于极位夹角θ=0°、K=1，故无急回特性；偏置曲柄滑块机构因θ≠0°，故有急回特性。\n当以滑块为主动件时，若连杆与从动曲柄共线，机构处于死点位置，此时传动角为零。","exp":"核心机理：急回取决于往返行程对应的曲柄转角是否相等，且通常以曲柄匀速为前提。死点则取决于主从身份：滑块主动、从动曲柄与连杆共线时，连杆力对曲柄轴心的力矩为零。","fig":null,"page":null,"pts":[["急回特性","对心曲柄滑块机构由于极位夹角θ=0°、K=1，故无急回特性；偏置曲柄滑块机构因θ≠0°，故有急回特性。"],["死点位置","当以滑块为主动件时，若连杆与从动曲柄共线，机构处于死点位置，此时传动角为零。"]]},{"id":"q080","no":80,"order":80,"chap":"c8","sec":"急回特性与极位夹角","level":"普通","q":"什么叫极位夹角、急回特性？极位夹角与急回特性（行程速比系数K）有何关系？","a":"在曲柄驱动、从动件每周期往复一次的连杆机构中，设从动件往、返两行程对应的曲柄转角为φ_1、φ_2(φ_1≥φ_2，φ_1+φ_2=360°)，极位夹角为θ=(φ_1-φ_2)/2，不能一概称为曲柄两位置所夹的锐角。曲柄等速转动时，从动件往、返行程的平均速度大小一慢一快，具有急回特性。行程速比系数K=φ_1/φ_2=(180°+θ)/(180°-θ)；θ越大，K越大，急回特性越显著；θ=0时K=1，无急回特性。上述概念及关系也适用于偏置曲柄滑块、摆动导杆等机构。凸轮机构也可实现慢进快回，但通常用推程、回程运动角分析，不能直接套用上述极位夹角关系。","exp":"","fig":null,"page":null,"pts":[["极位夹角","在曲柄驱动、从动件每周期往复一次的连杆机构中，设从动件往、返两行程对应的曲柄转角为φ_1、φ_2(φ_1≥φ_2，φ_1+φ_2=360°)，极位夹角为θ=(φ_1-φ_2)/2，不能一概称为曲柄两位置所夹的锐角。"],["急回特性","曲柄等速转动时，从动件往、返行程的平均速度大小一慢一快，具有急回特性。"],["行程速比系数K","φ_1/φ_2=(180°+θ)/(180°-θ)；θ越大，K越大，急回特性越显著；θ=0时K=1，无急回特性。"],["适用范围","上述概念及关系也适用于偏置曲柄滑块、摆动导杆等机构。凸轮机构也可实现慢进快回，但通常用推程、回程运动角分析，不能直接套用上述极位夹角关系。"]]},{"id":"q081","no":81,"order":81,"chap":"c8","sec":"压力角与传动角分析","level":"普通","q":"在曲柄摇杆机构中，为何要限制最小传动角的大小？最小传动角出现的位置在哪里？","a":"传动角愈大，对机构的传力愈有利。\n为了保证机构传力性能良好，应使γ_min≥40°～50°。\n对于曲柄摇杆机构，最小传动角出现在主动曲柄与机架共线的两位置之一，两位置传动角中的小者即为最小传动角。","exp":"","fig":null,"page":null,"pts":[["为什么要限制最小传动角","",[["传动角与传力","传动角愈大，对机构的传力愈有利。"],["许用值","为了保证机构传力性能良好，应使γ_min≥40°～50°。"]]],["最小传动角出现的位置","对于曲柄摇杆机构，最小传动角出现在主动曲柄与机架共线的两位置之一，两位置传动角中的小者即为最小传动角。"]]},{"id":"q082","no":82,"order":82,"chap":"c8","sec":"压力角与传动角分析","level":"普通","q":"何谓机构的压力角？其值对机构的效率有何影响？","a":"不考虑各运动副中的摩擦力、构件重力和惯性力的影响，作用力与从动件受力点速度正向之间的夹角α称为压力角。\n压力角与传动角互为余角，传动角愈大，对机构的传力愈有利。\n为了提高机构的效率、改善其受力情况，应限制最大压力角。","exp":"","fig":null,"page":null,"pts":[["定义","不考虑各运动副中的摩擦力、构件重力和惯性力的影响，作用力与从动件受力点速度正向之间的夹角α称为压力角。"],["与传动角的关系","压力角与传动角互为余角，传动角愈大，对机构的传力愈有利。"],["限制原因","为了提高机构的效率、改善其受力情况，应限制最大压力角。"]]},{"id":"q083","no":83,"order":83,"chap":"c8","sec":"压力角与传动角分析","level":"普通","q":"以曲柄为原动件的偏置曲柄滑块机构的最小传动角发生在什么位置？","a":"最小传动角出现在曲柄与机架AD∞共线的两位置之一。\n由于移动副等效转动中心位于垂直于导路的无穷远处，这就是曲柄垂直于滑块导路的两个位置中传动角较小的一个，即曲柄活动铰链距导路较远的位置。","exp":"以曲柄为原动件时，本机构的传动角是连杆与滑块导路法线之间的锐角，与压力角互余。连杆与导路的夹角越大，传动角越小。曲柄垂直于导路，且曲柄活动铰链距导路最远时，连杆与导路的夹角最大，因此传动角最小。\n知识体系：常见平面四杆机构最小传动角位置对比：机构类型原动件最小传动角位置曲柄摇杆机构曲柄曲柄与机架共线的两个位置中传动角更小的位置对心曲柄滑块机构曲柄曲柄与滑块导路垂直的两个位置偏置曲柄滑块机构曲柄曲柄与滑块导路垂直，且曲柄活动铰链距导路最远的位置。","fig":null,"page":null,"pts":[["位置","最小传动角出现在曲柄与机架AD∞共线的两位置之一。"],["说明","由于移动副等效转动中心位于垂直于导路的无穷远处，这就是曲柄垂直于滑块导路的两个位置中传动角较小的一个，即曲柄活动铰链距导路较远的位置。"]]},{"id":"q084","no":84,"order":84,"chap":"c8","sec":"死点位置分析","level":"普通","q":"曲柄摇杆机构以曲柄为原动件是不是一定不存在死点，为什么？","a":"一定不存在死点。曲柄摇杆机构以曲柄为原动件时，能通过连杆驱动摇杆运动；以摇杆为原动件时，当连杆与从动曲柄共线，连杆作用力通过曲柄的固定铰链中心，不能产生驱动曲柄的力矩，才出现死点。","exp":"","fig":null,"page":null,"pts":[["一定不存在死点","曲柄摇杆机构以曲柄为原动件时，能通过连杆驱动摇杆运动。"],["理由","以摇杆为原动件时，当连杆与从动曲柄共线，连杆作用力通过曲柄的固定铰链中心，不能产生驱动曲柄的力矩，才出现死点。"]]},{"id":"q085","no":85,"order":85,"chap":"c8","sec":"死点位置分析","level":"普通","q":"什么是连杆机构的死点？举出死点的应用和克服死点的例子。","a":"摇杆主动的曲柄摇杆机构中，连杆与从动曲柄共线时，传动角γ=0°，作用于曲柄的力通过其回转中心而顶死，该位置称为死点。\n飞机起落架和折叠桌桌腿机构可利用死点防止折回。\n机车车轮联动机构使两侧曲柄错开90°；脚踏磨轮机构借磨轮惯性闯过死点。","exp":"是否为死点与机构位置及主动件选择都有关。同一曲柄摇杆机构改以曲柄主动时，不能仍把原来摇杆主动时的死点结论直接套用。\n“不能驱动”指该位置的传力条件，不代表有惯性的机构绝不可能经过这个位置。应用题应分清利用与克服：夹具利用死点防止反向运动，缝纫机踏板则借惯性越过死点，不能把两者都列成同一种用途。","fig":null,"page":null,"pts":[["死点","摇杆主动的曲柄摇杆机构中，连杆与从动曲柄共线时，传动角γ=0°，作用于曲柄的力通过其回转中心而顶死，该位置称为死点。"],["利用死点","飞机起落架和折叠桌桌腿机构可利用死点防止折回。"],["克服死点","机车车轮联动机构使两侧曲柄错开90°；脚踏磨轮机构借磨轮惯性闯过死点。"]]},{"id":"q086","no":86,"order":86,"chap":"c8","sec":"死点位置分析","level":"普通","q":"机构的死点位置与压力角有何关系？","a":"死点位置时机构的传动角γ=0°，因而压力角α=90°。\n当连杆与从动曲柄共线时，主动件通过连杆作用于从动件上的力恰好通过其回转中心，出现不能使从动件转动的“顶死”现象。","exp":"","fig":null,"page":null,"pts":[["关系","死点位置时机构的传动角γ=0°，因而压力角α=90°。"],["原因","当连杆与从动曲柄共线时，主动件通过连杆作用于从动件上的力恰好通过其回转中心，出现不能使从动件转动的“顶死”现象。"]]},{"id":"q087","no":87,"order":87,"chap":"c8","sec":"死点位置分析","level":"普通","q":"极位和死点有何异同？什么是机构的转折点，它与死点有何区别？","a":"以曲柄摇杆机构为例，曲柄为主动件时，曲柄与连杆共线，摇杆处于两极限位置，机构的这两个位置称为极位；改以摇杆为主动件时，同一位置上的从动曲柄与连杆共线，传动角为零，连杆力通过曲柄回转中心，出现\"顶死\"，称为死点。因此，极位和死点可以是机构的同一位置，所不同的仅是主动件不同：当主动件与连杆共线时为极位；当从动件与连杆共线时为死点。机构可能出现相反运动变化、运动不确定的位置，称为转折点或运动的变换点。例如，平行四边形机构在四杆共线时可能转为反平行四边形机构。死点强调从动件不能被驱动力推动；转折点强调运动方向或运动分支不确定。教材指出，机构离开死点继续运动时，既可能正转也可能反转，故死点位置也是机构运动的转折点。","exp":"","fig":null,"page":null,"pts":[["极位与死点","",[["定义","以曲柄摇杆机构为例，曲柄为主动件时，曲柄与连杆共线，摇杆处于两极限位置，机构的这两个位置称为极位；改以摇杆为主动件时，同一位置上的从动曲柄与连杆共线，传动角为零，连杆力通过曲柄回转中心，出现\"顶死\"，称为死点。"],["可以是同一位置","因此，极位和死点可以是机构的同一位置，所不同的仅是主动件不同：当主动件与连杆共线时为极位；当从动件与连杆共线时为死点。"]]],["转折点","",[["定义","机构可能出现相反运动变化、运动不确定的位置，称为转折点或运动的变换点。例如，平行四边形机构在四杆共线时可能转为反平行四边形机构。"],["与死点的区别","死点强调从动件不能被驱动力推动；转折点强调运动方向或运动分支不确定。"],["死点也是转折点","教材指出，机构离开死点继续运动时，既可能正转也可能反转，故死点位置也是机构运动的转折点。"]]]]},{"id":"q088","no":88,"order":88,"chap":"c9","sec":"凸轮机构分类","level":"普通","q":"凸轮和从动件维持高副接触（锁合的方式）有哪些？各自是如何维持高副接触的？","a":"(1）力封闭凸轮机构。它利用推杆的重力、弹簧力来使推杆与凸轮保持接触。\n(2）几何封闭的凸轮机构。它利用凸轮或推杆的特殊几何结构使凸轮与推杆保持接触。","exp":"","fig":null,"page":null,"pts":[["力封闭","它利用推杆的重力、弹簧力来使推杆与凸轮保持接触。"],["几何封闭","它利用凸轮或推杆的特殊几何结构使凸轮与推杆保持接触。"]]},{"id":"q089","no":89,"order":89,"chap":"c9","sec":"凸轮机构分类","level":"普通","q":"凸轮机构的从动件有哪几种型式？","a":"有尖顶推杆、滚子推杆和平底推杆。","exp":"","fig":null,"page":null,"pts":[["从动件型式","有尖顶推杆、滚子推杆和平底推杆。"]]},{"id":"q090","no":90,"order":90,"chap":"c9","sec":"凸轮机构分类","level":"普通","q":"凸轮机构中采用滚子从动件，有什么利弊？","a":"滚子与凸轮轮廓之间为滚动摩擦，所以磨损较小，可用来传递较大的动力。\n滚子半径选择不当，会使外凸工作廓线发生变尖或失真；滚子尺寸还受强度、结构的限制，不能做得太小。","exp":"","fig":null,"page":null,"pts":[["优点","滚子与凸轮轮廓之间为滚动摩擦，所以磨损较小，可用来传递较大的动力。"],["缺点","滚子半径选择不当，会使外凸工作廓线发生变尖或失真；滚子尺寸还受强度、结构的限制，不能做得太小。"]]},{"id":"q091","no":91,"order":91,"chap":"c9","sec":"凸轮机构分类","level":"普通","q":"简述凸轮机构的优缺点","a":"优点：正确设计凸轮轮廓曲线，便能实现从动件复杂的预期运动规律，结构简单、紧凑、设计方便。缺点：凸轮和从动件为高副接触，容易磨损并影响运动精度，凸轮轮廓加工较困难。因此常用于有特殊运动规律要求而传力不大的场合。","exp":"解题思路：本题为记忆性简答题，应从凸轮机构的\"运动实现能力\"与\"接触形式\"两个本质特征切入。凸轮机构的核心价值在于运动设计的灵活性，而其局限性则源于高副接触的固有特点，两者构成优缺点的内在逻辑。\n知识体系：凸轮机构属于高副机构，由凸轮、从动件、机架三个基本构件及锁合装置组成。其优缺点可对比理解：方面优点缺点运动实只需设计轮廓曲线即可实现各种预定运动现规律结构结构简单、紧凑，运动可靠接触形点/线接触，接触应力大，易磨式损适用场广泛用于机械、仪器、操纵控制装置只能用于传力不大的场合。","fig":null,"page":null,"pts":[["优点","正确设计凸轮轮廓曲线，便能实现从动件复杂的预期运动规律，结构简单、紧凑、设计方便。"],["缺点","凸轮和从动件为高副接触，容易磨损并影响运动精度，凸轮轮廓加工较困难。"],["适用场合","因此常用于有特殊运动规律要求而传力不大的场合。"]]},{"id":"q092","no":92,"order":92,"chap":"c9","sec":"推杆运动规律与冲击类型","level":"普通","q":"凸轮机构中，从动件的常用运动规律有哪几种？它们各有什么特点？","a":"(1）等速运动：始末速度突变，理论上加速度无穷大，有刚性冲击。\n(2）等加速等减速运动：始、中、末加速度有限突变，有柔性冲击。\n(3）五次多项式运动：无刚性和柔性冲击。\n(4）余弦加速度（简谐）运动：首末加速度突变，有柔性而无刚性冲击；适当用于升一回型可避免柔性冲击。\n(5）正弦加速度（摆线）运动：无刚性和柔性冲击。","exp":"常用规律包括等速、等加速等减速、余弦加速度、正弦加速度以及五次多项式运动规律。以下按凸轮等角速度转动、运动段与休止段相接的常见条件比较。\n运动规律运动特征与冲击般应用特点等速运动段内速度恒定；与休止段相接时速度突低速、轻载；必要时修变，产生刚性冲击正端部运动规律等加速等减前半程等加速，后半程等减速；起点、中间速转换点和终点加速度有有限突变，产生柔性适于中速场合冲击余弦加速加速度按半周期余弦变化；与休止段相接时有上述冲击时适干中速度，即简谐端点加速度有限突变，有柔性冲击场合运动。","fig":null,"page":null,"pts":[["等速运动","始末速度突变，理论上加速度无穷大，有刚性冲击。"],["等加速等减速运动","始、中、末加速度有限突变，有柔性冲击。"],["五次多项式运动","无刚性和柔性冲击。"],["余弦加速度（简谐）运动","首末加速度突变，有柔性而无刚性冲击；适当用于升一回型可避免柔性冲击。"],["正弦加速度（摆线）运动","无刚性和柔性冲击。"]]},{"id":"q093","no":93,"order":93,"chap":"c9","sec":"反转法原理与轮廓设计基础","level":"普通","q":"在直动从动件盘形凸轮机构中，试问同一凸轮采用不同端部形状的从动件时，其从动件运动规律是否相同？为什么？","a":"一般不相同。\n滚子中心在推杆复合运动中的轨迹称为凸轮的理论廓线，滚子圆族的包络线为工作廓线；平底推杆则以平底直线族的包络线为工作廓线。\n因此，同一工作廓线配用不同端部形状，其推杆运动规律一般不同。","exp":"","fig":null,"page":null,"pts":[["结论","一般不相同。"],["为什么","",[["理论廓线与工作廓线","滚子中心在推杆复合运动中的轨迹称为凸轮的理论廓线，滚子圆族的包络线为工作廓线；平底推杆则以平底直线族的包络线为工作廓线。"],["原因","因此，同一工作廓线配用不同端部形状，其推杆运动规律一般不同。"]]]]},{"id":"q094","no":94,"order":94,"chap":"c9","sec":"推杆运动规律与冲击类型","level":"普通","q":"欲设计一凸轮机构，要求从动推杆在工作行程等速运动，但在运动始末不希望出现刚性冲击，该如何选择运动规律？","a":"将等速运动规律适当地加以修正，把推杆的等速运动规律在其行程两端与正弦加速度运动规律组合起来，以获得性能较好的组合运动规律。\n要保证各段在衔接点上的运动参数（位移、速度、加速度等）的连续性，并在运动的起始和终止处满足边界条件。","exp":"","fig":null,"page":null,"pts":[["修正方法","将等速运动规律适当地加以修正，把推杆的等速运动规律在其行程两端与正弦加速度运动规律组合起来，以获得性能较好的组合运动规律。"],["衔接要点","要保证各段在衔接点上的运动参数（位移、速度、加速度等）的连续性，并在运动的起始和终止处满足边界条件。"]]},{"id":"q095","no":95,"order":95,"chap":"c9","sec":"滚子直动从动件凸轮设计","level":"普通","q":"如果两个凸轮的理论廓线相同，则从动件的运动规律是否一定相同？为什么？","a":"不一定。按反转法，凸轮不动，而从动件一方面随机架和导路以一ω绕凸轮轴轴心转动，另一方面又在导路中往复移动。其位移要沿反转后导路的位置，从基圆开始量取。滚子从动件则把滚子中心看作尖顶，其轨迹为理论轮廓。因此，从动件的运动规律还与其导路位置（如偏距）、运动形式以及凸轮转向等有关。例如，同一理论轮廓配以不同偏距的直动从动件，反转后的导路不同，所截取的位移一般也不同。仅有理论轮廓相同，不能保证运动规律一定相同。","exp":"解题思路：首先明确理论廓线的定义和运动规律的本质，运动规律是从动件位移与凸轮转角的函数关系，再从几何关系和运动匹配两个维度分析除理论廓线外的影响因素。\n知识体系：理论廓线是从动件参考点（尖顶顶点、滚子中心、平底与导路垂线交点）在凸轮固定坐标系中的运动轨迹；运动规律的核心是位移与凸轮转角的对应关系，除理论廓线外，偏置量会改变位移的几何计算公式，凸轮转向会改变转角与廓线位置的对应关系，二者都会影响运动规律。\n易错分析：常见误区是认为理论廓线与运动规律一一对应，忽略偏置量和凸轮转向的影响；注意不要将间隙、摩擦、安装误差等非设计因素计入运动规律的决定因素，运动规律是理想设计阶段由几何参数确定的。","fig":null,"page":null,"pts":[["结论","不一定。"],["为什么","",[["原因","按反转法，凸轮不动，而从动件一方面随机架和导路以一ω绕凸轮轴轴心转动，另一方面又在导路中往复移动。其位移要沿反转后导路的位置，从基圆开始量取。滚子从动件则把滚子中心看作尖顶，其轨迹为理论轮廓。"],["取决于哪些因素","因此，从动件的运动规律还与其导路位置（如偏距）、运动形式以及凸轮转向等有关。"],["举例","例如，同一理论轮廓配以不同偏距的直动从动件，反转后的导路不同，所截取的位移一般也不同。"]]],["小结","仅有理论轮廓相同，不能保证运动规律一定相同。"]]},{"id":"q096","no":96,"order":96,"chap":"c9","sec":"推杆运动规律与冲击类型","level":"普通","q":"发生刚性冲击的凸轮机构，其运动线图上有什么特征？如发生柔性冲击时又有什么特征？","a":"刚性冲击的特征是速度有突变，理论上出现无穷大的加速度和惯性力。\n柔性冲击的特征是加速度出现有限值突变，例如等加速等减速运动规律的始、中、末点，因而冲击较小。","exp":"","fig":null,"page":null,"pts":[["刚性冲击","特征是速度有突变，理论上出现无穷大的加速度和惯性力。"],["柔性冲击","特征是加速度出现有限值突变，例如等加速等减速运动规律的始、中、末点，因而冲击较小。"]]},{"id":"q097","no":97,"order":97,"chap":"c9","sec":"推杆运动规律与冲击类型","level":"普通","q":"凸轮机构从动件的运动一般分为哪几个阶段？什么是推程运动角？","a":"一般为推程、远休止、回程、近休止四个阶段，也可具有”单停”或”无停”的运动形式。\n推杆由最低位置被推到最高位置的过程称为推程，相应的凸轮转角称为推程运动角。","exp":"","fig":null,"page":null,"pts":[["四个阶段","一般为推程、远休止、回程、近休止四个阶段，也可具有”单停”或”无停”的运动形式。"],["推程运动角","推杆由最低位置被推到最高位置的过程称为推程，相应的凸轮转角称为推程运动角。"]]},{"id":"q098","no":98,"order":98,"chap":"c9","sec":"推杆运动规律与冲击类型","level":"普通","q":"凸轮机构推杆运动规律的选择原则是什么？","a":"首先需满足机器的工作要求，同时使凸轮机构具有良好的动力特性，使所设计的凸轮便于加工。\n比较运动规律时，应注意最大速度、最大加速度和最大跃度：最大速度很大会影响停止或反向运动，造成推杆与凸轮碰撞或脱离；最大加速度很大会使动负荷较大；最大跃度大则易激发振动与噪声。","exp":"","fig":null,"page":null,"pts":[["选择原则","首先需满足机器的工作要求，同时使凸轮机构具有良好的动力特性，使所设计的凸轮便于加工。"],["比较时注意","比较运动规律时，应注意最大速度、最大加速度和最大跃度：最大速度很大会影响停止或反向运动，造成推杆与凸轮碰撞或脱离；最大加速度很大会使动负荷较大；最大跃度大则易激发振动与噪声。"]]},{"id":"q099","no":99,"order":99,"chap":"c9","sec":"滚子直动从动件凸轮设计","level":"普通","q":"在移动滚子从动件盘形凸轮机构中，若凸轮实际廓线保持不变，而增大或减小滚子半径，从动件运动规律是否发生变化？","a":"一般会变化。\n滚子中心在推杆复合运动中的轨迹称为凸轮理论廓线；以理论廓线上的点为圆心、滚子半径为半径作圆族，其包络线为工作廓线。\n因此，在工作廓线保持不变时改变滚子半径，一般会改变滚子中心的轨迹，从而改变推杆的运动规律。","exp":"","fig":null,"page":null,"pts":[["结论","一般会变化。"],["为什么","",[["理论廓线与工作廓线","滚子中心在推杆复合运动中的轨迹称为凸轮理论廓线；以理论廓线上的点为圆心、滚子半径为半径作圆族，其包络线为工作廓线。"],["原因","因此，在工作廓线保持不变时改变滚子半径，一般会改变滚子中心的轨迹，从而改变推杆的运动规律。"]]]]},{"id":"q100","no":100,"order":100,"chap":"c9","sec":"尖底直动从动件凸轮设计","level":"普通","q":"试述凸轮轮廓设计的“反转法”原理。","a":"给整个机构加上绕轴心O的公共角速度一ω，凸轮与推杆相对运动不变，凸轮静止，推杆随导轨反转又在导轨内作预期往复移动，其尖顶轨迹即为凸轮轮廓。\n基本方法有作图法和解析法；作图时将反转中尖顶各位置连成平滑曲线，滚子或平底推杆再用包络法确定廓线。","exp":"","fig":null,"page":null,"pts":[["反转法原理","给整个机构加上绕轴心O的公共角速度一ω，凸轮与推杆相对运动不变，凸轮静止，推杆随导轨反转又在导轨内作预期往复移动，其尖顶轨迹即为凸轮轮廓。"],["作图与解析","基本方法有作图法和解析法；作图时将反转中尖顶各位置连成平滑曲线，滚子或平底推杆再用包络法确定廓线。"]]},{"id":"q101","no":101,"order":101,"chap":"c9","sec":"尖底直动从动件凸轮设计","level":"普通","q":"若给定推杆运动规律，凸轮轮廓是否唯一？为什么？","a":"不唯一。教材设计滚子推杆凸轮廓线时，除推杆运动规律外，还给定基圆半径、推杆偏距、滚子半径和凸轮角速度方向。先按反转法求理论廓线，再以理论廓线上的点为圆心、滚子半径为半径作圆族，取其包络线为工作廓线。因此，仅给定运动规律尚不足以确定轮廓；例如保持理论廓线而改变滚子半径，就会得到不同工作廓线。","exp":"","fig":null,"page":null,"pts":[["结论","不唯一。"],["为什么","",[["还需给定的参数","教材设计滚子推杆凸轮廓线时，除推杆运动规律外，还给定基圆半径、推杆偏距、滚子半径和凸轮角速度方向。"],["设计过程","先按反转法求理论廓线，再以理论廓线上的点为圆心、滚子半径为半径作圆族，取其包络线为工作廓线。"],["说明","因此，仅给定运动规律尚不足以确定轮廓；例如保持理论廓线而改变滚子半径，就会得到不同工作廓线。"]]]]},{"id":"q102","no":102,"order":102,"chap":"c9","sec":"尖底与滚子直动从动件凸轮作图题","level":"普通","q":"什么是凸轮实际轮廓的变尖现象和从动件（推杆）运动的失真现象？它对凸轮机构的工作有何影响？如何加以避免？","a":"对外凸轮廓，工作廓线曲率半径ρ_a=ρ−r_r。若ρ=r_r，工作廓线曲率半径为零，出现尖点，称为变尖现象；尖点处很容易磨损。若ρ<r_r，工作廓线曲率半径为负值，廓线出现交叉，交叉部分制造时被切去，致使推杆不能按预期运动规律运动，称为失真现象。应使滚子半径小于理论廓线的最小曲率半径。工作廓线最小曲率半径一般不应小于1～5mm；不满足时，应增大基圆半径或适当减小滚子半径，有时须修改推杆运动规律，将出现尖点的地方代以合适曲线。滚子还受强度、结构限制，不能做得太小。","exp":"解题思路：本题围绕滚子从动件凸轮机构的轮廓设计约束展开，核心依据是实际轮廓曲率半径与理论轮廓曲率半径、滚子半径的关系ρ_a=ρ−r_r，需依次明确两类失效现象的定义、危害，再从设计参数选择角度推导避免措施。知识体系：该知识点属于凸轮机构轮廓曲线设计的核心约束，不同曲率对应状态如下：实际轮廓曲率半径ρα现象可用性。","fig":null,"page":null,"pts":[["变尖现象","对外凸轮廓，工作廓线曲率半径ρ_a=ρ−r_r。若ρ=r_r，工作廓线曲率半径为零，出现尖点，称为变尖现象；尖点处很容易磨损。"],["失真现象","若ρ<r_r，工作廓线曲率半径为负值，廓线出现交叉，交叉部分制造时被切去，致使推杆不能按预期运动规律运动，称为失真现象。"],["如何避免","",[["避免原则","应使滚子半径小于理论廓线的最小曲率半径。"],["具体措施","工作廓线最小曲率半径一般不应小于1～5mm；不满足时，应增大基圆半径或适当减小滚子半径，有时须修改推杆运动规律，将出现尖点的地方代以合适曲线。"],["滚子尺寸限制","滚子还受强度、结构限制，不能做得太小。"]]]]},{"id":"q103","no":103,"order":103,"chap":"c9","sec":"滚子直动从动件凸轮设计","level":"普通","q":"什么是凸轮的理论廓线和实际廓线？","a":"将滚子中心视为尖顶，确定滚子中心在推杆复合运动中的轨迹，称此轨迹为凸轮的理论廓线。\n以理论廓线上一系列点为圆心，以滚子半径为半径作一系列圆，此圆族的包络线即为凸轮的工作廓线，又称实际廓线。","exp":"核心机理：理论廓线描述选定参考点在反转运动中的轨迹，实际廓线是凸轮与从动件直接接触的表面轮廓。滚子从动件须由滚子中心轨迹作滚子圆族包络，不能直接把中心轨迹当作加工轮廓。","fig":null,"page":null,"pts":[["理论廓线","将滚子中心视为尖顶，确定滚子中心在推杆复合运动中的轨迹，称此轨迹为凸轮的理论廓线。"],["工作廓线（实际廓线）","以理论廓线上一系列点为圆心，以滚子半径为半径作一系列圆，此圆族的包络线即为凸轮的工作廓线，又称实际廓线。"]]},{"id":"q104","no":104,"order":104,"chap":"c9","sec":"平底直动从动件凸轮作图题","level":"普通","q":"为什么平底直动从动件盘形凸轮机构的凸轮廓线一定要外凸？滚子直动从动件盘形凸轮机构的凸轮廓线却允许内凹？","a":"平底必须与凸轮工作廓线相切；内凹部分不能与平底相切接触，将使推杆不能按预期的运动规律运动，即出现失真。\n滚子推杆的内凹工作廓线曲率半径为ρ_a=ρ+r_r，工作廓线总是可以平滑地作出来。","exp":"平底是一直线工作面，其包络只能覆盖可相切的外凸轮廓；凹陷部分会被平底跨过，无法实现预期接触。滚子可进入凹形轮廓，内凹段的实际曲率半径为理论曲率半径加滚子半径。外凸段则是相减，仍须检查滚子过大造成的尖点或失真，不能把内凹段结论推广到整个轮廓。","fig":null,"page":null,"pts":[["平底从动件","平底必须与凸轮工作廓线相切；内凹部分不能与平底相切接触，将使推杆不能按预期的运动规律运动，即出现失真。"],["滚子从动件","滚子推杆的内凹工作廓线曲率半径为ρ_a=ρ+r_r，工作廓线总是可以平滑地作出来。"]]},{"id":"q105","no":105,"order":105,"chap":"c9","sec":"凸轮机构压力角/渐开线性质与啮合特点","level":"普通","q":"简要说明凸轮机构的压力角与齿轮的压力角在概念上的区别。","a":"凸轮机构压力角是推杆所受正压力的方向（沿凸轮廓线在接触点的法线方向）与推杆上该点的速度方向之间所夹的锐角。\n渐开线某点的压力角是齿廓在该点所受正压力方向与该点速度方向之间所夹的锐角；齿轮的标准压力角规定在分度圆上，是决定齿廓形状的主要参数。","exp":"","fig":null,"page":null,"pts":[["凸轮机构的压力角","凸轮机构压力角是推杆所受正压力的方向（沿凸轮廓线在接触点的法线方向）与推杆上该点的速度方向之间所夹的锐角。"],["齿轮的压力角","渐开线某点的压力角是齿廓在该点所受正压力方向与该点速度方向之间所夹的锐角；齿轮的标准压力角规定在分度圆上，是决定齿廓形状的主要参数。"]]},{"id":"q106","no":106,"order":106,"chap":"c9","sec":"直动从动件压力角计算","level":"普通","q":"设计直动推杆盘型凸轮机构时，在推杆运动规律不变的条件下，需减小推程的最大压力角，可采用那两种措施？","a":"(1）加大基圆半径，可减小压力角，改善传力特性。\n(2）选择合适的偏置方向和大小，使回程压力角适当增大而减小推程压力角。","exp":"","fig":null,"page":null,"pts":[["加大基圆半径","可减小压力角，改善传力特性。"],["选择偏置","选择合适的偏置方向和大小，使回程压力角适当增大而减小推程压力角。"]]},{"id":"q107","no":107,"order":107,"chap":"c9","sec":"凸轮机构压力角","level":"普通","q":"平底从动件盘状凸轮机构的压力角是否变化，此机构在传动时会不会发生自锁现象？","a":"平底从动件的压力角为常数：α=90°−γ，其中γ为平底与导路中心轴线的固定夹角。\n如平底与导路方向线之间的夹角γ=90°，则α=0。\n在通常平底垂直导路的情况下，压力角为零，推力不产生引起导路摩擦的侧向分力，因此不会发生由压力角过大引起的自锁。\n若平底倾斜，压力角虽然仍为常数，却不能据此断言不会自锁；当侧压力引起的摩擦阻力大于有效分力时，从动件不能运动，便发生自锁。","exp":"","fig":null,"page":null,"pts":[["压力角","α=90°−γ，其中γ为平底与导路中心轴线的固定夹角。"],["特例","如平底与导路方向线之间的夹角γ=90°，则α=0。"],["是否自锁","在通常平底垂直导路的情况下，压力角为零，推力不产生引起导路摩擦的侧向分力，因此不会发生由压力角过大引起的自锁。"],["平底倾斜时","若平底倾斜，压力角虽然仍为常数，却不能据此断言不会自锁；当侧压力引起的摩擦阻力大于有效分力时，从动件不能运动，便发生自锁。"]]},{"id":"q108","no":108,"order":108,"chap":"c9","sec":"凸轮基圆半径确定","level":"普通","q":"凸轮机构中，选择基圆半径时，应考虑哪些因素？原则是什么？","a":"基圆半径的选择需考虑实际的结构条件、压力角以及凸轮工作廓线是否会出现变尖和失真等。\n在偏距一定、推杆运动规律已知的条件下，加大基圆半径可减小压力角、改善传力特性，但机构尺寸将增大。\n因此应在满足最大压力角不超过许用值的条件下合理确定基圆半径，使尺寸不至过大。\n还应满足凸轮的结构和强度要求：与轴做成一体时，工作廓线基圆半径应略大于轴半径；分开制作时应略大于轮毂半径。\n若工作廓线曲率或平底推杆运动失真要求不能满足，可适当增大基圆半径。","exp":"选择基圆半径，首先要兼顾传力性能和机构尺寸。在从动件运动规律、偏距等条件一定时，增大基圆半径通常可减小压力角、改善传力性能，但会增大机构尺寸；基圆半径过小则可能使压力角过大。\n因此，应保证最大压力角满足α_max≤[α]，并同时考虑凸轮与轴等零件的安装空间、结构和强底西求还雨拾杰丁佐松廠旦不山现亦小或生直例加滚了半径应与松廠曲率坦活应。","fig":null,"page":null,"pts":[["要考虑的因素","",[["","基圆半径的选择需考虑实际的结构条件、压力角以及凸轮工作廓线是否会出现变尖和失真等。"],["基圆半径的影响","在偏距一定、推杆运动规律已知的条件下，加大基圆半径可减小压力角、改善传力特性，但机构尺寸将增大。"]]],["确定原则","",[["","因此应在满足最大压力角不超过许用值的条件下合理确定基圆半径，使尺寸不至过大。"],["结构要求","与轴做成一体时，工作廓线基圆半径应略大于轴半径；分开制作时应略大于轮毂半径。"],["失真要求","若工作廓线曲率或平底推杆运动失真要求不能满足，可适当增大基圆半径。"]]]]},{"id":"q109","no":109,"order":109,"chap":"c10","sec":"齿廓啮合基本定律","level":"普通","q":"对于齿轮定角速比传动，齿廓啮合基本定律怎样描述，为什么渐开线齿廓满足定角速比要求？","a":"不论两轮齿廓在何位置接触，过接触点所作的两齿廓公法线应与两齿轮的连心线交于一定点。\n渐开线齿廓在接触点处的公法线必同时与两轮的基圆相切，两轮的传动比为i_{12}=r_{b2}/r_{b1}。\n对于每一个具体齿轮来说，其基圆半径为常数，两轮基圆半径的比值为定值，故渐开线齿轮能保证定传动比传动。","exp":"","fig":null,"page":null,"pts":[["齿廓啮合基本定律","不论两轮齿廓在何位置接触，过接触点所作的两齿廓公法线应与两齿轮的连心线交于一定点。"],["渐开线齿廓的满足","渐开线齿廓在接触点处的公法线必同时与两轮的基圆相切，两轮的传动比为i_{12}=r_{b2}/r_{b1}。对于每一个具体齿轮来说，其基圆半径为常数，两轮基圆半径的比值为定值，故渐开线齿轮能保证定传动比传动。"]]},{"id":"q110","no":110,"order":110,"chap":"c10","sec":"渐开线性质与啮合特点","level":"普通","q":"渐开线上各点压力角是否相同？它的变化规律是怎么样的？平常讲的渐开线齿轮的的压力角指的是什么位置上的压力角？其值是多少？","a":"渐开线上各点压力角不同，其压力角的大小随r_K的增大而增大，而基圆上的压力角为零。\n通常所说的齿轮压力角是指在其分度圆上的压力角，以α表示。\n分度圆上的压力角为标准值，α=20°。","exp":"","fig":null,"page":null,"pts":[["各点压力角","渐开线上各点压力角不同，其压力角的大小随r_K的增大而增大，而基圆上的压力角为零。"],["所指位置","通常所说的齿轮压力角是指在其分度圆上的压力角，以α表示。分度圆上的压力角为标准值，α=20°。"]]},{"id":"q111","no":111,"order":111,"chap":"c10","sec":"渐开线性质与啮合特点","level":"普通","q":"从渐开线的形成过程，可推出渐开线的特性有哪些？","a":"发生线沿基圆作纯滚动，发生线上线段长度等于相应基圆弧长。\n渐开线任一点的法线与基圆相切，该点至切点的线段为曲率半径。\n各点压力角不等，cosα_K=r_b/r_K，离轮心越远压力角越大，基圆上为零。\n渐开线形状取决于基圆大小，基圆越大渐开线越平直；基圆以内无渐开线。","exp":"","fig":null,"page":null,"pts":[["发生线纯滚动","发生线沿基圆作纯滚动，发生线上线段长度等于相应基圆弧长。"],["法线与基圆相切","渐开线任一点的法线与基圆相切，该点至切点的线段为曲率半径。"],["压力角变化","各点压力角不等，cosα_K=r_b/r_K，离轮心越远压力角越大，基圆上为零。"],["形状与基圆","渐开线形状取决于基圆大小，基圆越大渐开线越平直；基圆以内无渐开线。"]]},{"id":"q112","no":112,"order":112,"chap":"c10","sec":"标准中心距与实际中心距","level":"普通","q":"试说明齿轮的分度圆与节圆、压力角与啮合角之间的区别，什么情况下会相等（重合）？","a":"分度圆是为便于齿轮设计和制造选择的尺寸参考圆。\n节圆是一对齿轮啮合时总相切的一对圆。\n压力角通常指分度圆压力角；啮合角是节点圆周速度方向与啮合线之间所夹的锐角，等于节圆压力角。\n两轮按标准中心距安装时，节圆分别与分度圆重合，啮合角也等于分度圆压力角。","exp":"解题思路：本题属于齿轮啮合基本定律的概念辨析题，核心区分逻辑是：从「是否属于单个齿轮固有属性」「是否受安装条件影响」两个维度区分四组概念，再结合标准齿轮的安装几何关系推导重合条件。\n知识体系：本题关联齿轮基本参数、啮合传动几何特性两个知识点：分度圆、压力角是齿轮设计阶段确定的固有标准参数，节圆、啮合角是啮合传动阶段的工况参数，两类参数的对应关系由安装中心距决定。","fig":null,"page":null,"pts":[["分度圆与节圆","",[["分度圆","为便于齿轮设计和制造选择的尺寸参考圆。"],["节圆","一对齿轮啮合时总相切的一对圆。"]]],["压力角与啮合角","压力角通常指分度圆压力角；啮合角是节点圆周速度方向与啮合线之间所夹的锐角，等于节圆压力角。"],["什么情况下相等","两轮按标准中心距安装时，节圆分别与分度圆重合，啮合角也等于分度圆压力角。"]]},{"id":"q113","no":113,"order":113,"chap":"c10","sec":"渐开线性质与啮合特点","level":"普通","q":"什么是啮合线？渐开线齿轮的啮合线为什么是直线，如何解释”四线（向）合一”？","a":"齿廓接触点在固定平面中的轨迹，称为啮合线。\n一对渐开线齿廓在任何位置啮合时，过接触点的公法线都是同一条直线，这说明从开始啮合到脱离接触，所有的啮合点均在该直线上。\n在齿轮传动过程中，两啮合齿廓间的正压力始终沿啮合线方向。\n“四线（向）合一”：啮合线、齿廓公法线、两基圆公切线及齿廓间正压力的作用线重合。","exp":"","fig":null,"page":null,"pts":[["啮合线","齿廓接触点在固定平面中的轨迹，称为啮合线。"],["为什么是直线","",[["为直线的原因","一对渐开线齿廓在任何位置啮合时，过接触点的公法线都是同一条直线，这说明从开始啮合到脱离接触，所有的啮合点均在该直线上。"],["正压力方向","在齿轮传动过程中，两啮合齿廓间的正压力始终沿啮合线方向。"]]],["四线合一","啮合线、齿廓公法线、两基圆公切线及齿廓间正压力的作用线重合。"]]},{"id":"q114","no":114,"order":114,"chap":"c10","sec":"渐开线齿轮正确啮合与连续传动条件","level":"普通","q":"渐开线齿轮传动的正确啮合条件是什么？","a":"一对渐开线齿轮正确啮合的条件是两轮的模数和压力角应分别相等：m_1=m_2=m，α_1=α_2=α。\n查看相似题视频。","exp":"","fig":null,"page":null,"pts":[["正确啮合条件","一对渐开线齿轮正确啮合的条件是两轮的模数和压力角应分别相等：m_1=m_2=m，α_1=α_2=α。"]]},{"id":"q115","no":115,"order":115,"chap":"c10","sec":"标准直齿轮几何尺寸计算","level":"普通","q":"什么是齿轮的模数？其物理意义是什么？为什么要将模数标准化？","a":"模数是齿轮的一个重要参数，用m表示，模数的定义为齿距p与π的比值，即 m=p/π。\n齿轮的分度圆直径d=mz。\n由上述两式可知，齿数一定时，模数越大，齿距和分度圆直径越大，模数反映轮齿的大小。\n为了减少齿轮加工刀具数量，模数m已标准化了。\n在设计齿轮时，若无特殊需要，应选用标准模数。","exp":"","fig":null,"page":null,"pts":[["什么是模数","",[["模数定义","模数是齿轮的一个重要参数，用m表示，模数的定义为齿距p与π的比值，即 m=p/π。"],["分度圆直径","齿轮的分度圆直径d=mz。"],["物理意义","由上述两式可知，齿数一定时，模数越大，齿距和分度圆直径越大，模数反映轮齿的大小。"]]],["为什么要标准化","",[["标准化","为了减少齿轮加工刀具数量，模数m已标准化了。"],["选用","在设计齿轮时，若无特殊需要，应选用标准模数。"]]]]},{"id":"q116","no":116,"order":116,"chap":"c10","sec":"标准直齿轮几何尺寸计算","level":"普通","q":"什么是标准齿轮？","a":"渐开线标准齿轮是指m、α、h、c*均为标准值，而且分度圆齿厚等于齿槽宽的渐开线齿轮。","exp":"判断标准齿轮须同时检查基本参数取标准值和分度圆齿厚等于齿槽宽。仅有标准模数、标准压力角还不足以判为标准齿轮，因为变位齿轮也可保持这两项参数不变。标准安装是齿轮副的装配关系，与单个齿轮是否标准须分别判断。","fig":null,"page":null,"pts":[["标准齿轮","渐开线标准齿轮是指m、α、h、c*均为标准值，而且分度圆齿厚等于齿槽宽的渐开线齿轮。"]]},{"id":"q117","no":117,"order":117,"chap":"c10","sec":"标准直齿轮几何尺寸计算","level":"普通","q":"齿轮顶隙有什么作用？","a":"为了避免两轮轮齿的顶、根相抵触，并能储存一定润滑油。","exp":"","fig":null,"page":null,"pts":[["顶隙作用","为了避免两轮轮齿的顶、根相抵触，并能储存一定润滑油。"]]},{"id":"q118","no":118,"order":118,"chap":"c10","sec":"渐开线齿轮正确啮合与连续传动条件","level":"普通","q":"何谓理论啮合线和实际啮合线？何谓重合度？重合度等于1和小于1时各会出现什么情况？重合度的主要影响因素有哪些？","a":"一对轮齿啮合点实际走过的轨迹B_1B_2称为实际啮合线段。\n因基圆内没有渐开线，N_1N_2是理论上可能达到的最长啮合线段，称为理论啮合线段，两端为啮合极限点。\n重合度为ε_α=B_1B_2/p_b，表示同时参与啮合齿对数的平均值。\n等于1时理论上恰好连续，前一对退出、后一对进入；小于1时相邻齿对不能及时接替，传动不连续。\n实际应大于或等于推荐许用值。\n重合度与模数无关，随齿数增多、啮合角减小和齿顶高系数增大而增大，随中心距增大而减小。","exp":"解题思路：本题属于齿轮机构的基础概念类简答题，答题核心逻辑为「概念定义→物理意义→参数影响」，需逐一明确各定义的边界、重合度的工程意义及参数影响规律，确保表述严谨无歧义。\n知识体系：理论啮合线是渐开线齿轮啮合的正压力作用线，其方向恒定是渐开线齿轮实现定传动比的核心保证；实际啮合线受轮齿齿顶高限制，长度小于理论啮合线；重合度是衡量齿轮传动连续性、承载能力的核心指标，工程应用中要求重合度必须大于1。\n易错分析：常见错误包括两点：1.混淆重合度等于1的理论意义与工程实际要求，忽略制造安装误差的影响，误认为工程中ε=1即可满足连续传动要求；2.误将模数列为重合度的影。","fig":null,"page":null,"pts":[["实际啮合线","一对轮齿啮合点实际走过的轨迹B_1B_2称为实际啮合线段。"],["理论啮合线","因基圆内没有渐开线，N_1N_2是理论上可能达到的最长啮合线段，称为理论啮合线段，两端为啮合极限点。"],["重合度","",[["定义","重合度为ε_α=B_1B_2/p_b，表示同时参与啮合齿对数的平均值。"],["等于1与小于1","等于1时理论上恰好连续，前一对退出、后一对进入；小于1时相邻齿对不能及时接替，传动不连续。"],["许用值","实际应大于或等于推荐许用值。"]]],["影响因素","重合度与模数无关，随齿数增多、啮合角减小和齿顶高系数增大而增大，随中心距增大而减小。"]]},{"id":"q119","no":119,"order":119,"chap":"c10","sec":"渐开线性质与啮合特点","level":"普通","q":"什么是渐开线齿轮的法向齿距p_n和基圆齿距p_b？这两者之间有什么关系？","a":"法向齿距和基圆齿距，分别为相邻两齿同侧齿廓在啮合线上所夹的线段长度和在基圆上的弧线长度，分别以p_n和p_b表示。\n由渐开线性质可知，法向齿距总等于基圆齿距，即p_n=p_b=p cosα。","exp":"","fig":null,"page":null,"pts":[["定义","法向齿距和基圆齿距，分别为相邻两齿同侧齿廓在啮合线上所夹的线段长度和在基圆上的弧线长度，分别以p_n和p_b表示。"],["关系","由渐开线性质可知，法向齿距总等于基圆齿距，即p_n=p_b=p cosα。"]]},{"id":"q120","no":120,"order":120,"chap":"c10","sec":"标准中心距与实际中心距","level":"普通","q":"何谓渐开线齿轮传动的可分性？如令一对标准齿轮的中心距稍大于标准中心距，能不能传动？有什么不良影响？","a":"当两轮实际安装中心距与设计中心距略有变动时，不会影响两轮的传动比。\n渐开线齿廓传动的这一特性称为传动的可分性。\n中心距稍大于标准中心距仍能传动，但会产生过大的齿侧间隙，影响传动的平稳性，且重合度也随之降低。","exp":"齿轮制成后，基圆半径不变，所以传动比的绝对值为 i_{12}=r_{b2}/r_{b1}。\n对标准外啮合齿轮，实际中心距与啮合角满足 a′cosα′=a cosα。\na′>a时α′>α。增大的侧隙可能引起反向间隙和冲击，降低的重合度会影响啮合连续性与承载平稳性。\n可分性不代表中心距能够无限增大，也不表示仍然无侧隙、仍保持标准顶隙。应保证重合度等啮合条件；以上增大中心距的结论针对题目通常讨论的外啮合情形。","fig":null,"page":null,"pts":[["可分性","当两轮实际安装中心距与设计中心距略有变动时，不会影响两轮的传动比。渐开线齿廓传动的这一特性称为传动的可分性。"],["中心距增大","中心距稍大于标准中心距仍能传动，但会产生过大的齿侧间隙，影响传动的平稳性，且重合度也随之降低。"]]},{"id":"q121","no":121,"order":121,"chap":"c10","sec":"标准中心距与实际中心距","level":"普通","q":"为什么在传动的轮齿之间要保持一定的侧隙？侧隙选得过大或过小时，对齿轮传动有何影响？","a":"为了便于在相互啮合的齿廓间进行润滑，避免由于制造和装配误差以及轮齿受力变形和因摩擦发热而膨胀所引起的挤轧现象，在两轮的非工作齿侧间总要留有一定的间隙。\n齿侧间隙一般都很小，通常由制造公差来保证。\n侧隙过小难以避免上述挤轧；过大则在正转和反转两个方向的传动中产生撞击。","exp":"","fig":null,"page":null,"pts":[["侧隙作用","为了便于在相互啮合的齿廓间进行润滑，避免由于制造和装配误差以及轮齿受力变形和因摩擦发热而膨胀所引起的挤轧现象，在两轮的非工作齿侧间总要留有一定的间隙。",[["由公差保证","齿侧间隙一般都很小，通常由制造公差来保证。"]]],["过大或过小的影响","侧隙过小难以避免上述挤轧；过大则在正转和反转两个方向的传动中产生撞击。"]]},{"id":"q122","no":122,"order":122,"chap":"c10","sec":"范成法加工齿轮(齿条刀具)","level":"普通","q":"范成法加工齿轮的安装条件和运动条件？","a":"刀具的模数、压力角应与被切齿轮的模数、压力角分别相等。切制标准齿轮时，齿条刀具分度线与轮坯分度圆相切；变位切齿时按径向变位量xm移远或移近刀具。滚刀加工直齿轮时，滚刀轴线与轮坯端面之间的夹角应等于滚刀导程角，使切削啮合处滚刀螺纹的切线方向与轮坯齿向相同。插刀与轮坯按恒定传动比i=ω_刀/ω_坯=z_坯/z_刀作展成运动；齿条插刀的直线速度为v_刀=rω_坯，r为轮坯分度圆半径。还需有切削、径向进给和让刀运动。","exp":"解题思路：范成法的本质是利用刀具齿廓与被加工齿轮齿廓之间的共轭包络关系。对齿条刀具加工外齿轮而言，安装条件决定变位量，运动条件则保证齿条刀具与轮坯之间具有正确的。","fig":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdQAAAEACAIAAACF6hACAABFWklEQVR4nO2dB1RUx/7HY/TFl5e8nLwUE429915ijPHF2MWgRqPGEhFQVJ4QVOwldgR7QyBIVMAoSBFEBKX3TiiCSJXeQQhW/t//zvGezQIrbLu7y+9zOHsuu3fnzszOfOc7c2fmvvWXWBYc7oi/xUe71hMEQRCy4y0SX4IgCMVD4ksoF6+aRoIT+EsHQbwBEl9CuXjx4kV0dLSbm9uzZ8+YgFZXV1+7di09PZ07wd/f/+7du3V1dfgU/2ZlZV24cOHJkyfshJqaGltb28ePH798+ZK/dBDEGyDxJZSFp0+fBgUF3bp1a+vWrXfu3PHz84PI3rt3b9++fSdPnrx//76/AAcHB2NjY5zg6+uLc27fvr1hwwZ3d3f8y044fPjwxYsXAwICSktLyfwSSguJL6EsZGdnDxkypIuAbt26dX8N/u3QocMXX3zRQwD+7dy5MzsBx5999lnHjh3Zv+y1U6dOXbt27devH/QavpjvZBFE45D4EsoCyltYWBjMb2BgIHwrXoMEeHl5jRkzZtiwYTC5AQLYR3jf0NAQ+nv69Gn2LfY+OwgNDSXnSygzJL6EsoNyePLkSYisr6/v8+fP2ZtQ1cLCwkWLFs2cORMiy28MCUICSHwJZefly5eZmZljx45du3ZtTU0NM7MvXrxwcXEZOnSopaUlp8gEoUKQ+BIqAIrisWPHunbtGh4ezoZxy8vLFy9erKGhAV2msQVCFSHxJVQAmN+srKzhw4evW7eOmV9/f3/Y3rNnz7IZacIn41+8WSeAbrgRSguJL6EaPH/+/Pjx4z179gwNDS0qKoLt/eabb1JTU4XPgUY/ffoUn7q5ubm6ulpaWiYlJUGC+YozQY _a、d_f、s、e作何变化？","a":"采用变位修正法来制造渐开线齿轮，不仅可以避免根切，还可以提高齿轮机构的承载能力、配凑中心距和减小机构的几何尺寸，并且仍可采用标准刀具加工。\n正变位后，z、m、α、d不变；分度圆齿厚s增大，槽宽e减小。\n齿根高较标准齿轮减小了xm，故齿根圆直径d_f增大。\n齿顶高若暂不计它对顶隙的影响，为了保持齿全高不变，应较标准齿轮增大xm，即h_a=(h_a+x)m，此时 d_a 增大。\n配对传动若需齿顶降低，还应计入齿高修正。","exp":"径向变位改变刀具相对轮坯的位置，不改变刀具齿距、齿数及分度圆，故z，m，α，d不变。正变位使分度圆齿厚增加2xmtanα，并减少齿根高。齿顶高的变化还取决于配对传动的齿顶降低量，只有在不计齿高修正时才能直接说齿顶高增加xm。","fig":null,"page":null,"pts":[["变位修正的目的","采用变位修正法来制造渐开线齿轮，不仅可以避免根切，还可以提高齿轮机构的承载能力、配凑中心距和减小机构的几何尺寸，并且仍可采用标准刀具加工。"],["正变位后各参数的变化","",[["不变的参数","正变位后，z、m、α、d不变。"],["齿厚与槽宽","分度圆齿厚s增大，槽宽e减小。"],["齿根高","较标准齿轮减小了xm，故齿根圆直径d_f增大。"],["齿顶高","若暂不计它对顶隙的影响，为了保持齿全高不变，应较标准齿轮增大xm，即h_a=(h_a+x)m，此时 d_a 增大。"],["齿高修正","配对传动若需齿顶降低，还应计入齿高修正。"]]]]},{"id":"q125","no":125,"order":125,"chap":"c10","sec":"范成法加工齿轮(齿条刀具)","level":"普通","q":"用齿条刀具以展成法加工齿轮时，如何获得标准齿轮及变位齿轮？","a":"用展成法切制标准齿轮时，其齿条刀具的分度线与被切齿轮的分度圆相切并作纯滚动。\n用改变刀具与轮坯的相对位置来切制齿轮的方法，即所谓变位修正法。\n这时，刀具的分度线与齿轮轮坯的分度圆不再相切，这样加工出来的齿轮由于s≠e已不再是标准齿轮，故称其为变位齿轮。\n齿条刀具移动的距离xm称为径向变位量，其中m为模数，x称为径向变位系数。\n当把刀具由齿轮轮坯中心移远时，称为正变位，x为正值；刀具由标准位置移近被切齿轮的中心，此时称为负变位，x为负值。","exp":"","fig":null,"page":null,"pts":[["标准齿轮","用展成法切制标准齿轮时，其齿条刀具的分度线与被切齿轮的分度圆相切并作纯滚动。"],["变位齿轮的获得","",[["变位修正法","用改变刀具与轮坯的相对位置来切制齿轮的方法，即所谓变位修正法。"],["变位齿轮","这时，刀具的分度线与齿轮轮坯的分度圆不再相切，这样加工出来的齿轮由于s≠e已不再是标准齿轮，故称其为变位齿轮。"],["径向变位量","齿条刀具移动的距离xm称为径向变位量，其中m为模数，x称为径向变位系数。"],["正变位与负变位","当把刀具由齿轮轮坯中心移远时，称为正变位，x为正值；刀具由标准位置移近被切齿轮的中心，此时称为负变位，x为负值。"]]]]},{"id":"q126","no":126,"order":126,"chap":"c10","sec":"等移距变位齿轮传动(高度变位)/不等移距变位齿轮传动(角度变位)","level":"普通","q":"变位齿轮传动的类型有几种？其啮合特点及优缺点有哪些？","a":"(1）等变位齿轮传动（又称高度变位齿轮传动）：x_1+x_2=0，且x_1=-x_2≠0。其啮合角等于分度圆压力角，中心距等于标准中心距，节圆与分度圆重合，齿顶高不需要降低。小齿轮应采用正变位，大齿轮采用负变位，使大、小齿轮的强度趋于接近，从而使齿轮的承载能力提高。(2）不等变位齿轮传动（又称角度变位齿轮传动）：x_1+x_2≠0。其中：①正传动：x_1+x_2>0。啮合角大于分度圆压力角，中心距大于标准中心距，两轮的分度圆分离，齿顶高需缩减。优点是可以减小齿轮机构的尺寸，使承载能力有较大提高；缺点是重合度减小较多。②负传动：x_1+x_2<0，α'<α，a'<a。重合度略有增加，但轮齿的强度有所下降，所以只用于配凑中心距这种特殊需要的场合。x_1=x_2=0则为标准齿轮传动。","exp":"","fig":null,"page":null,"pts":[["等变位齿轮传动","x_1+x_2=0，且x_1=-x_2≠0。其啮合角等于分度圆压力角，中心距等于标准中心距，节圆与分度圆重合，齿顶高不需要降低。小齿轮应采用正变位，大齿轮采用负变位，使大、小齿轮的强度趋于接近，从而使齿轮的承载能力提高。"],["不等变位齿轮传动","x_1+x_2≠0。",[["正传动","x_1+x_2>0。啮合角大于分度圆压力角，中心距大于标准中心距，两轮的分度圆分离，齿顶高需缩减。优点是可以减小齿轮机构的尺寸，使承载能力有较大提高；缺点是重合度减小较多。"],["负传动","x_1+x_2<0，α'<α，a'<a。重合度略有增加，但轮齿的强度有所下降，所以只用于配凑中心距这种特殊需要的场合。"],["标准齿轮","x_1=x_2=0则为标准齿轮传动。"]]]]},{"id":"q127","no":127,"order":127,"chap":"c10","sec":"不等移距变位齿轮传动(角度变位)","level":"普通","q":"若齿轮传动的设计中心距不等于标准中心距，可以用哪些方法来满足中心距的要求？","a":"采用变位修正法来制造渐开线齿轮，可以配凑中心距。\n斜齿轮传动还可以用改变螺旋角β的方法来调整其中心距的大小。","exp":"","fig":null,"page":null,"pts":[["变位修正","采用变位修正法来制造渐开线齿轮，可以配凑中心距。"],["改变螺旋角","斜齿轮传动还可以用改变螺旋角β的方法来调整其中心距的大小。"]]},{"id":"q128","no":128,"order":128,"chap":"c10","sec":"不等移距变位齿轮传动(角度变位）","level":"普通","q":"正传动类型中的齿轮是否一定都是正变位齿轮？负传动类型中的齿轮是否一定都是负变位齿轮？","a":"不一定。当x_1+x_2>0时称为正传动；x_1+x_2<0时称为负传动。判别依据是两轮变位系数之和，不能据此认定两轮都为正变位或都为负变位。","exp":"","fig":null,"page":null,"pts":[["结论","不一定。当x_1+x_2>0时称为正传动；x_1+x_2<0时称为负传动。"],["判别依据","两轮变位系数之和，不能据此认定两轮都为正变位或都为负变位。"]]},{"id":"q129","no":129,"order":129,"chap":"c10","sec":"齿轮齿条传动计算","level":"普通","q":"齿轮齿条啮合传动有何特点？为什么说无论齿条是否为标准安装，啮合线的位置都不会改变？","a":"正确啮合条件：分度圆上的模数和压力角分别相等。\n齿轮与齿条不论是否标准安装，齿条的直线齿廓总是保持其齿形角α方向不变，因此啮合线及节点的位置始终保持不变，即齿轮的节圆恒与其分度圆重合，其啮合角α/恒等于分度圆压力角α。\n标准安装时，齿条的分度线与节线重合，与齿轮分度圆相切；非标准安装时，齿条的分度线与其节线不再重合，也与齿轮分度圆不再相切。","exp":"","fig":null,"page":null,"pts":[["正确啮合条件","分度圆上的模数和压力角分别相等。"],["为什么啮合线位置不变","",[["啮合线位置不变","齿轮与齿条不论是否标准安装，齿条的直线齿廓总是保持其齿形角α方向不变，因此啮合线及节点的位置始终保持不变，即齿轮的节圆恒与其分度圆重合，其啮合角α/恒等于分度圆压力角α。"],["标准与非标准安装","标准安装时，齿条的分度线与节线重合，与齿轮分度圆相切；非标准安装时，齿条的分度线与其节线不再重合，也与齿轮分度圆不再相切。"]]]]},{"id":"q130","no":130,"order":130,"chap":"c10","sec":"斜齿轮参数计算","level":"普通","q":"为什么斜齿轮的标准参数要规定在法面上，而其几何尺寸却要按端面来计算？","a":"因为在切制斜齿轮的轮齿时，刀具进刀的方向一般是垂直于其法面的，故其法面参数与刀具的参数相同，所以取为标准值。\n由于斜齿轮的端面齿廓与直齿轮一样都是渐开线，且分度圆直径、中心距等几何尺寸在端面内确定，所以可用端面参数代入直齿轮的相应公式计算。因此，需要建立法面参数与端面参数之间的换算关系。","exp":"","fig":null,"page":null,"pts":[["法面取标准","因为在切制斜齿轮的轮齿时，刀具进刀的方向一般是垂直于其法面的，故其法面参数与刀具的参数相同，所以取为标准值。"],["端面计算","由于斜齿轮的端面齿廓与直齿轮一样都是渐开线，且分度圆直径、中心距等几何尺寸在端面内确定，所以可用端面参数代入直齿轮的相应公式计算。因此，需要建立法面参数与端面参数之间的换算关系。"]]},{"id":"q131","no":131,"order":131,"chap":"c10","sec":"斜齿圆柱齿轮的几何参数","level":"普通","q":"圆柱斜齿轮比直齿轮有许多优点，为什么直齿轮应用更广泛，叙述你对此问题的分析和理解。","a":"斜齿轮的优点是啮合性能好、传动平稳、噪声小；重合度大，每对轮齿载荷降低、承载能力提高；不产生根切的最少齿数少。\n主要缺点是运转时产生轴向推力，F_a=F_t tanβ，且随螺旋角增大而增大。\n人字齿轮可使轴向推力相互抵消，但制造较麻烦。\n因此，在直齿轮已满足工作要求的场合，选用直齿轮可避免斜齿轮的轴向推力问题；不能仅凭斜齿轮的优点判断其应在所有场合取代直齿轮。","exp":"","fig":null,"page":null,"pts":[["优点","斜齿轮的优点是啮合性能好、传动平稳、噪声小；重合度大，每对轮齿载荷降低、承载能力提高；不产生根切的最少齿数少。"],["缺点","主要缺点是运转时产生轴向推力，F_a=F_t tanβ，且随螺旋角增大而增大。"],["人字齿轮","使轴向推力相互抵消，但制造较麻烦。"],["结论","因此，在直齿轮已满足工作要求的场合，选用直齿轮可避免斜齿轮的轴向推力问题；不能仅凭斜齿轮的优点判断其应在所有场合取代直齿轮。"]]},{"id":"q132","no":132,"order":132,"chap":"c10","sec":"斜齿轮当量齿数与重合度","level":"普通","q":"什么是斜齿轮的当量齿轮？为什么要提出当量齿轮的概念？","a":"过斜齿轮分度圆柱面上的一点作轮齿的法面，将分度圆柱剖开，其剖面为一椭圆。\n以椭圆上该点的曲率半径为半径作一圆，作为一假想直齿轮的分度圆，以该斜齿轮的法面模数为模数、法面压力角为压力角，作一直齿轮，其齿形就是斜齿轮的法面近似齿形，称此直齿轮为斜齿轮的当量齿轮。\n这是为了切制斜齿轮和计算齿轮强度的需要。","exp":"","fig":null,"page":null,"pts":[["当量齿轮的定义","",[["背锥展开","过斜齿轮分度圆柱面上的一点作轮齿的法面，将分度圆柱剖开，其剖面为一椭圆。"],["作法","以椭圆上该点的曲率半径为半径作一圆，作为一假想直齿轮的分度圆，以该斜齿轮的法面模数为模数、法面压力角为压力角，作一直齿轮，其齿形就是斜齿轮的法面近似齿形，称此直齿轮为斜齿轮的当量齿轮。"]]],["为什么要提出当量齿轮","这是为了切制斜齿轮和计算齿轮强度的需要。"]]},{"id":"q133","no":133,"order":133,"chap":"c10","sec":"斜齿轮当量齿数与重合度","level":"普通","q":"平行轴斜齿轮机构的啮合特点是什么？其正确啮合条件及连续传动条件与直齿轮有何异同？","a":"斜齿轮的接触线与轴线倾斜，长度由零逐渐增长，再逐渐缩短，轮齿逐渐进入和退出啮合，载荷逐渐加上和卸掉，故传动平稳、冲击和噪声小。直齿轮则沿整个齿宽同时进入和脱离啮合。正确啮合：两者都须模数、压力角分别相等；斜齿轮还须螺旋角相匹配，即m_{n1}=m_{n2}、α_{n1}=α_{n2}，外啮合β_1=−β_2，内啮合β_1=β_2，也可用端面参数表示。连续传动都要求重合度至少为1。直齿轮用实际啮合线与基圆齿距之比；斜齿轮总重合度为ε=ε_α+ε_β，比端面齿廓相同的直齿轮增加了轴向重合度。因此斜齿轮应以总重合度判定连续传动，其重合度随齿宽和螺旋角增大而增大。\n对比项直齿轮平行轴斜齿轮正确啮模数、压力角分别相法向模数、法向压力角分别相等，螺旋角大小相。","exp":"","fig":null,"page":null,"pts":[["啮合特点","斜齿轮的接触线与轴线倾斜，长度由零逐渐增长，再逐渐缩短，轮齿逐渐进入和退出啮合，载荷逐渐加上和卸掉，故传动平稳、冲击和噪声小。直齿轮则沿整个齿宽同时进入和脱离啮合。"],["正确啮合条件","两者都须模数、压力角分别相等；斜齿轮还须螺旋角相匹配，即m_{n1}=m_{n2}、α_{n1}=α_{n2}，外啮合β_1=−β_2，内啮合β_1=β_2，也可用端面参数表示。"],["连续传动条件","连续传动都要求重合度至少为1。直齿轮用实际啮合线与基圆齿距之比；斜齿轮总重合度为ε=ε_α+ε_β，比端面齿廓相同的直齿轮增加了轴向重合度。因此斜齿轮应以总重合度判定连续传动，其重合度随齿宽和螺旋角增大而增大。"]]},{"id":"q134","no":134,"order":134,"chap":"c10","sec":"圆锥齿轮传动计算","level":"普通","q":"直齿圆锥齿轮背锥上的齿形有什么特点？何为直齿圆锥齿轮当量齿轮和当量齿数？","a":"将背锥展开，轮1的背锥将展成为一个扇形齿轮；当齿条（即冠轮的背锥）的齿廓为直线时，扇形齿轮的齿廓为渐开线。\n把展成的扇形齿轮的缺口补满，将获得一个圆柱齿轮。\n这个假想的圆柱齿轮称为锥齿轮的当量齿轮，其齿数z_v称为锥齿轮的当量齿数，z_v=z/cosδ。\n当量齿轮的齿形和锥齿轮在背锥上的齿形（即大端齿形）是一致的。","exp":"","fig":null,"page":null,"pts":[["背锥上的齿形","",[["背锥展开","将背锥展开，轮1的背锥将展成为一个扇形齿轮；当齿条（即冠轮的背锥）的齿廓为直线时，扇形齿轮的齿廓为渐开线。"],["补满扇形","把展成的扇形齿轮的缺口补满，将获得一个圆柱齿轮。"]]],["当量齿轮与当量齿数","这个假想的圆柱齿轮称为锥齿轮的当量齿轮，其齿数z_v称为锥齿轮的当量齿数，z_v=z/cosδ。"],["齿形一致","当量齿轮的齿形和锥齿轮在背锥上的齿形（即大端齿形）是一致的。"]]},{"id":"q135","no":135,"order":135,"chap":"c10","sec":"圆锥齿轮传动计算","level":"普通","q":"请用齿轮参数符号写出一对直齿圆锥齿轮的正确啮合条件。","a":"一对锥齿轮的正确啮合条件应为两轮大端的模数和压力角分别相等，即 m_1=m_2、α_1=α_2。","exp":"","fig":null,"page":null,"pts":[["正确啮合条件","一对锥齿轮的正确啮合条件应为两轮大端的模数和压力角分别相等，即 m_1=m_2、α_1=α_2。"]]},{"id":"q136","no":136,"order":136,"chap":"c10","sec":"圆锥齿轮传动计算","level":"普通","q":"直齿圆锥齿轮几何尺寸的计算通常以哪端为准，为什么？大端、小端和中间截面的模数中哪一个取标准值？","a":"通常以大端为准，大端模数取标准值。\n锥齿轮是一个锥体，从而有大端和小端之分。\n为了计算和测量的方便，通常取锥齿轮大端的参数为标准值。","exp":"","fig":null,"page":null,"pts":[["以大端为准","通常以大端为准，大端模数取标准值。"],["锥体大小端","锥齿轮是一个锥体，从而有大端和小端之分。"],["标准值原因","为了计算和测量的方便，通常取锥齿轮大端的参数为标准值。"]]},{"id":"q137","no":137,"order":137,"chap":"c11","sec":"轮系分类","level":"普通","q":"试述定轴轮系与基本周转轮系的主要区别。","a":"如果在轮系运转时，其各个齿轮的轴线相对于机架的位置都是固定的，这种轮系就称为定轴轮系。\n如果在轮系运转时，其中至少有一个齿轮轴线的位置并不固定，而是绕着其他齿轮的固定轴线回转，则这种轮系称为周转轮系。","exp":"","fig":null,"page":null,"pts":[["定轴轮系","如果在轮系运转时，其各个齿轮的轴线相对于机架的位置都是固定的，这种轮系就称为定轴轮系。"],["周转轮系","如果在轮系运转时，其中至少有一个齿轮轴线的位置并不固定，而是绕着其他齿轮的固定轴线回转，则这种轮系称为周转轮系。"]]},{"id":"q138","no":138,"order":138,"chap":"c11","sec":"轮系分类","level":"普通","q":"什么是差动轮系、行星轮系？","a":"在周转轮系中两个中心轮都能转动。\n该轮系有两个自由度，即需要两个原动件，这种周转轮系称为差动轮系。\n在周转轮系中，只有一个中心轮能转动。\n同样可算得该轮系只有一个自由度，即只需要一个原动件，这种周转轮系称为行星轮系。","exp":"","fig":null,"page":null,"pts":[["差动轮系","在周转轮系中两个中心轮都能转动。该轮系有两个自由度，即需要两个原动件，这种周转轮系称为差动轮系。"],["行星轮系","在周转轮系中，只有一个中心轮能转动。同样可算得该轮系只有一个自由度，即只需要一个原动件，这种周转轮系称为行星轮系。"]]},{"id":"q139","no":139,"order":139,"chap":"c11","sec":"轮系分类","level":"普通","q":"请分别画出一个差动轮系和一个行星轮系的机构运动简图。","a":"下图（a）为差动轮系，太阳轮1、内齿轮3都可绕固定轴线转动，2为行星轮，H为行星架；图（b）将轮3固定，成为行星轮系。\n(a)\n(b)","exp":"","fig":"data:image/png;ba
