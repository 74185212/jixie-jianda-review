APEHGAwAAAOIJMh4AAAAQT5DxAAAAgHiCjAcAAADEE2Q8AAAAIJ4g4wEAAADxBBkPAAAAiCfIeAAAAEA8QcYDAAAA4gkyHgAAABBPkPEAAACAeIKMBwAAAMQTZDwAAAAgngbJ+PlRE1DGO0eOx7pOAAAAAHBnkIxfdXgyqyn/Ad+IdakAAAAA4MIgGX8wawMr4++/zsS6VAAAAABwYZCMf1F1n5XxcenLsS4VAAAAAFwYJOM/b8pXvH+CdbUAAAAA4NTgGY+Enp2PMt7vpC2R3IV1wQAAAADgCEcZj6Tk7TqTG15R+4RC7sG6ZgAAAAAM7v8AzSdxNYCjK9wAAAAASUVORK5CYII=","page":null,"pts":[["简图说明","下图（a）为差动轮系，太阳轮1、内齿轮3都可绕固定轴线转动，2为行星轮，H为行星架；图（b）将轮3固定，成为行星轮系。"]]},{"id":"q140","no":140,"order":140,"chap":"c11","sec":"定轴轮系传动比计算","level":"普通","q":"在定轴轮系中，如何来确定首、末轮之间的转向关系？","a":"首、末两轮的转向关系可用标注箭头的方法来确定。\n因为一对啮合传动的圆柱齿轮或锥齿轮在其啮合节点处的圆周速度是相同的，所以标志两者转向的箭头不是同时指向节点，就是同时背离节点。\n当首、末两轮的轴线彼此平行时，两轮的转向不是相同就是相反；当两者的转向相同时，规定其传动比为“十”，反之为“一”。\n若首、末两轮的轴线不平行，其间的转向关系则只能在图上用箭头来表示。","exp":"解题思路：定轴轮系转向判断的核心逻辑是：传动比的正负号仅在两轮轴线平行时，才有“转向相同/相反”的物理意义，因此需根据轴线的平行关系分情况选择判断方法。轴线全平行时可通过外啮合次数快速计算，涉及非平行轴时需用画箭头法逐轮推导。\n知识体系：三种转向判断场景的对比如下：轴线配置情况适用判断方法传动比符号的意义所有齿轮轴线均平行（-1)ⁿ法（n为外啮合次数）正负分别对应首末轮转向或画箭头法相同/相反轴线不全平行，但首末轮仅可使用画箭头法正负分别对应首末轮转向轴线平行相同/相反。","fig":null,"page":null,"pts":[["箭头法","首、末两轮的转向关系可用标注箭头的方法来确定。"],["圆周速度相同","因为一对啮合传动的圆柱齿轮或锥齿轮在其啮合节点处的圆周速度是相同的，所以标志两者转向的箭头不是同时指向节点，就是同时背离节点。"],["轴线平行","当首、末两轮的轴线彼此平行时，两轮的转向不是相同就是相反；当两者的转向相同时，规定其传动比为“十”，反之为“一”。"],["轴线不平行","若首、末两轮的轴线不平行，其间的转向关系则只能在图上用箭头来表示。"]]},{"id":"q141","no":141,"order":141,"chap":"c11","sec":"定轴轮系传动比计算","level":"普通","q":"什么是惰轮？它在轮系中起什么作用？","a":"例如，轮2对轮1为从动轮，但对轮3又为主动轮，故其齿数的多少并不影响传动比的大小，而仅起着中间过渡和改变从动轮转向的作用，故称之为过轮或中介轮。","exp":"惰轮在前一对啮合中是从动轮，在后一对啮合中又是主动轮，其齿数在传动比计算的分子、分母中相互约去。增加惰轮可在首、末轮齿数不变时实现较远距离传动。\n单式定轴轮系的传动比大小可简化为末轮与首轮的齿数比，不能把这一简化推广到任意轮系。各轴线平行的定轴轮系可用外啮合次数的奇偶性判断首、末轮转向；空间定轴轮系应根据各对啮合逐级判断转向。","fig":null,"page":null,"pts":[["惰轮的作用","例如，轮2对轮1为从动轮，但对轮3又为主动轮，故其齿数的多少并不影响传动比的大小，而仅起着中间过渡和改变从动轮转向的作用，故称之为过轮或中介轮。"]]},{"id":"q142","no":142,"order":142,"chap":"c11","sec":"行星轮系齿数确定","level":"普通","q":"什么是行星轮系？在行星轮系中，各轮齿数的确定应满足哪些条件？","a":"自由度为1的周转轮系称为行星轮系。\n各轮齿数的选配需满足：\n(1）尽可能近似地实现给定的传动比。\n(2）满足同心条件：基本构件的回转轴线必须在同一直线上。\n(3）满足均布条件：使各行星轮能均布地装配。\n(4）满足邻接条件：保证相邻两行星轮不致互相碰撞。","exp":"","fig":null,"page":null,"pts":[["行星轮系","自由度为1的周转轮系称为行星轮系。"],["齿数的确定应满足哪些条件","",[["近似实现传动比","尽可能近似地实现给定的传动比。"],["同心条件","基本构件的回转轴线必须在同一直线上。"],["均布条件","使各行星轮能均布地装配。"],["邻接条件","保证相邻两行星轮不致互相碰撞。"]]]]},{"id":"q143","no":143,"order":143,"chap":"c11","sec":"行星轮系与差动轮系传动比计算","level":"普通","q":"什么是周转轮系的转化轮系？它在计算周转轮系传动比中起什么作用？","a":"根据相对运动原理，若给整个周转轮系加上一个公共角速度\"一ω_H\"，使之绕行星架的固定轴线回转，这时各构件之间的相对运动仍将保持不变，而行星架的角速度变为ω_H−ω_H=0，即行星架\"静止不动\"了。于是，周转轮系转化成了定轴轮系。这种转化所得的假想的定轴轮系，称为原周转轮系的转化轮系或转化机构。因转化轮系为一定轴轮系，其传动比当然就可按定轴轮系来计算了。通过它可得出周转轮系中各构件之间角速度的关系，进而求得周转轮系的传动比。","exp":"解题思路：本题属于概念类简答题，核心考察周转轮系反转法的基本原理，答题遵循「定义阐述+作用说明」的逻辑即可，需准确表述公共角速度的施加规则、转化轮系的本质，以及其衔接两类轮系计算的核心价值。知识体系：转化轮系的理论依据是相对运动原理：给整个机构施加公共角速度，各构件之间的相对运动关系不发生改变。它是周转轮系传动比计算的核心工具，对应的核心公式为：∏z从动ω_1-ω_Hin=(-1)mω_n-ω_H∏z主动其中i识为转化轮系中轮1到轮n的传动比，m为轮系外啮合次数，该知识点出自西北工业大学编《机械原理》（第8版）第9章「轮系及其设计」。","fig":null,"page":null,"pts":[["转化轮系","",[["转化原理","根据相对运动原理，若给整个周转轮系加上一个公共角速度\"一ω_H\"，使之绕行星架的固定轴线回转，这时各构件之间的相对运动仍将保持不变，而行星架的角速度变为ω_H−ω_H=0，即行星架\"静止不动\"了。"],["定义","于是，周转轮系转化成了定轴轮系。这种转化所得的假想的定轴轮系，称为原周转轮系的转化轮系或转化机构。因转化轮系为一定轴轮系，其传动比当然就可按定轴轮系来计算了。"]]],["它在计算传动比中的作用","通过它可得出周转轮系中各构件之间角速度的关系，进而求得周转轮系的传动比。"]]},{"id":"q144","no":144,"order":144,"chap":"c11","sec":"混合轮系传动比计算","level":"普通","q":"计算混合轮系传动比的基本思路是什么？能否通过给整个轮系加上一个公共的角速度一ω的方法来计算整个轮系的传动比？","a":"应将复合轮系所包含的各部分周转轮系和定轴轮系一一分开，分别列出传动比计算式，再联立求解。\n划分的关键是先找出行星轮和行星架。\n每一行星架，连同行星架上的行星轮和与之啮合的太阳轮，组成一个基本周转轮系；把这些周转轮系找出后，剩下的便是定轴轮系部分。\n一般不能给整个混合轮系加上同一个公共角速度，就把它整体当作定轴轮系计算。\n转化关系应针对各自的行星架：i_{nn}=(ω_m−ω_H)/(ω_n−ω_H)。\n混合轮系可有多个行星架，同一公共角速度一般不能使所有行星架同时静止；原有定轴部分还须按其自身关系列式。","exp":"解题思路：本题核心考察混合轮系的构成特征与传动比计算的核心逻辑，解题的核心前提是明确定轴轮系与周转轮系的运动特征差异，两类轮系的传动比计算方法不通用，因此必须拆分后分别计算再联立。\n知识体系：三类常见轮系的传动比计算方法对比如下：轮系类。","fig":null,"page":null,"pts":[["基本思路","",[["先拆分再联立","应将复合轮系所包含的各部分周转轮系和定轴轮系一一分开，分别列出传动比计算式，再联立求解。"],["划分关键","划分的关键是先找出行星轮和行星架。每一行星架，连同行星架上的行星轮和与之啮合的太阳轮，组成一个基本周转轮系；把这些周转轮系找出后，剩下的便是定轴轮系部分。"]]],["能否整体加公共角速度","",[["结论","一般不能给整个混合轮系加上同一个公共角速度，就把它整体当作定轴轮系计算。"],["转化关系","i_{nn}=(ω_m−ω_H)/(ω_n−ω_H)。混合轮系可有多个行星架，同一公共角速度一般不能使所有行星架同时静止；原有定轴部分还须按其自身关系列式。"]]]]},{"id":"q145","no":145,"order":145,"chap":"c11","sec":"轮系的功用","level":"普通","q":"您所能想到的轮系的用途有哪些？请举例说明。","a":"(1）实现分路传动。\n(2）获得较大的传动比。\n(3）实现变速传动。\n(4）实现换向传动。\n(5）用作运动的合成。\n(6）用作运动的分解。\n差动轮系也可作运动的分解，即将一个主动运动按可变的比例分解为两个从动运动。例如汽车后桥上的差速器。","exp":"","fig":null,"page":null,"pts":[["用途","",[["","实现分路传动。"],["","获得较大的传动比。"],["","实现变速传动。"],["","实现换向传动。"],["","用作运动的合成。"],["","用作运动的分解。"]]],["举例","差动轮系也可作运动的分解，即将一个主动运动按可变的比例分解为两个从动运动。例如汽车后桥上的差速器。"]]},{"id":"q146","no":146,"order":146,"chap":"c12","sec":"","level":"普通","q":"什么是机械的工作循环图？","a":"工作循环图（也称为运动循环图）用以表明机械在一个工作循环中各执行构件运动配合关系。\n编制时，从机械中选择一个构件作为定标件，用它的运动位置（转角或位移）作为确定其他执行构件运动先后次序的基准。","exp":"","fig":null,"page":null,"pts":[["工作循环图","（也称为运动循环图）用以表明机械在一个工作循环中各执行构件运动配合关系。"],["编制方法","编制时，从机械中选择一个构件作为定标件，用它的运动位置（转角或位移）作为确定其他执行构件运动先后次序的基准。"]]},{"id":"q147","no":147,"order":147,"chap":"c12","sec":"","level":"普通","q":"什么叫组合机构？常用的组合机构有哪几类？","a":"把几个基本机构组合起来应用便构成组合机构；通常不是一般串联，而是封闭式传动机构或特殊串联、并联机构。\n封闭式传动是利用一个机构约束或封闭另一个多自由度机构，使其具有确定运动和更为多样的运动形式或规律。\n常用类型为联动凸轮、凸轮一齿轮、凸轮一连杆、齿轮一连杆组合机构。","exp":"","fig":null,"page":null,"pts":[["组合机构","把几个基本机构组合起来应用便构成组合机构；通常不是一般串联，而是封闭式传动机构或特殊串联、并联机构。",[["封闭式传动","利用一个机构约束或封闭另一个多自由度机构，使其具有确定运动和更为多样的运动形式或规律。"]]],["常用类型","联动凸轮、凸轮一齿轮、凸轮一连杆、齿轮一连杆组合机构。"]]},{"id":"q148","no":148,"order":148,"chap":"c12","sec":"间歇运动机构类型与特点","level":"普通","q":"实现间歇运动的常用机构有哪些？","a":"棘轮机构、槽轮机构、不完全齿轮机构及凸轮式间歇运动机构均能使执行构件获得间歇运动。","exp":"常用机构包括棘轮机构、槽轮机构、不完全齿轮机构和凸轮间歇运动机构。\n棘轮机构通过棘爪周期性推动棘轮实现步进，连续转动输入通常还需通过曲柄摇杆等机构变成棘爪的往复驱动；槽轮由圆销周期性进入轮槽驱动；不完全齿轮利用有齿段传动、无齿段停歇；凸轮间歇机构则用轮廓控制运动和停歇。\n不同机构的转角、停歇时间、冲击和定位特性不同，应按工作要求选择。这里列举的是常用机构，并不表示每种机构在任何参数和输入方式下都能直接互换。","fig":null,"page":null,"pts":[["常用机构","棘轮机构、槽轮机构、不完全齿轮机构及凸轮式间歇运动机构均能使执行构件获得间歇运动。"]]},{"id":"q149","no":149,"order":149,"chap":"c12","sec":"间歇运动机构类型与特点","level":"普通","q":"在槽轮机构、棘轮机构中，如何保证从动件在停歇期间静止不动？","a":"槽轮的内凹锁止弧被拨盘的外凸锁止弧卡住，故槽轮不动。\n棘轮机构中，驱动棘爪在齿背滑过时，止动爪阻止棘轮反转；弹簧用来使止动爪和棘轮保持接触。","exp":"核心机理：槽轮停歇时由拨盘的锁止圆弧与槽轮的锁止凹弧配合，限制槽轮自行转动；棘轮则由止回棘爪扣住轮齿，防止反转。驱动件退出工作接触后，须由独立的锁止结构维持停歇位置。","fig":null,"page":null,"pts":[["槽轮机构","槽轮的内凹锁止弧被拨盘的外凸锁止弧卡住，故槽轮不动。"],["棘轮机构","驱动棘爪在齿背滑过时，止动爪阻止棘轮反转；弹簧用来使止动爪和棘轮保持接触。"]]},{"id":"q150","no":150,"order":150,"chap":"c12","sec":"间歇运动机构类型与特点","level":"普通","q":"棘轮机构与槽轮机构均可用来实现从动轴的单向间歇转动，但在具体的选择使用上又有什么不同？","a":"棘轮结构简单、制造方便、运动可靠，每次转角可在较大范围调节，但冲击噪声较大、运动精度较差，常用于速度较低、载荷不大处。\n槽轮外形尺寸小、机械效率高，能较平稳地间歇转位，但仍存在柔性冲击，常用于速度不太高的场合。","exp":"","fig":null,"page":null,"pts":[["棘轮机构","棘轮结构简单、制造方便、运动可靠，每次转角可在较大范围调节，但冲击噪声较大、运动精度较差，常用于速度较低、载荷不大处。"],["槽轮机构","槽轮外形尺寸小、机械效率高，能较平稳地间歇转位，但仍存在柔性冲击，常用于速度不太高的场合。"]]},{"id":"q151","no":151,"order":151,"chap":"c12","sec":"棘轮机构设计/间歇运动机构类型与特点","level":"普通","q":"典型棘轮机构由哪些构件组成？在棘轮机构中为保证棘爪能顺利进入棘轮轮齿的齿根，应满足的条件是什么？","a":"典型棘轮机构由摇杆、棘爪、棘轮、止动爪等组成，弹簧使止动爪和棘轮保持接触，也可在摇杆与棘爪之间设置弹簧。\n棘爪顺利进入齿底，要求法向压力与摩擦力的合力作用线通过棘轮轴心与棘爪轴心之间，条件为 α>90°+φ−Σ。\nα为工作齿面与向径的夹角，φ为摩擦角，∑为两轴心分别连至齿顶的两线夹角。\n为使同一传递转矩下棘爪受力最小，一般取Σ=90°，此时α>φ。","exp":"","fig":null,"page":null,"pts":[["组成","典型棘轮机构由摇杆、棘爪、棘轮、止动爪等组成，弹簧使止动爪和棘轮保持接触，也可在摇杆与棘爪之间设置弹簧。"],["棘爪顺利进入齿底的条件","",[["条件","棘爪顺利进入齿底，要求法向压力与摩擦力的合力作用线通过棘轮轴心与棘爪轴心之间，条件为 α>90°+φ−Σ。"],["符号","α为工作齿面与向径的夹角，φ为摩擦角，∑为两轴心分别连至齿顶的两线夹角。"],["推荐取值","为使同一传递转矩下棘爪受力最小，一般取Σ=90°，此时α>φ。"]]]]},{"id":"q152","no":152,"order":152,"chap":"c12","sec":"槽轮机构设计","level":"普通","q":"何谓槽轮机构运动系数τ？τ=0.4表示什么意义？为什么运动系数必须大于零而小于1？","a":"主动拨盘回转一周时，槽轮运动时间与拨盘转一周总时间之比为运动系数，教材记为k=t_a/t。τ=0.4意味着运动占周期40%，停歇占60%。\n要使槽轮既转动又有停歇，其运动时间必须大于零、小于周期总时间，故0<τ<1。","exp":"运动系数是时间比例，不是单次转位角与整周角之比。主动盘匀速时可用运动阶段对应的主动盘转角除以360°计算。τ=0.4意味着每周期运动0.4T、停歇0.6T；多拨销时应累计该周期内所有运动段时间。","fig":null,"page":null,"pts":[["运动系数","主动拨盘回转一周时，槽轮运动时间与拨盘转一周总时间之比为运动系数，教材记为k=t_a/t。τ=0.4意味着运动占周期40%，停歇占60%。"],["取值范围","要使槽轮既转动又有停歇，其运动时间必须大于零、小于周期总时间，故0<τ<1。"]]},{"id":"q153","no":153,"order":153,"chap":"c12","sec":"螺旋机构位移计算","level":"普通","q":"何为差动螺旋？何为复式螺旋？各用于什么场合？","a":"两段螺纹的旋向相同，螺母的位移s=(P_{hA}−P_{hB})φ/(2π)。\n当两导程相差很小时，位移可以很小，这种螺旋机构称为微动螺旋机构，常用于测微计、分度机构及调节机构中。\n两段螺纹的旋向相反，螺母的位移s=(P_{hA}+P_{hB})φ/(2π)，这种螺旋机构称为复式螺旋机构，可用于自动定心夹紧机构。","exp":"解题思路：本题属于螺旋机构基础概念辨析题，核心区分点为两段螺纹的旋向差异，对应位移计算逻辑的不同，进而匹配不同的应用场景。\n知识体系：两种复合螺旋的核心参数对比如下：螺旋类螺纹旋向位移计算逻辑核心特点典型应用型差动螺两段旋向相位移与导程差成可实现极小的精密测微仪、微动工作台旋同正比微动复式螺两段旋向相位移与导程和成可实现快速大位移快速夹具、快速启闭旋反正比调整机构。\n易错分析：考生易混淆两种螺旋的位移对应关系，可通过「同差反和」口诀记忆：旋向相同对应导程差（差动），旋向相反对应导程和（复式）；另外需注意差动螺旋的精度由导程差决定，导程差越小位移精度越高。","fig":null,"page":null,"pts":[["差动螺旋","两段螺纹的旋向相同，螺母的位移s=(P_{hA}−P_{hB})φ/(2π)。"],["微动螺旋","当两导程相差很小时，位移可以很小，这种螺旋机构称为微动螺旋机构，常用于测微计、分度机构及调节机构中。"],["复式螺旋","两段螺纹的旋向相反，螺母的位移s=(P_{hA}+P_{hB})φ/(2π)，这种螺旋机构称为复式螺旋机构，可用于自动定心夹紧机构。"]]},{"id":"q154","no":154,"order":154,"chap":"c12","sec":"万向铰链机构","level":"普通","q":"单万向联轴器用于什么场合？它有怎样的运动特性？","a":"用于两相交轴之间的传动。\n当主动轴转一转时，从动轴也必然转一转，但是两轴的瞬时角速度比却并不恒等于1，而是随时变化的。\n当主动轴以角速度ω_1等速回转时，从动轴的角速度满足ω_1cosα≤ω_2≤ω_1/cosα。\n变化的幅度与两轴间夹角的大小有关，两轴夹角不能过大，一般α≤30°。","exp":"解题思路：本题属于机械设计中联轴器章节的基础考点，需分别从功能定位（适用场合）、运动学规律（运动特性）两个核心维度作答，准确区分单万向联轴器与其他联轴器的使用差异。\n知识体系：本知识点出自濮良贵《机械设计》（第十版）第十六章《联轴器和离合器》。单万向联轴器的瞬时传动比满足公式i_{12}=ω_2cosα其中α为两轴夹角，φ₁为主动ω_11−sin²αcos2φ轴转角，从动轴瞬时转速在ω_1cosα～ω_1区间周期性波动，会产生附加动载荷。工程中cosα若需实现等角速传动，可采用双万向联轴器，安装时需满足：主动轴、从动轴与中间轴的夹角相等，且中间轴两端的叉形接头位于同一平面。\n易错分析：常见错误为混淆单、双万向联轴器的运动特性，误以为单万向联轴器可实现等角速传动；或忽略从动轴速度波动幅度与两轴夹角的正相关关系，未注意夹角越大动载荷越大的特性。","fig":null,"page":null,"pts":[["适用场合","用于两相交轴之间的传动。"],["运动特性","",[["转数关系","当主动轴转一转时，从动轴也必然转一转，但是两轴的瞬时角速度比却并不恒等于1，而是随时变化的。"],["角速度范围","当主动轴以角速度ω_1等速回转时，从动轴的角速度满足ω_1cosα≤ω_2≤ω_1/cosα。"],["夹角限制","变化的幅度与两轴间夹角的大小有关，两轴夹角不能过大，一般α≤30°。"]]]]},{"id":"q155","no":155,"order":155,"chap":"c12","sec":"万向铰链机构","level":"普通","q":"双万向联轴器如何实现定传动比传动？","a":"在双万向铰链机构中，为使主、从动轴的角速度恒相等，除要求主、从动轴1、3和中间轴2应位于同一平面内之外，还必须使主、从动轴1、3的轴线与中间轴2的轴线之间的夹角相等；而且中间轴两端的叉面应位于同一平面内。","exp":"解题思路：本题核心是掌握双万向联轴器抵消单万向联轴器速度波动的设计逻辑，从单万向联轴器的瞬时传动比波动特性出发，推导得到实现定传动比的两个必要条件，二者需同时满足。\n知识体系：单万向联轴器的瞬时传动比随主动轴转角周期性变化，会带来从动轴的速度波动与动载荷，仅靠单个万向联轴器无法实现定传动比。双万向联轴器通过对称布置的两个单万向联轴器抵消速度波动，除上述两个条件外，通常还要求主、从动轴与中间轴位于同一平面内。\n易错分析：常见错误为遗漏两个条件中的任意一项，尤其是容易忽略中间轴两端叉面共面的要求，或错误认为仅需要主从动轴平行即可实现定传动比，忽略夹角相等的前提。","fig":null,"page":null,"pts":[["实现定传动比的条件","在双万向铰链机构中，为使主、从动轴的角速度恒相等，除要求主、从动轴1、3和中间轴2应位于同一平面内之外，还必须使主、从动轴1、3的轴线与中间轴2的轴线之间的夹角相等；而且中间轴两端的叉面应位于同一平面内。"]]}]};
</script>
<script>
"use strict";
const ITEMS = DATA.items;
const CHAPS = DATA.meta.chapters;
const BY_ID = {}; ITEMS.forEach(it => BY_ID[it.id] = it);
const KEY = "jz_bs155_v1";

/* ---------- 日期工具 ---------- */
const pad = n => String(n).padStart(2, "0");
function dstr(d = new Date()) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function parseD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
const TODAY = dstr();
const WD = ["日", "一", "二", "三", "四", "五", "六"];

/* ---------- 状态 ---------- */
const DEFAULT = { v: 1, answers: {}, fav: {}, mastered: {}, sched: {}, manual: {}, done: {}, days: {},
  settings: { intervals: [1, 2, 4, 7, 15, 30, 60], includeCold: false, examDate: '2026-12-19' } };
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT));
    const s = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), s, { settings: Object.assign({}, DEFAULT.settings, s.settings || {}) });
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULT)); }
}
let memOnly = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!memOnly) { memOnly = true; toast("浏览器禁用了本地存储，进度只保留在本次会话"); } }
}

/* ---------- 视图状态 ---------- */
let view = "today";
const expanded = new Set();
const expOpen = new Set();
function kpOf(it) { if (it.sec) return it.sec; const c = CHAPS.find(x => x.id === it.chap); return c ? c.name : "未标注考点"; }
let libFilter = "all", libChap = "all", libQ = "";
let focusList = null, focusIdx = 0, focusShow = false;

/* ---------- 计算 ---------- */
function isMastered(id) { return !!S.mastered[id]; }
function isCold(it) { return false; }
function coldOn() { return !!S.settings.includeCold; }
function active(it) { return coldOn() || !isCold(it); }
function isFav(id) { return !!S.fav[id]; }
function sch(id) { return S.sched[id]; }
function answerOf(it) { return (S.answers[it.id] != null) ? S.answers[it.id] : it.a; }
function isEdited(it) { return S.answers[it.id] != null; }
function doneToday() { return S.done[TODAY] || []; }
function isDoneToday(id) { return doneToday().indexOf(id) >= 0; }
function inToday(id) { return (S.manual[TODAY] || []).indexOf(id) >= 0; }

function dueList() {
  return ITEMS.filter(it => {
    const s = sch(it.id);
    return s && active(it) && !isMastered(it.id) && s.due <= TODAY && !isDoneToday(it.id);
  }).sort((a, b) => (sch(a.id).due < sch(b.id).due ? -1 : 1) || a.order - b.order);
}
function newList() {
  const lvl = { hot: 0, normal: 1, cold: 2 };
  const lv = { "热门": 0, "普通": 1, "冷门": 2 };
  return ITEMS.filter(it => active(it) && !sch(it.id) && !isMastered(it.id))
    .sort((a, b) => (lv[a.level] - lv[b.level]) || (a.order - b.order));
}
function plan() {
  // 到期复习：系统按艾宾浩斯自动加入；新题：由用户自己「加入今日」
  const seen = new Set();
  const list = [];
  dueList().forEach(it => { if (!seen.has(it.id)) { seen.add(it.id); list.push({ it, kind: "复习" }); } });
  (S.manual[TODAY] || [])
    .filter(id => BY_ID[id] && !isDoneToday(id) && !isMastered(id) && !seen.has(id))
    .forEach(id => { seen.add(id); list.push({ it: BY_ID[id], kind: "自选" }); });
  return list;
}
function progress() {
  const p = plan();
  const total = p.length + doneToday().length;
  return { total, done: doneToday().length, plan: p };
}
function streak() {
  let n = 0, d = TODAY;
  if (!(S.days[TODAY] && S.days[TODAY].checkin)) d = addDays(TODAY, -1);

/* ---------- LaTeX 轻量渲染 ---------- */
const GREEK = { alpha: "α", beta: "β", gamma: "γ", delta: "δ", Delta: "Δ", epsilon: "ε", varepsilon: "ε",
  zeta: "ζ", eta: "η", theta: "θ", lambda: "λ", mu: "μ", nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ",
  Sigma: "Σ", tau: "τ", phi: "φ", varphi: "φ", chi: "χ", psi: "ψ", omega: "ω", Omega: "Ω" };
const SYM = { circ: "°", times: "×", cdot: "·", div: "÷", leq: "≤", le: "≤", geq: "≥", ge: "≥", neq: "≠",
  ne: "≠", pm: "±", sum: "Σ", infty: "∞", approx: "≈", sim: "~", quad: " ", qquad: "  ", "%": "%",
  left: "", right: "", limits: "", displaystyle: "", prime: "′", angle: "∠", perp: "⊥", parallel: "∥",
  Rightarrow: "⇒", rightarrow: "→", Leftarrow: "⇐", leftarrow: "←", degree: "°", ldots: "…", cdots: "⋯",
  cos: "cos", sin: "sin", tan: "tan", cot: "cot", arctan: "arctan", arcsin: "arcsin", arccos: "arccos",
  ln: "ln", log: "log", exp: "exp", max: "max", min: "min", lim: "lim", det: "det", mod: "mod" };
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function readGroup(s, i) {
  let depth = 0, start = i + 1;
  for (let j = i; j < s.length; j++) {
    if (s[j] === "{") depth++;
    else if (s[j] === "}") { depth--; if (!depth) return [s.slice(start, j), j + 1]; }
  }
  return [s.slice(start), s.length];
}
function tex(s) {
  let out = "", i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === "\\") {
      const m = /^\\([a-zA-Z]+)/.exec(s.slice(i));
      if (!m) {
        const ch = s[i + 1] || "";
        if (ch === "\\") out += " ";                       // LaTeX 换行
        else if (",;:! ".indexOf(ch) >= 0) out += " ";      // 细空格
        else if ("%$&#_{}".indexOf(ch) >= 0) out += esc(ch); // 转义符号
        i += 2; continue;
      }
      const name = m[1]; i += m[0].length;
      if (name === "frac" || name === "dfrac" || name === "tfrac") {
        let a = "", b = "";
        while (s[i] === " ") i++;
        if (s[i] === "{") { const r = readGroup(s, i); a = r[0]; i = r[1]; }
        while (s[i] === " ") i++;
        if (s[i] === "{") { const r = readGroup(s, i); b = r[0]; i = r[1]; }
        out += '<span class="frac"><span class="num">' + tex(a) + '</span><span class="den">' + tex(b) + "</span></span>";
      } else if (name === "sqrt") {
        let a = "";
        if (s[i] === "{") { const r = readGroup(s, i); a = r[0]; i = r[1]; }
        out += "√<span style='border-top:1px solid currentColor'>" + tex(a) + "</span>";
      } else if (name === "mathrm" || name === "text" || name === "mathbf" || name === "mathit" || name === "operatorname") {
        let a = "";
        if (s[i] === "{") { const r = readGroup(s, i); a = r[0]; i = r[1]; }
        out += name === "mathbf" ? "<b>" + tex(a) + "</b>" : tex(a);
      } else if (name === "overrightarrow" || name === "vec") {
        let a = "";
        if (s[i] === "{") { const r = readGroup(s, i); a = r[0]; i = r[1]; }
        out += '<span class="vec">' + tex(a) + "</span>";
      } else if (name === "overline" || name === "bar") {
        let a = "";
        if (s[i] === "{") { const r = readGroup(s, i); a = r[0]; i = r[1]; }
        out += '<span style="text-decoration:overline">' + tex(a) + "</span>";
      } else if (name === "underline") {
        let a = "";
        if (s[i] === "{") { const r = readGroup(s, i); a = r[0]; i = r[1]; }
        out += "<u>" + tex(a) + "</u>";
      } else {
        out += esc(GREEK[name] !== undefined ? GREEK[name] : (SYM[name] !== undefined ? SYM[name] : name));
      }
      continue;
    }
    if (c === "^" || c === "_") {
      i++;
      while (s[i] === " ") i++;
      let arg;
      if (s[i] === "{") { const r = readGroup(s, i); arg = r[0]; i = r[1]; }
      else { arg = s[i] || ""; i++; }
      out += (c === "^" ? "<sup>" : "<sub>") + tex(arg) + (c === "^" ? "</sup>" : "</sub>");
      continue;
    }
    if (c === "{") { const r = readGroup(s, i); out += tex(r[0]); i = r[1]; continue; }
    if (c === "}") { i++; continue; }
    if (c === "~") { out += " "; i++; continue; }
    out += esc(c); i++;
  }
  return out;
}
function rich(text) {
  // 扫描件 OCR 偶尔会漏掉配对的 $，因此不做 $ 分段，整段交给 tex 处理（未识别的字符原样保留）
  return tex(String(text).replace(/\$/g, " "));
}
function plainOf(it) {
  // 未编辑时按结构化要点导出纯文本（供编辑框预填与比较）
  if (S.answers[it.id] == null && it.pts && it.pts.length) {

      let s = `${"    ".repeat(ind)}${i + 1}. ${l ? l + "：" : ""}${b}`;
      if (p[2] && p[2].length) s += "\n" + flat(p[2], ind + 1);
      return s;
    }).join("\n");
    return flat(it.pts, 0);
  }
  return answerOf(it);
}
const CIRC = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
function ptsHTML(list, sub) {

    if (ITEM_RE.test(t)) return paraHTML(t);

      </div>
      <div class="row2">
        <div class="chips">${filters.map(([k, n]) => `<button class="ch ${libFilter === k ? "on" : ""}" onclick="setFilter('${k}')">${n}</button>`).join("")}</div>
        <span class="spacer"></span>
        <span class="count">共 <b>${list.length}</b> 题${libFilter === "fav" ? " · 收藏已置顶" : ""}</span>
        <button class="btn sm" onclick="toggleAllAnswers()">${allOpen ? "收起全部答案" : "一键显示全部答案"}</button>
      </div>
    </div>
    ${list.length ? list.map(it => card(it, "")).join("") : '<div class="empty">这个筛选下没有题目</div>'}`;
}
let searchTimer;
function onSearch(v) {
  libQ = v; clearTimeout(searchTimer);
  const pos = document.querySelector(".search") ? document.querySelector(".search").selectionStart : 0;
  searchTimer = setTimeout(() => { render(); const s = document.querySelector(".search"); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }, 260);
}
function setChap(c) { libChap = c; render(); }
function setFilter(f) { libFilter = f; render(); }

/* ---------- 渲染：统计 ---------- */
function viewStats() {
  const st = statsAll();
  const days = Object.keys(S.days).filter(d => S.days[d].checkin).length;
  let forecast = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(TODAY, i);
    const n = ITEMS.filter(it => active(it) && sch(it.id) && !isMastered(it.id) && sch(it.id).due === d).length;
    forecast.push({ d, n });
  }
  const mx = Math.max(1, ...forecast.map(f => f.n));

  let heat = "";
  let start = addDays(TODAY, -69);
  while (parseD(start).getDay() !== 1) start = addDays(start, -1);   // 对齐到周一
  for (let i = 0; i < 70; i++) {
    const d = addDays(start, i);
    const on = S.days[d] && S.days[d].checkin;
    heat += `<i class="${on ? "on" : ""} ${d === TODAY ? "today" : ""}" title="${d}${on ? " 已打卡" : ""}"></i>`;
  }
  let chapRows = "";
  CHAPS.forEach(c => {
    const list = ITEMS.filter(it => !isCold(it) && it.chap === c.id);
    const m = list.filter(it => isMastered(it.id)).length;
    const l = list.filter(it => sch(it.id) && !isMastered(it.id)).length;
    chapRows += `<div class="chap-row"><span>${c.name}</span>
      <span class="track"><i style="width:${m / list.length * 100}%"></i></span>
      <span style="text-align:right;color:#8a8478">${m}/${list.length}</span></div>`;
  });

  return `<div class="stat-grid">
      <div class="stat"><em>已掌握</em><b>${st.m}</b><small>/ ${st.t}</small></div>
      <div class="stat"><em>学习中</em><b>${st.l}</b><small>题</small></div>
      <div class="stat"><em>未开始</em><b>${st.n}</b><small>题 · 另冷门 ${st.cold}</small></div>
      <div class="stat"><em>累计打卡</em><b>${days}</b><small>天 · 连续 ${streak()}</small></div>
    </div>
    <div class="panel"><h3>最近 10 周打卡</h3><div class="heat">${heat}</div>
      <p style="font-size:12.5px;color:#8a8478;margin:10px 0 0">深色＝当天完成打卡；描边＝今天。每列一周（周一→周日），共 10 周。</p></div>
    <div class="panel"><h3>未来 7 天复习量（艾宾浩斯）</h3>
      <div class="bars">${forecast.map(f => `<div class="b"><i style="height:${f.n / mx * 84}px"></i>
        <span>${f.d.slice(8)}日</span><span style="color:#23262a;font-weight:650">${f.n}</span></div>`).join("")}</div>
      <p style="font-size:12.5px;color:#8a8478;margin:10px 0 0">间隔序列：${S.settings.intervals.join(" / ")} 天。答「记得」推进入下一档，答「忘记」回到第 1 档。</p></div>
    <div class="panel"><h3>各章掌握进度</h3>${chapRows}</div>`;
}

/* ---------- 渲染：设置 ---------- */
function viewSet() {
  return `<div class="panel"><h3>背诵设置</h3>
    <div class="field"><label>初试日期</label>
      <input type="date" value="${S.settings.examDate || "2026-12-19"}" onchange="setExam(this.value)" style="width:auto">
      <span class="desc">用于页头倒计时，默认 2026-12-19（2027 考研初试）</span></div>
    <div class="field"><label>复习间隔</label>
      <input type="text" value="${S.settings.intervals.join(",")}" onchange="setIntervals(this.value)">
      <span style="color:#8a8478;font-size:12.5px">单位天，逗号分隔</span>
      <div class="hint">默认 1,2,4,7,15,30,60：首次背完次日复习，之后间隔逐轮拉长。答「记得」进入下一档，「模糊」次日重来，「忘记」回到第 1 档。</div></div>
  </div>
  <div class="panel"><h3>数据</h3>
    <div class="field"><label>导出备份</label><button class="btn" onclick="exportData()">下载 JSON</button>
      <span style="color:#8a8478;font-size:12.5px">含我的答案、收藏、掌握状态与复习进度</span></div>
    <div class="field"><label>导入备份</label><input type="file" accept=".json" onchange="importData(this)">
      <span style="color:#8a8478;font-size:12.5px">会覆盖当前进度</span></div>
    <div class="field"><label>清空进度</label><button class="btn" onclick="resetAll()">重置</button>
      <span style="color:#8a8478;font-size:12.5px">不影响题库本身</span></div>
  </div>
  <div class="panel"><h3>题库信息</h3>
    <div class="field"><label>来源</label><span style="font-size:13px">${DATA.meta.source}</span></div>
    <div class="field"><label>题量</label><span style="font-size:13px">${ITEMS.length} 题 · 12 章 · ${ITEMS.filter(it => it.exp).length} 题带解析 · 2 幅插图</span></div>
    <div class="field"><label>快捷键</label><span style="font-size:13px">空格 开始背诵　专注内空格 显示答案　1 记得　2 模糊　3 忘记　F 收藏　M 已掌握</span></div>
  </div>`;
}
function setExam(v) { S.settings.examDate = v || "2026-12-19"; save(); render(); toast("初试日期已更新"); }
function setCold(on) { S.settings.includeCold = on; save(); render(); toast(on ? "冷门考点已纳入每日计划" : "冷门考点已单列，不再进入每日计划"); }
function setDailyNew(v) { S.settings.dailyNew = Math.max(0, Math.min(60, parseInt(v) || 0)); save(); render(); toast("每日新题已设为 " + S.settings.dailyNew); }
function setIntervals(v) {
  const a = v.split(/[,，\s]+/).map(x => parseInt(x)).filter(x => x > 0 && x < 365);
  if (a.length < 2) { toast("至少填两个间隔"); return; }
  S.settings.intervals = a; save(); render(); toast("间隔已更新");
}
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "机原背诵手册_进度_" + TODAY + ".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.sched) throw 0;
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), d, { settings: Object.assign({}, DEFAULT.settings, d.settings || {}) });
      save(); render(); toast("导入成功");
    } catch (e) { toast("文件格式不对"); }
  };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm("确定清空所有背诵进度（收藏、掌握、复习记录）？此操作不可撤销。")) return;
  S = JSON.parse(JSON.stringify(DEFAULT)); save(); render(); toast("已重置");
}

/* ---------- 专注模式 ---------- */
function startFocus() {
  const p = plan();
  if (!p.length) { toast("今天没有待背的题"); return; }
  focusList = p; focusIdx = 0; focusShow = false; renderFocus();
}
function focusOne(id) { focusList = [{ it: BY_ID[id], kind: "单题" }]; focusIdx = 0; focusShow = false; renderFocus(); }
function renderFocus() {
  const cur = focusList[focusIdx];
  if (!cur) { closeFocus(); return; }
  const it = cur.it;
  const old = document.querySelector(".focus"); if (old) old.remove();
  const el = document.createElement("div");
  el.className = "focus";
  el.innerHTML = `<div class="fcard">
    <div class="top"><span class="no">${it.no}</span>
      <span class="chip kp">${kpOf(it)}</span><span class="spacer"></span>
      <span>${focusIdx + 1} / ${focusList.length}</span>
      <button class="btn sm" onclick="closeFocus()">退出</button></div>
    <div class="q">${qHTML(it)}</div>
    ${it.fig ? `<div class="fig"><img src="${it.fig}"></div>` : ""}
    ${focusShow ? `<div class="answer"><div class="ans-head"><span>参考答案</span><em>第 ${it.no} 题</em></div>${answerHTML(it)}</div>
      ${it.exp ? `<div class="exp on"><div class="exp-b"><div style="font-size:10px;letter-spacing:.14em;color:#8fa39f;margin-bottom:7px">解 析</div>${expHTML(it)}</div></div>` : ""}` : `<div class="answer placeholder">先在心里过一遍要点，再点「显示答案」。</div>`}
    <div class="fbar">
      ${focusShow ? `
        <button class="btn good" onclick="focusGrade('good')">记得 <span class="kbd">1</span></button>
        <button class="btn mid" onclick="focusGrade('mid')">模糊 <span class="kbd">2</span></button>
        <button class="btn bad" onclick="focusGrade('bad')">忘记 <span class="kbd">3</span></button>` :
        `<button class="btn primary" onclick="focusReveal()">显示答案 <span class="kbd">空格</span></button>`}
      <button class="btn" onclick="focusNext()">跳过</button>
      <button class="btn" onclick="focusFav()">${isFav(it.id) ? "★ 已收藏" : "☆ 收藏"}</button>
      <span class="spacer"></span><span style="font-size:11.5px;color:#aab8b5">第 ${it.no} 题</span>
    </div></div>`;
  document.body.appendChild(el);
}
function focusReveal() { focusShow = true; renderFocus(); }
function focusGrade(r) { grade(focusList[focusIdx].it.id, r); focusIdx++; focusShow = false; if (focusIdx >= focusList.length) { closeFocus(); toast("这一轮背完了 ✅"); } else renderFocus(); }
function focusNext() { focusIdx++; focusShow = false; if (focusIdx >= focusList.length) { closeFocus(); toast("这一轮背完了"); } else renderFocus(); }
function focusFav() { toggleFav(focusList[focusIdx].it.id); renderFocus(); }
function closeFocus() { const e = document.querySelector(".focus"); if (e) e.remove(); focusList = null; render(); }

/* ---------- 路由 ---------- */
function render() {
  const v = document.getElementById("view");
  const y = window.scrollY;
  v.innerHTML = view === "today" ? viewToday() : view === "lib" ? viewLib() : view === "stats" ? viewStats() : viewSet();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === view));
  const p = progress();
  const st = statsAll();
  document.body.dataset.view = view;
  const setTxt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  setTxt("kpiToday", p.done + "/" + p.total);
  setTxt("kpiStreak", streak());
  setTxt("kpiMaster", st.m);
  setTxt("kpiMasterT", "/" + st.t);
  setTxt("railToday", p.done + "/" + p.total);
  setTxt("railStreak", streak());
  const rb = document.getElementById("railBar");
  if (rb) rb.style.width = (p.total ? Math.round(p.done / p.total * 100) : 0) + "%";
  renderSheet();
  cdTick();
  window.scrollTo(0, y);
}
/* ---------- 考研倒计时（天 + 小时，实时走字） ---------- */
function examDateStr() { return S.settings.examDate || "2026-12-19"; }
function examAt() {
  const [y, m, d] = examDateStr().split("-").map(Number);
  return new Date(y, m - 1, d, 8, 30, 0, 0).getTime();   // 初试首场 8:30 开考
}
function fmtExam() {
  const t = examDateStr().split("-");
  return `${t[0]}.${t[1]}.${t[2]} 08:30`;
}
function cdTick() {
  const box = document.getElementById("cdBox");
  if (!box) return;
  const nums = document.getElementById("cdNums");
  const k = document.getElementById("cdK");
  const dt = document.getElementById("cdDate");
  if (!nums || !k || !dt) return;
  dt.textContent = fmtExam();
  const diff = examAt() - Date.now();

  if (diff <= 0) {
    k.textContent = "初试已结束";
    nums.innerHTML = '<b>—</b>';
    box.classList.add("over");
    return;
  }
  box.classList.remove("over");
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);

  if (days > 0) {
    k.textContent = "距初试还有";
    nums.innerHTML = `<b>${days}</b><span class="cd-u">天</span><span class="cd-z">零</span><b>${hours}</b><span class="cd-u">小时</span>`;
  } else {
    k.textContent = "就是今天";
    nums.innerHTML = `<b>${hours}</b><span class="cd-u">小时</span><span class="cd-z">零</span><b>${mins}</b><span class="cd-u">分</span>`;
  }
}
setInterval(() => { try { cdTick(); } catch (e) {} }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) cdTick(); });

function renderSheet() {
  const grid = document.getElementById("sheetGrid");
  if (!grid) return;
  let done = 0, ok = 0;
  const html = ITEMS.map(it => {
    const isOk = !!S.mastered[it.id];
    const isDone = isOk || !!S.sched[it.id];
    if (isDone) done++;
    if (isOk) ok++;
    const cls = isOk ? "ok" : (isDone ? "done" : "");
    return `<button class="b ${cls}" title="第${it.no}题 · ${it.sec}" onclick="openFromSheet('${it.id}')">${it.no}</button>`;
  }).join("");
  grid.innerHTML = html;
  const cnt = document.getElementById("shCount");
  if (cnt) cnt.textContent = done + " / " + ITEMS.length;
  const bar = document.getElementById("shBar");
  if (bar) bar.style.width = (done / ITEMS.length * 100).toFixed(1) + "%";
}
function openFromSheet(id) {
  const s = document.getElementById("sheet");
  if (s) s.classList.remove("open");
  focusOne(id);
}
function toggleSheet() {
  const s = document.getElementById("sheet");
  if (!s) return;
  s.classList.toggle("open");
  document.body.classList.toggle("sheet-open", s.classList.contains("open"));
}
function go(v) { view = v; if (location.hash.slice(1) !== v) location.hash = v; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) go(b.dataset.v); });
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if (v !== view && ["today", "lib", "stats", "set"].indexOf(v) >= 0) { view = v; render(); }
});

/* ---------- 快捷键 ---------- */
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) return;
  const onFocus = !!document.querySelector(".focus");
  if (e.key === "Escape" && onFocus) { closeFocus(); return; }
  if (onFocus) {
    if (e.code === "Space") { e.preventDefault(); focusShow ? focusNext() : focusReveal(); }
    if (e.key === "1" && focusShow) focusGrade("good");
    if (e.key === "2" && focusShow) focusGrade("mid");
    if (e.key === "3" && focusShow) focusGrade("bad");
    if (e.key === "f") focusFav();
    return;
  }
  if (e.code === "Space") { e.preventDefault(); startFocus(); }
});

const _initView = location.hash.slice(1);
if (["today", "lib", "stats", "set"].indexOf(_initView) >= 0) view = _initView;
render();
</script>
</body>
</html>
